function toggleWk(id) {
  const t = S.weekly.find(w=>w.id===id);
  if (t) {
    t.done = !t.done;
    if (t.day) {
      if (!S.done[t.day]) S.done[t.day] = {};
      S.done[t.day][id] = t.done;
    }
    save(); render();
  }
}

function cycleDay(id, el) {
  const t = S.weekly.find(w=>w.id===id);
  if (!t) return;

  const existing = document.getElementById('day-picker');
  if (existing) existing.remove();

  const mon = getMon(new Date());
  const wk = getWeek(mon);
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const picker = document.createElement('div');
  picker.id = 'day-picker';
  picker.style.cssText = 'position:fixed;z-index:999;background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,0.5);';
  const rect = el.getBoundingClientRect();
  picker.style.top = (rect.bottom + 4) + 'px';
  picker.style.left = (rect.left - 40) + 'px';

  wk.forEach((d, i) => {
    const dk = d.toLocalDate();
    const isCurrent = dk === t.day;
    const btn = document.createElement('button');
    btn.textContent = dayNames[i];
    btn.style.cssText = `display:block;width:100%;padding:5px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;border:none;background:${isCurrent?'var(--accent-bg)':'none'};color:${isCurrent?'var(--accent)':'var(--text2)'};cursor:pointer;text-align:left;border-radius:4px;`;
    btn.onmouseenter = () => { if(!isCurrent) btn.style.background='var(--s3)'; };
    btn.onmouseleave = () => { if(!isCurrent) btn.style.background='none'; };
    btn.onclick = () => {
      t.day = dk;
      save();
      picker.remove();
      render();
    };
    picker.appendChild(btn);
  });

  document.body.appendChild(picker);

  setTimeout(() => {
    const close = (e) => {
      if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('click', close); }
    };
    document.addEventListener('click', close);
  }, 10);
}

function rmWk(id) {
  S.weekly = S.weekly.filter(w=>w.id!==id);
  save(); render();
}

// ── FOCUS CARD HELPERS ──
function getCurrentBlock() {
  if (viewDay !== today() || isWeekend(today())) return null;
  const now = getNow();
  for (const b of TEMPLATE) {
    const s = timeToMin(b.time), e = timeToMin(b.end);
    if (now >= s && now < e) return b;
  }
  return null;
}

function getNextBlock() {
  if (isWeekend(today())) return null;
  const now = getNow();
  for (const b of TEMPLATE) {
    const s = timeToMin(b.time);
    if (now < s) return b;
  }
  return null;
}

function formatCountdown(mins) {
  if (mins <= 0) return 'ending now';
  if (mins < 60) return `${mins}min left`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m > 0 ? `${h}h ${m}m left` : `${h}h left`;
}

// ── RENDER ──
function render() {
  renderMain();
  renderNn();
  renderEvents();
  renderWeek();
  renderStats();
  renderPaText();
}

function renderMain() {
  const el = document.getElementById('main');
  const baseMon = getMon(new Date());
  const mon = new Date(baseMon);
  mon.setDate(mon.getDate() + viewWeekOffset * 7);
  const wk = getWeek(mon);
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const isThisWeek = viewWeekOffset === 0;

  const wkStart = wk[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const wkEnd = wk[6].toLocaleDateString('en-GB',{day:'numeric',month:'short'});

  const h = new Date().getHours();
  let greet = viewDay !== today() ?
    new Date(viewDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'})+"'s Plan" :
    h<12 ? 'Good morning, Ben' : h<17 ? 'Good afternoon, Ben' : 'Good evening, Ben';
  const dateLine = new Date(viewDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  let htm = `
    <div class="hdr">
      <div class="greeting">${greet}</div>
      <div class="date-line" style="display:flex;align-items:center;gap:8px;position:relative;">
        <span style="cursor:pointer;" onclick="toggleCalendar()">${dateLine}</span>
        <span onclick="toggleCalendar()" style="cursor:pointer;font-size:8px;color:var(--muted);transition:color .12s;" onmouseenter="this.style.color='var(--accent)'" onmouseleave="this.style.color='var(--muted)'">&#9660;</span>
        ${!isThisWeek ? `<button onclick="goThisWeek()" style="background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:4px;padding:2px 8px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:0.5px;">TODAY</button>` : ''}
        ${(()=>{
          const vdDow = new Date(viewDay+'T12:00:00').getDay();
          const isRealWeekday = vdDow !== 0 && vdDow !== 6;
          if (!isRealWeekday) return '';
          const off = isDayOff(viewDay);
          return `<button onclick="toggleDayOff('${viewDay}')" style="background:${off?'rgba(196,80,80,0.15)':'var(--s2)'};border:1px solid ${off?'rgba(196,80,80,0.3)':'var(--border)'};border-radius:4px;padding:2px 8px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;color:${off?'#c45050':'var(--muted)'};letter-spacing:0.5px;transition:all .12s;" onmouseenter="this.style.borderColor='var(--accent-border)'" onmouseleave="this.style.borderColor='${off?'rgba(196,80,80,0.3)':'var(--border)'}'">${off?'BACK TO WORK':'DAY OFF'}</button>`;
        })()}
        <div id="calendarDrop"></div>
      </div>
      <div class="day-nav">
        <button class="day-btn" onclick="changeWeek(-1)" title="Previous week" style="padding:5px 8px;">&#8592;</button>
        ${wk.map((d,i)=>{
          const dk = d.toLocalDate();
          const isTd = dk===today();
          const isAct = dk===viewDay;
          const hasTasks = S.weekly.some(w=>w.day===dk&&!w.done) || Object.keys(S.custom[dk]||{}).length>0 || getUpcomingEvents().some(e=>e.nextDate.toLocalDate()===dk);
          return `<button class="day-btn ${isAct?'active':''} ${hasTasks&&!isAct?'has-tasks':''}" onclick="switchDay('${dk}')">${isTd?'Today':dayNames[i]}</button>`;
        }).join('')}
        <button class="day-btn" onclick="changeWeek(1)" title="Next week" style="padding:5px 8px;">&#8594;</button>
      </div>
    </div>`;

  // ── FOCUS CARD (today only, weekdays) ──
  if (viewDay === today() && !isWeekend(viewDay)) {
    const curBlock = getCurrentBlock();
    if (curBlock && !curBlock.isBreak) {
      const now = getNow();
      const blockEnd = timeToMin(curBlock.end);
      const blockStart = timeToMin(curBlock.time);
      const minsLeft = blockEnd - now;
      const elapsed = now - blockStart;
      const totalDur = blockEnd - blockStart;
      const pctElapsed = Math.round((elapsed / totalDur) * 100);

      // Get next incomplete task in this block
      const { recurring, weekly, custom } = blockTasks(curBlock.id, viewDay);
      const allBlockTasks = [...recurring, ...weekly, ...custom];
      const nextTask = allBlockTasks.find(t => !isDone(t.id, viewDay));
      const focusText = nextTask ? nextTask.text : curBlock.sub;

      htm += `
        <div class="focus-card">
          <div class="focus-label"><div class="focus-pulse"></div>FOCUS NOW</div>
          <div class="focus-title">${curBlock.title}</div>
          <div class="focus-sub">${focusText}</div>
          <div class="focus-countdown">
            <span>${formatCountdown(minsLeft)}</span>
            <div class="focus-countdown-bar">
              <div class="focus-countdown-fill" style="width:${pctElapsed}%"></div>
            </div>
            <span>${curBlock.end}</span>
          </div>
        </div>`;
    } else if (curBlock && curBlock.isBreak) {
      const next = getNextBlock();
      if (next) {
        htm += `
          <div class="focus-card" style="border-left-color:var(--c-break);">
            <div class="focus-label"><div class="focus-pulse" style="background:var(--c-break);"></div>ON BREAK</div>
            <div class="focus-title">${curBlock.title}</div>
            <div class="focus-sub">Next up: ${next.title} at ${next.time}</div>
          </div>`;
      }
    } else if (isEveningMode(viewDay)) {
      // Evening mode — workday's done
      const out = getOutstandingPastTasks(viewDay);
      const ev = eveningTasks(viewDay);
      const evDone = ev.filter(t => isDone(t.id, viewDay)).length;
      let sub;
      if (out.length > 0) sub = `${out.length} task${out.length>1?'s':''} still outstanding from today.`;
      else if (ev.length > 0 && evDone === ev.length) sub = "Workday clean. Evening list clean. Real rest.";
      else if (ev.length > 0) sub = `${evDone}/${ev.length} done tonight.`;
      else sub = "Workday wrapped. What's on tonight?";
      htm += `
        <div class="focus-card focus-evening">
          <div class="focus-label"><div class="focus-pulse"></div>OFF THE CLOCK</div>
          <div class="focus-title">Evening</div>
          <div class="focus-sub">${sub}</div>
        </div>`;
    } else {
      // Before 9am
      const next = getNextBlock();
      if (next) {
        htm += `
          <div class="focus-card" style="border-left-color:var(--muted);background:var(--s2);">
            <div class="focus-label" style="color:var(--muted);"><div class="focus-pulse" style="background:var(--muted);"></div>NEXT UP</div>
            <div class="focus-title">${next.title}</div>
            <div class="focus-sub">Starts at ${next.time}</div>
          </div>`;
      }
    }
  }

  // Events visible in sidebar — no banners needed
  const isWknd = isWeekend(viewDay);

  // Short-day capacity banner + NN strip — only on weekdays
  if (!isWknd) {
    htm += shortDayCapacityHtml(viewDay);
    htm += nnStripHtml(viewDay);
  }

  // Progress
  const tmpl = getTemplateForDay(viewDay);
  const allT = getAllTasks(viewDay);
  const doneC = allT.filter(t=>isDone(t.id, viewDay)).length;
  const pct = allT.length ? Math.round(doneC/allT.length*100) : 0;
  const nnDone = isWknd ? 0 : NN.filter(n=>isDone(n.link, viewDay)).length;
  const totalMins = tmpl.filter(b=>!b.isBreak).reduce((s,b)=>s+b.dur,0);

  if (!isWknd) {
    htm += `
      <div class="prog">
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div class="prog-text"><strong>${pct}%</strong></div>
      </div>
      <div class="prog-detail">
        <div class="pd"><b>${doneC}</b>/${allT.length} tasks</div>
        <div class="pd"><b>${nnDone}</b>/${NN.length} non-negs</div>
        <div class="pd"><b>${Math.floor(totalMins/60)}h${totalMins%60>0?totalMins%60+'m':''}</b> blocked</div>
      </div>`;

  }

  // Blocks
  htm += '<div class="blocks">';

  if (isWknd) {
    // ── WEEKEND VIEW ──
    const weekendTasks = ((S.custom[viewDay]||{})['weekend']) || [];
    const weeklyForDay = S.weekly.filter(w => w.day === viewDay);
    const dayEvents = getUpcomingEvents().filter(e => {
      return e.nextDate.toLocalDate() === viewDay;
    });

    const dow = new Date(viewDay + 'T00:00:00').getDay();
    const recurForDay = S.recurring.filter(r => r.dayOfWeek === dow);
    const allWeekendItems = [
      ...dayEvents.map(e => ({ ...e, _type: 'event' })),
      ...recurForDay.map(t => ({ ...t, _type: 'recurring' })),
      ...weekendTasks.map(t => ({ ...t, _type: 'task' })),
      ...weeklyForDay.map(t => ({ ...t, _type: 'weekly' })),
    ].sort((a, b) => {
      const tA = a.time ? timeToMin(a.time) : 9999;
      const tB = b.time ? timeToMin(b.time) : 9999;
      return tA - tB;
    });

    if (allWeekendItems.length === 0) {
      htm += `<div style="padding:40px 0;text-align:center;">
        <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;">${isDayOff(viewDay)?'Day off. Enjoy.':'Weekend. No plans.'}</div>
        <div style="font-size:13px;color:var(--muted);">Add something via your PA if you need to.</div>
      </div>`;
    } else {
      allWeekendItems.forEach(item => {
        if (item._type === 'event') {
          const locStr = item.location ? ` &middot; ${item.location}` : '';
          const notesStr = item.notes ? ` &middot; ${item.notes}` : '';
          htm += `<div class="block" style="border-left:3px solid var(--accent);cursor:pointer;" onclick="editEvent('${item.id}')">
            <div class="bk-hd">
              <div class="bk-cat" style="background:var(--accent);"></div>
              <div class="bk-time">${item.time || ''}</div>
              <div class="bk-info">
                <div class="bk-title">${item.text}</div>
                <div class="bk-sub">Event${locStr}${notesStr}</div>
              </div>
            </div>
          </div>`;
        } else {
          const done = isDone(item.id, viewDay);
          const editType = item._type === 'weekly' ? 'w' : item._type === 'recurring' ? 'rec' : 'c';
          const editBid = item._type === 'task' ? 'weekend' : '';
          const notesHtml = item.notes ? `<div class="t-bullets" style="margin-top:4px;">${item.notes.split('\n').filter(l=>l.trim()).map(l=>`<div class="t-bullet">${l.trim()}</div>`).join('')}</div>` : '';
          const repeatTag = item._type === 'recurring' ? '<span style="font-family:JetBrains Mono,monospace;font-size:9px;color:var(--accent);opacity:0.7;margin-left:6px;">REPEATS</span>' : '';
          const canDrag = item._type === 'task' || item._type === 'weekly';
          const canMove = item._type === 'task';
          htm += `<div class="block" ${canDrag?`draggable="true" ondragstart="dragTask(event,'${editType}','weekend','${item.id}')"`:''}>
            <div class="bk-hd" style="cursor:pointer;" onclick="editTask('${editType}','${editBid}','${item.id}')">
              <div class="bk-cat cat-bg-${item.cat||'life'}"></div>
              <div class="bk-time">${item.time || ''}</div>
              <div class="bk-info">
                <div class="bk-title" style="${done?'text-decoration:line-through;color:var(--muted);':''}">${item.text}${repeatTag}</div>
                <div class="bk-sub">${item.dur||30}min${item._type==='weekly'?' / weekly':''}${item._type==='recurring'?' / every week':''}</div>
                ${notesHtml}
              </div>
              <div class="tck ${done?'done':''}" onclick="event.stopPropagation();toggle('${item.id}')" style="flex-shrink:0;"></div>
              ${canMove?`<span class="t-move" onclick="event.stopPropagation();moveCustomTask('weekend','${item.id}',this)" title="Move to another day" style="flex-shrink:0;">&#8644;</span>`:''}
              ${item._type==='task'?`<span class="t-rm" onclick="event.stopPropagation();rmWeekendTask('${item.id}')" style="flex-shrink:0;">&times;</span>`:''}
              ${item._type==='recurring'?`<span class="t-rm" onclick="event.stopPropagation();rmRecurring('${item.id}')" style="flex-shrink:0;">&times;</span>`:''}
            </div>
          </div>`;
        }
      });
    }
  } else {
    // ── WEEKDAY VIEW ──
    const curBlock = viewDay===today() ? tmpl.find(b=>blockStatus(b)==='now') : null;

    // Separate past and non-past blocks (only for today)
    const isToday = viewDay === today();
    const pastBlocks = isToday ? tmpl.filter(b => blockStatus(b) === 'past') : [];
    const nonPastBlocks = isToday ? tmpl.filter(b => blockStatus(b) !== 'past') : tmpl;

    // ── COMPUTE DAY EVENTS (needed for both past and future blocks) ──
    const dayEventsAll = getUpcomingEvents().filter(e => e.nextDate.toLocalDate() === viewDay);
    const dayEvents = dayEventsAll.filter(e => e.time).sort((a,b) => timeToMin(a.time) - timeToMin(b.time));
    const dayEventsNoTime = dayEventsAll.filter(e => !e.time);
    const usedEventIds = new Set();

    // ── EVENING MODE: Evening + Outstanding go on top ──
    const inEveningMode = isEveningMode(viewDay);
    const hasEveningTasks = eveningTasks(viewDay).length > 0;
    if (inEveningMode) {
      htm += renderEveningBlock(viewDay);
      htm += renderOutstanding(getOutstandingPastTasks(viewDay));
    }

    // ── PAST BLOCKS SUMMARY (collapsed by default) ──
    if (pastBlocks.length > 0) {
      let pastDone = 0, pastTotal = 0;
      for (const b of pastBlocks) {
        if (b.isBreak) continue;
        const { recurring, weekly, custom } = blockTasks(b.id, viewDay);
        const all = [...recurring, ...weekly, ...custom];
        pastTotal += all.length;
        pastDone += all.filter(t => isDone(t.id, viewDay)).length;
      }
      const lastPast = pastBlocks[pastBlocks.length - 1];

      htm += `<div class="past-summary" onclick="togglePast()">
        <div class="past-summary-text">
          <strong>${pastBlocks.filter(b=>!b.isBreak).length} blocks</strong> completed &mdash;
          ${pastDone}/${pastTotal} tasks done (up to ${lastPast.end})
        </div>
        <div class="past-summary-toggle">${showPastBlocks ? 'HIDE' : 'SHOW'}</div>
      </div>`;

      // ── MISSED TASKS (incomplete from past blocks) ──
      // Suppressed in evening mode — replaced by the Outstanding section above.
      if (!showPastBlocks && !inEveningMode) {
        let missedHtml = '';
        for (const b of pastBlocks) {
          if (b.isBreak) continue;
          const { recurring, weekly, custom } = blockTasks(b.id, viewDay);
          const all = [...recurring, ...weekly, ...custom];
          const missed = all.filter(t => !isDone(t.id, viewDay));
          for (const t of missed) {
            const d = isDone(t.id, viewDay);
            missedHtml += `
              <div class="task" style="display:flex;align-items:center;gap:8px;">
                <div class="tck ${d?'done':''}" onclick="toggle('${t.id}')"></div>
                <div class="t-text" style="flex:1;font-size:13px;color:var(--text2);">${t.text}</div>
                <span class="t-block-tag">${b.time}</span>
              </div>`;
          }
        }
        if (missedHtml) {
          htm += `<div class="missed-tasks">
            <div class="missed-hd">${pastTotal - pastDone} missed</div>
            ${missedHtml}
          </div>`;
        }
      }

      if (showPastBlocks) {
        let pastEvIdx = 0;
        for (const b of pastBlocks) {
          const bStart = timeToMin(b.time);
          while (pastEvIdx < dayEvents.length && timeToMin(dayEvents[pastEvIdx].time) < bStart) {
            htm += renderInlineEvent(dayEvents[pastEvIdx]);
            usedEventIds.add(dayEvents[pastEvIdx].id);
            pastEvIdx++;
          }
          htm += renderBlock(b, curBlock);
        }
        // Any events between last past block and first non-past block
        const lastPastEnd = pastBlocks.length > 0 ? timeToMin(pastBlocks[pastBlocks.length-1].end) : 0;
        const firstNonPastStart = nonPastBlocks.length > 0 ? timeToMin(nonPastBlocks[0].time) : 2400;
        while (pastEvIdx < dayEvents.length && timeToMin(dayEvents[pastEvIdx].time) < firstNonPastStart) {
          htm += renderInlineEvent(dayEvents[pastEvIdx]);
          usedEventIds.add(dayEvents[pastEvIdx].id);
          pastEvIdx++;
        }
      }
    }

    // ── CURRENT + FUTURE BLOCKS (with inline events) ──

    // Events without a time show at top of day
    for (const ev of dayEventsNoTime) {
      htm += renderInlineEvent({ ...ev, time: '' });
    }

    // Merge blocks and timed events into one chronological list
    let evIdx = 0;
    for (const b of nonPastBlocks) {
      const bStart = timeToMin(b.time);
      // Insert any events that come before this block
      while (evIdx < dayEvents.length && timeToMin(dayEvents[evIdx].time) < bStart) {
        if (!usedEventIds.has(dayEvents[evIdx].id)) {
          htm += renderInlineEvent(dayEvents[evIdx]);
        }
        evIdx++;
      }
      htm += renderBlock(b, curBlock);
    }
    // Any remaining events after all blocks
    while (evIdx < dayEvents.length) {
      if (!usedEventIds.has(dayEvents[evIdx].id)) {
        htm += renderInlineEvent(dayEvents[evIdx]);
      }
      evIdx++;
    }

    // Past day with evening tasks — render Evening section at the end
    if (!inEveningMode && hasEveningTasks) {
      htm += renderEveningBlock(viewDay);
    }

    // Parking Lot — always rendered for weekdays, even if empty (template task seeds it)
    htm += renderParkingLot(viewDay);
  }
  // Quick inline add
  const eveningAdd = !isWeekend(viewDay) && isEveningMode(viewDay);
  const qaPlaceholder = eveningAdd
    ? 'Add to evening...'
    : `Add a task to ${viewDay===today()?'today':new Date(viewDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'})}...`;
  htm += `<div class="quick-add" onclick="focusQuickAdd()">
    <span class="quick-add-icon">+</span>
    <input class="quick-add-inp" id="quickAddInp" type="text" placeholder="${qaPlaceholder}"
      onkeydown="if(event.key==='Enter')quickAdd()" onfocus="this.parentElement.classList.add('focused')" onblur="this.parentElement.classList.remove('focused')">
  </div>`;

  htm += '</div>';
  el.innerHTML = htm;

  // Update page title
  const curBlockForTitle = (viewDay === today() && !isWeekend(viewDay)) ? tmpl.find(b => blockStatus(b) === 'now') : null;
  document.title = curBlockForTitle ? `${curBlockForTitle.title} | Daily OS` : 'Daily OS';

  // Scroll to current
  if (viewDay===today() && !isWeekend(viewDay)) {
    const now = document.querySelector('.block.is-now');
    if (now) setTimeout(()=>now.scrollIntoView({behavior:'smooth',block:'center'}), 80);
  }
}

function renderInlineEvent(ev) {
  const isPast = viewDay === today() && ev.time && timeToMin(ev.time) < getNow();
  const locStr = ev.location ? ` &middot; ${ev.location}` : '';
  const notesStr = ev.notes ? ` &middot; ${ev.notes}` : '';
  return `<div class="inline-event ${isPast?'is-past':''}" onclick="editEvent('${ev.id}')">
    <div class="ie-bar"></div>
    <div class="ie-time">${ev.time}</div>
    <div class="ie-info">
      <div class="ie-title">${ev.text}</div>
      ${(ev.location || ev.notes) ? `<div class="ie-sub">${locStr}${notesStr}</div>` : ''}
    </div>
    <div class="ie-badge">EVENT</div>
  </div>`;
}

function renderBlock(b, curBlock) {
  const st = blockStatus(b);
  const isNow = curBlock && b.id === curBlock.id;
  const { recurring, weekly, custom } = blockTasks(b.id, viewDay);
  const all = [...recurring, ...weekly, ...custom];
  const bd = all.filter(t=>isDone(t.id, viewDay)).length;
  const bt = all.length;
  const allDone = bt>0 && bd===bt;
  const totalMins = all.reduce((s,t) => s + (t.dur || 15), 0);
  const overCap = totalMins > b.dur;
  const shouldOpen = isNow || openBlocks.has(b.id); // current block + manually opened blocks stay open
  const justAdded = b.id === _lastAddedBlock;

  const workCls = b.workZone ? 'work-zone' : '';
  let htm = `
    <div class="block ${workCls} ${isNow?'is-now':''} ${st==='past'?'is-past':''} ${b.isBreak?'is-break':''} ${justAdded?'just-added':''} ${shouldOpen?'expanded':''}" data-block="${b.id}">
      <div class="bk-hd" onclick="togBlock('${b.id}')"
        ondragover="dragOverBlock(event)" ondragleave="dragLeaveBlock(event)" ondrop="dropTask(event,'${b.id}')"
      >
        <div class="bk-cat cat-bg-${b.cat}"></div>
        <div class="bk-time">${b.time} - ${b.end}</div>
        <div class="bk-info">
          <div class="bk-title">${b.title} ${isNow?'<span class="now-tag">NOW</span>':''}${b.id==='gym'?'<span class="gym-gear" onclick="event.stopPropagation();toggleGymPicker()" title="Change gym days">&#9881;</span>':''}</div>
          <div class="bk-sub">${b.sub}</div>
        </div>
        ${bt>0?`<div class="bk-prog ${allDone?'all-done':''}">${bd}/${bt}</div>`:''}
        ${totalMins > 0 ? `<div class="bk-cap ${overCap?'over':''}">${totalMins}/${b.dur}m</div>` : ''}
        ${!b.isBreak?`<div class="bk-chev ${shouldOpen?'open':''}" id="ch-${b.id}">&#9654;</div>`:''}
      </div>
      ${!b.isBreak?`
      <div class="bk-body ${shouldOpen?'open':''}" id="bd-${b.id}"

// ── DRAG AND DROP ──
function dragTask(e, type, fromBid, tid) {
  e.dataTransfer.setData('text/plain', JSON.stringify({ type, fromBid, tid }));
  e.dataTransfer.effectAllowed = 'move';
  // Add dragging class after a tick so it doesn't affect the drag image
  setTimeout(() => e.target.closest('.task, .ot-row')?.classList.add('dragging'), 0);
}
function dragOverBlock(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dragLeaveBlock(e) {
  e.currentTarget.classList.remove('drag-over');
}
function dropTask(e, toBid) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  let data;
  try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  const { type, fromBid, tid } = data;
  if (fromBid === toBid) return; // dropped on same block

  let task;
  if (type === 'c') {
    const c = (S.custom[viewDay] || {})[fromBid];
    if (!c) return;
    const idx = c.findIndex(t => t.id === tid);
    if (idx === -1) return;
    task = c.splice(idx, 1)[0];
  } else if (type === 'w') {
    task = S.weekly.find(w => w.id === tid);
    if (!task) return;
    if (toBid === 'evening') {
      // Convert weekly to a custom evening task for today
      const idx = S.weekly.findIndex(w => w.id === tid);
      if (idx > -1) S.weekly.splice(idx, 1);
      if (!S.custom[viewDay]) S.custom[viewDay] = {};
      if (!S.custom[viewDay]['evening']) S.custom[viewDay]['evening'] = [];
      S.custom[viewDay]['evening'].push({
        id: task.id, text: task.text, dur: task.dur, cat: task.cat, nn: task.nn, notes: task.notes, done: false
      });
      _lastAddedBlock = 'evening';
      save(); render();
      return;
    }
    const targetBlock = TEMPLATE.find(b => b.id === toBid);
    if (targetBlock) task.cat = targetBlock.cat;
    openBlocks.add(toBid);
    save(); render();
    return;
  } else if (type === 'rec') {
    // User-recurring → drop a one-off custom copy at the target (e.g. evening)
    const r = S.recurring.find(x => x.id === tid);
    if (!r) return;
    if (!S.custom[viewDay]) S.custom[viewDay] = {};
    if (!S.custom[viewDay][toBid]) S.custom[viewDay][toBid] = [];
    S.custom[viewDay][toBid].push({
      id: r.id, text: r.text, dur: r.dur, cat: r.cat, notes: r.notes, done: false
    });
    if (toBid === 'evening') _lastAddedBlock = 'evening';
    else openBlocks.add(toBid);
    save(); render();
    return;
  } else if (type === 'r') {
    // Template/recurring task — hide from original block today, copy to target as custom
    const srcBlock = TEMPLATE.find(b => b.id === fromBid);
    const srcTask = srcBlock?.tasks?.find(t => t.id === tid);
    if (!srcTask) return;
    // Store a move override for today
    if (!S.taskMoves) S.taskMoves = {};
    if (!S.taskMoves[viewDay]) S.taskMoves[viewDay] = {};
    S.taskMoves[viewDay][tid] = toBid;
    // Create custom copy in target block
    task = { id: tid, text: srcTask.text, dur: srcTask.dur || 15, nn: srcTask.nn, done: false, cat: srcTask.cat || 'admin' };
    if (!S.custom[viewDay]) S.custom[viewDay] = {};
    if (!S.custom[viewDay][toBid]) S.custom[viewDay][toBid] = [];
    S.custom[viewDay][toBid].push(task);
    openBlocks.add(toBid);
    save(); render();
    return;
  }

  if (!task) return;
  // Update category to match target block
  const targetBlock = TEMPLATE.find(b => b.id === toBid);
  if (targetBlock) task.cat = targetBlock.cat;

  if (!S.custom[viewDay]) S.custom[viewDay] = {};
  if (!S.custom[viewDay][toBid]) S.custom[viewDay][toBid] = [];
  S.custom[viewDay][toBid].push(task);

  openBlocks.add(toBid);
  save(); render();
}

function blockQuickAdd(blockId, inp) {
  const text = inp.value.trim();
  if (!text) return;
  const cat = detectCat(text) || (blockId === 'evening' ? 'life' : TEMPLATE.find(b=>b.id===blockId)?.cat) || 'admin';
  const dur = parseDuration(text) || 30;
  let cleanText = text.replace(/\b\d+(?:\.\d+)?\s*(?:hours?|hrs?|mins?|minutes?)\b/gi, '').replace(/\s{2,}/g,' ').trim() || text;
  const taskId = 'ct' + uid();
  if (!S.custom[viewDay]) S.custom[viewDay] = {};
  if (!S.custom[viewDay][blockId]) S.custom[viewDay][blockId] = [];
  S.custom[viewDay][blockId].push({ id: taskId, text: cleanText, done: false, cat, dur });
  _lastAddedTaskId = taskId;
  openBlocks.add(blockId);
  save();
  render();
  // Re-focus the input in the same block after render
  setTimeout(() => {
    const newInp = document.querySelector(`#bd-${blockId} .bk-add-inp`);
    if (newInp) newInp.focus();
  }, 50);
}

function quickAdd() {
  const inp = document.getElementById('quickAddInp');
  const text = inp.value.trim();
  if (!text) return;

  const cat = detectCat(text) || 'life';
  const dur = parseDuration(text) || 30;
  let cleanText = text.replace(/\b\d+(?:\.\d+)?\s*(?:hours?|hrs?|mins?|minutes?)\b/gi, '').replace(/\s{2,}/g,' ').trim() || text;
  const taskId = 'ct' + uid();

  if (isWeekend(viewDay)) {
    if (!S.custom[viewDay]) S.custom[viewDay] = {};
    if (!S.custom[viewDay]['weekend']) S.custom[viewDay]['weekend'] = [];
    S.custom[viewDay]['weekend'].push({ id: taskId, text: cleanText, done: false, cat, dur });
  } else if (isEveningMode(viewDay)) {
    if (!S.custom[viewDay]) S.custom[viewDay] = {};
    if (!S.custom[viewDay]['evening']) S.custom[viewDay]['evening'] = [];
    S.custom[viewDay]['evening'].push({ id: taskId, text: cleanText, done: false, cat, dur });
    _lastAddedBlock = 'evening';
  } else {
    const blk = smartBlock(cat, viewDay, dur);
    if (!S.custom[viewDay]) S.custom[viewDay] = {};
    if (!S.custom[viewDay][blk]) S.custom[viewDay][blk] = [];
    S.custom[viewDay][blk].push({ id: taskId, text: cleanText, done: false, cat, dur });
    _lastAddedBlock = blk;
    openBlocks.add(blk);
  }
  _lastAddedTaskId = taskId;
  save();
  render();
  // Re-focus the input after render
  setTimeout(() => document.getElementById('quickAddInp')?.focus(), 50);
}

function getAllTasks(day) {
  let all = [];
  const dow = new Date(day + 'T00:00:00').getDay();
  const recur = S.recurring.filter(r => r.dayOfWeek === dow);
  if (isWeekend(day)) {
    const wknd = ((S.custom[day]||{})['weekend']) || [];
    const wkly = S.weekly.filter(w => w.day === day);
    all.push(...wknd, ...wkly, ...recur);
  } else {
    for (const b of TEMPLATE) {
      if (b.isBreak) continue;
      const {recurring,weekly,custom} = blockTasks(b.id, day);
      all.push(...recurring,...weekly,...custom);
    }
    all.push(...eveningTasks(day));
  }
  return all;
}

function renderPaText() {
  const el = document.getElementById('paText');
  if (isWeekend(viewDay)) { el.textContent = "Weekend. Recharge. Add anything personal via Quick Add if you need to."; return; }
  if (viewDay !== today()) { el.textContent = "Planning ahead. Good. Assign weekly tasks then come back to today."; return; }
  const h = new Date().getHours();
  const d = S.done[today()]||{};
  const nn = NN.filter(n=>d[n.link]).length;
  const all = getAllTasks(today());
  const done = all.filter(t=>isDone(t.id,today())).length;

  if (h<9) el.textContent = "Your schedule starts at 09:00. Rest up.";
  else if (h<11 && nn===0) el.textContent = "Zero non-negotiables done. Start with the easiest one. Momentum builds.";
  else if (h<12 && nn<3) el.textContent = `${nn}/${NN.length} non-negs. Get to 3 before lunch.`;
  else if (nn===NN.length && done===all.length) el.textContent = "Clean sweep. Every box ticked. Go enjoy your evening.";
  else if (nn===NN.length) el.textContent = `All non-negs done. ${all.length-done} tasks left. Keep pushing.`;
  else if (h>=16) el.textContent = `Day wrapping up. ${nn}/${NN.length} non-negs, ${done}/${all.length} tasks. Finish the EOD wrap.`;
  else el.textContent = `${done}/${all.length} done. ${NN.length-nn} non-negs remaining. Stay in the blocks.`;
}

// ── INTERACTIONS ──
function togBlock(id) {
  const b = document.getElementById('bd-'+id);
  const c = document.getElementById('ch-'+id);
  if (!b) return;
  const opening = !b.classList.contains('open');
  b.classList.toggle('open');
  if (c) c.classList.toggle('open');
  // Toggle expanded class on parent block
  const block = b.closest('.block');
  if (block) block.classList.toggle('expanded', opening);
  // Track manually opened/closed blocks so render() preserves state
  if (opening) openBlocks.add(id);
  else openBlocks.delete(id);
}

function toggleSbSearch() {

function togglePast() {
  showPastBlocks = !showPastBlocks;
  render();
}

function switchDay(dk) { viewDay = dk; render(); }
function changeWeek(dir) {
  viewWeekOffset += dir;
  const baseMon = getMon(new Date());
  const mon = new Date(baseMon);
  mon.setDate(mon.getDate() + viewWeekOffset * 7);
  viewDay = mon.toLocalDate();
  render();
}
function goThisWeek() {
  viewWeekOffset = 0;
  viewDay = today();
  render();
}
function jumpToDate(dateStr) {
  if (!dateStr) return;
  viewDay = dateStr;
  const targetMon = getMon(new Date(dateStr + 'T12:00:00'));
  const thisMon = getMon(new Date());
  const diffDays = Math.round((targetMon - thisMon) / 86400000);
  viewWeekOffset = Math.round(diffDays / 7);
  closeCalendar();
  render();
}

// ── CUSTOM CALENDAR ──
let _calMonth = null; // tracks which month is displayed
let _calOpen = false;

function toggleCalendar() {
  if (_calOpen) { closeCalendar(); return; }
  _calMonth = new Date(viewDay + 'T12:00:00');
  _calOpen = true;
  renderCalendar();
  // Close on outside click (delayed to avoid catching the toggle click itself)
  setTimeout(() => {
    document.addEventListener('click', _calOutsideClick);
  }, 10);
}

function closeCalendar() {
  _calOpen = false;
  const el = document.getElementById('calendarDrop');
  if (el) el.innerHTML = '';
  document.removeEventListener('click', _calOutsideClick);
}

function _calOutsideClick(e) {
  const cal = document.querySelector('.cal');
  if (cal && !cal.contains(e.target) && !e.target.closest('.date-line')) {
    closeCalendar();
  }
}

function renderCalendar() {
  const el = document.getElementById('calendarDrop');
  if (!el || !_calOpen) return;

  const year = _calMonth.getFullYear();
  const month = _calMonth.getMonth();
  const monthName = _calMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  // First day of month and how many days
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();

  // Start on Monday (adjust: Sun=0 → 6, Mon=1 → 0, etc.)
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;

  // Days from previous month to fill first row
  const prevMonthLast = new Date(year, month, 0).getDate();

  // Get event dates for dots
  const upcoming = getUpcomingEvents();
  const evDates = new Set(upcoming.map(e => e.nextDate.toLocalDate()));

  let grid = '';
  // Day of week headers
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d => {
    grid += `<div class="cal-dow">${d}</div>`;
  });

  // Previous month trailing days
  for (let i = startDow - 1; i >= 0; i--) {
    const d = prevMonthLast - i;
    const dt = new Date(year, month - 1, d);
    const dk = dt.toLocalDate();
    grid += `<div class="cal-day other" onclick="jumpToDate('${dk}')">${d}</div>`;
  }

  // Current month days
  const tk = today();
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month, d);
    const dk = dt.toLocalDate();
    const isToday = dk === tk;
    const isSelected = dk === viewDay;
    const hasEv = evDates.has(dk);
    const cls = ['cal-day'];
    if (isToday) cls.push('today');
    if (isSelected) cls.push('selected');
    if (hasEv) cls.push('has-ev');
    grid += `<div class="${cls.join(' ')}" onclick="jumpToDate('${dk}')">${d}</div>`;
  }

  // Next month leading days to fill grid
  const totalCells = startDow + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    const dt = new Date(year, month + 1, d);
    const dk = dt.toLocalDate();
    grid += `<div class="cal-day other" onclick="jumpToDate('${dk}')">${d}</div>`;
  }

  el.innerHTML = `
    <div class="cal" onclick="event.stopPropagation()">
      <div class="cal-hdr">
        <button class="cal-nav" onclick="calNav(-1)">&#8592;</button>
        <div class="cal-title">${monthName}</div>
        <button class="cal-nav" onclick="calNav(1)">&#8594;</button>
      </div>
      <div class="cal-grid">${grid}</div>
    </div>`;
}

function calNav(dir) {
  _calMonth.setMonth(_calMonth.getMonth() + dir);
  renderCalendar();
}

// ── SEARCH ──
function searchTasks(query) {
  const el = document.getElementById('searchResults');
  const q = query.trim().toLowerCase();
  if (!q) { el.style.display = 'none'; return; }

  const results = [];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Search recurring template tasks
  for (const b of TEMPLATE) {
    for (const t of (b.tasks || [])) {
      if (t.text.toLowerCase().includes(q)) {
        results.push({ text: t.text, type: 'recurring', block: b.title, cat: b.cat, day: null, jumpDay: today() });
      }
    }
  }

  // Search weekly tasks
  for (const w of S.weekly) {
    if (w.text.toLowerCase().includes(q)) {
      const dayLbl = w.day ? new Date(w.day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : 'unassigned';
      results.push({ text: w.text, type: 'weekly', cat: w.cat, day: dayLbl, jumpDay: w.day || today() });
    }
  }

  // Search custom tasks (across all days)
  for (const [day, blocks] of Object.entries(S.custom)) {
    for (const [bid, tasks] of Object.entries(blocks)) {
      for (const t of tasks) {
        if (t.text.toLowerCase().includes(q)) {
          const dayLbl = new Date(day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
          const blkDef = TEMPLATE.find(b=>b.id===bid);
          results.push({ text: t.text, type: 'added', block: blkDef?.title || bid, cat: t.cat, day: dayLbl, jumpDay: day, jumpBlock: bid });
        }
      }
    }
  }

  // Search recurring user tasks
  for (const r of S.recurring) {
    if (r.text.toLowerCase().includes(q)) {
      const dayNames2 = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      results.push({ text: r.text, type: 'repeats ' + dayNames2[r.dayOfWeek], cat: r.cat, day: 'every week', jumpDay: today() });
    }
  }

  // Search events
  for (const ev of S.events) {
    if (ev.text.toLowerCase().includes(q)) {
      const loc = ev.location ? ` (${ev.location})` : '';
      results.push({ text: ev.text + loc, type: 'event', cat: null, day: new Date(ev.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}), jumpDay: ev.date, eventId: ev.id });
    }
  }

  if (results.length === 0) {
    el.innerHTML = '<div class="sr-empty">No matches</div>';
    el.style.display = 'block';
    return;
  }

  // Highlight matching text
  function hl(text) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return text;
    return text.slice(0, idx) + '<em>' + text.slice(idx, idx + q.length) + '</em>' + text.slice(idx + q.length);
  }

  el.innerHTML = results.slice(0, 10).map((r, i) => {
    const catCls = r.cat ? 'cat-bg-' + r.cat : '';
    const catBg = r.cat ? '' : 'background:var(--accent);';
    const meta = r.type === 'recurring' ? 'daily' : (r.day || '');
    return `<div class="sr-item" onclick="searchJump(${i})" data-idx="${i}">
      <div class="sr-dot ${catCls}" style="${catBg}"></div>
      <div class="sr-text">${hl(r.text)}</div>
      <div class="sr-meta">${meta}</div>
    </div>`;
  }).join('');
  el.style.display = 'block';

  // Store results for click handler
  el._results = results;
}

function searchJump(idx) {
  const el = document.getElementById('searchResults');
  const r = el._results[idx];
  if (!r) return;

  // Jump to the day
  jumpToDate(r.jumpDay);

  // Clear search
  document.getElementById('searchInp').value = '';
  el.style.display = 'none';

  // If it's an event, open the editor
  if (r.eventId) {
    setTimeout(() => editEvent(r.eventId), 100);
    return;
  }

  // If it has a specific block, expand it
  if (r.jumpBlock) {
    setTimeout(() => {
      const body = document.getElementById('bd-' + r.jumpBlock);
      const chev = document.getElementById('ch-' + r.jumpBlock);
      if (body && !body.classList.contains('open')) {
        body.classList.add('open');
        if (chev) chev.classList.add('open');
      }
      const blockEl = document.querySelector(`[data-block="${r.jumpBlock}"]`);
      if (blockEl) blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }
}

// Close search on click outside
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('searchInp')?.parentElement;
  if (wrap && !wrap.contains(e.target)) {

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key==='n') { document.getElementById('qaInp').focus(); e.preventDefault(); }
  if (e.key==='/') { document.getElementById('searchInp').focus(); e.preventDefault(); }

  if (e.key==='ArrowLeft') changeWeek(-1);
  if (e.key==='ArrowRight') changeWeek(1);
});

// ── CLEAN OLD DATA ──
const cut = new Date(); cut.setDate(cut.getDate()-30);
Object.keys(S.done).forEach(k=>{ if(new Date(k)<cut) delete S.done[k]; });
Object.keys(S.custom).forEach(k=>{ if(new Date(k)<cut) delete S.custom[k]; });
S.daysOff = S.daysOff.filter(d => new Date(d) >= cut);

// ── NOTIFICATIONS / REMINDERS ──
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// Track which reminders we've already fired (so we don't repeat)
const _firedReminders = new Set(JSON.parse(localStorage.getItem('dailyOS_fired') || '[]'));

function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  const now = new Date();
  const todayStr = today();

  for (const ev of S.events) {
    if (ev.reminder == null || !ev.time) continue;

    // Find the next occurrence date
    let evDate = new Date(ev.date + 'T00:00:00');
    if (ev.repeat === 'yearly') {
      evDate.setFullYear(now.getFullYear());
      if (evDate < new Date(todayStr + 'T00:00:00')) evDate.setFullYear(now.getFullYear() + 1);
    } else if (ev.repeat === 'weekly') {
      while (evDate < new Date(todayStr + 'T00:00:00')) evDate.setDate(evDate.getDate() + 7);
    } else if (ev.repeat === 'monthly') {
      evDate.setFullYear(now.getFullYear());
      evDate.setMonth(now.getMonth());
      if (evDate < new Date(todayStr + 'T00:00:00')) evDate.setMonth(now.getMonth() + 1);
    }

    const evDateStr = evDate.toLocalDate();

    // Build the exact event datetime
    const [eh, em] = ev.time.split(':').map(Number);
    const eventTime = new Date(evDate);
    eventTime.setHours(eh, em, 0, 0);

    // Calculate when the reminder should fire
    const reminderTime = new Date(eventTime.getTime() - ev.reminder * 60000);

    // Unique key for this reminder instance
    const fireKey = ev.id + '_' + evDateStr;
    if (_firedReminders.has(fireKey)) continue;

    // Fire if we're within 1 minute of reminder time
    const diffMs = now.getTime() - reminderTime.getTime();
    if (diffMs >= 0 && diffMs < 60000) {
      _firedReminders.add(fireKey);
      localStorage.setItem('dailyOS_fired', JSON.stringify([..._firedReminders]));

      const label = ev.reminder === 0 ? 'now' :
        ev.reminder < 60 ? `in ${ev.reminder} min` :
        ev.reminder === 60 ? 'in 1 hour' : 'tomorrow';
      const loc = ev.location ? ` at ${ev.location}` : '';

      new Notification('Daily OS', {
        body: `${ev.text}${loc} — ${label} (${ev.time})`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%231a1c24"/><circle cx="16" cy="16" r="8" fill="%23d4a44a"/></svg>',
        tag: fireKey,
      });
    }
  }
}

// Clean up old fired reminders (keep only last 7 days worth)
const _oldFired = [..._firedReminders].filter(k => {
  const parts = k.split('_');
  const d = parts[parts.length - 1];
  return d && new Date(d) >= new Date(today() + 'T00:00:00');
});
if (_oldFired.length !== _firedReminders.size) {
  _firedReminders.clear();
  _oldFired.forEach(k => _firedReminders.add(k));
  localStorage.setItem('dailyOS_fired', JSON.stringify([..._firedReminders]));
}

// ── GO ──
render();
// ── CLOUD SYNC functions (constants live next to save(), above the first
// top-level save() call, to avoid TDZ errors) ──
async function syncRpc(fn, body) {
  const res = await fetch(SYNC_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SYNC_API_KEY,
      'Authorization': 'Bearer ' + SYNC_API_KEY,
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('sync http ' + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function syncSetStatus(state, label) {
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = 'sync-' + state;
  const item = document.getElementById('syncMenuItem');
  if (item) item.textContent = 'Sync: ' + label;
}

function scheduleCloudPush() {
  if (_applyingRemote || !syncKey()) return;
  setSyncDirty(true);
  syncSetStatus('pending', 'saving…');
  clearTimeout(_syncPushTimer);
  _syncPushTimer = setTimeout(cloudPush, 1200);
}

async function cloudPush() {
  if (!syncKey() || _syncPushing) return;
  _syncPushing = true;
  try {
    const out = await syncRpc('dailyos_push', { sync_key: syncKey(), payload: S });
    if (out && out.updated_at) localStorage.setItem(SYNC_TS_LS, out.updated_at);
    setSyncDirty(false);
    syncSetStatus('ok', 'on · up to date');
  } catch (e) {
    syncSetStatus('err', 'offline · will retry');
    clearTimeout(_syncPushTimer);
    _syncPushTimer = setTimeout(cloudPush, 10000);
  } finally {
    _syncPushing = false;
  }
}

async function cloudPull() {
  if (!syncKey()) return;
  if (syncDirty()) { cloudPush(); return; } // local changes win; push first
  try {
    const out = await syncRpc('dailyos_pull', { sync_key: syncKey() });
    if (!out) {
      // Nothing in the cloud yet for this key — seed it with local state.
      setSyncDirty(true);
      cloudPush();
      return;
    }
    if (out.updated_at && out.updated_at !== localStorage.getItem(SYNC_TS_LS)) {
      adoptState(out.data);
      localStorage.setItem(SYNC_TS_LS, out.updated_at);
    }
    syncSetStatus('ok', 'on · up to date');
  } catch (e) {
    syncSetStatus('err', 'offline · will retry');
  }
}

function adoptState(data) {
  _applyingRemote = true;
  try {
    S = migrateState(data);
    // Same post-load fixups as startup
    if (!S.daysOff) S.daysOff = [];
    if (!S.recurring) S.recurring = [];
    if (!S.taskMoves) S.taskMoves = {};
    if (!S.gymDays) S.gymDays = [1, 2, 4];
    syncGymDays();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    render();
  } finally {
    _applyingRemote = false;
  }
}

// Flush pending changes when the tab is hidden/closed (sendBeacon survives unload)
function syncFlushBeacon() {
  if (!syncKey() || !syncDirty()) return;
  const body = JSON.stringify({ sync_key: syncKey(), payload: S });
  navigator.sendBeacon(
    SYNC_URL + '/rest/v1/rpc/dailyos_push?apikey=' + encodeURIComponent(SYNC_API_KEY),
    new Blob([body], { type: 'application/json' })
  );
  setSyncDirty(false);
}

function genSyncKey() {
  const b = new Uint8Array(32);
  crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
}

function openSyncSetup() {
  document.getElementById('dataMenu').style.display = 'none';
  const existing = syncKey();
  const wrap = document.createElement('div');
  wrap.id = 'syncSetupOverlay';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(10,11,16,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  wrap.innerHTML = `
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:12px;max-width:420px;width:100%;padding:22px;">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px;">Cloud Sync</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px;">
        ${existing
          ? 'This device is synced. To sync another device, copy the key below and paste it there.'
          : 'Paste your sync key from another device, or generate a new one to start syncing.'}
      </div>
      <input id="syncKeyInp" class="qa-inp" type="text" spellcheck="false" autocomplete="off"
        value="${existing}" placeholder="Paste sync key…"
        style="width:100%;font-family:'JetBrains Mono',monospace;font-size:11px;margin-bottom:12px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${existing ? `
          <button class="qa-btn" onclick="navigator.clipboard.writeText(document.getElementById('syncKeyInp').value).then(()=>showPa('Sync key copied.'))">Copy Key</button>
          <button class="qa-btn" onclick="applySyncKey(document.getElementById('syncKeyInp').value.trim())">Update</button>
          <button class="qa-btn" style="color:#e06c75;" onclick="disconnectSync()">Disconnect</button>
        ` : `
          <button class="qa-btn" onclick="applySyncKey(document.getElementById('syncKeyInp').value.trim())">Connect</button>
          <button class="qa-btn" onclick="applySyncKey(genSyncKey())">Generate New Key</button>
        `}
        <button class="qa-btn" style="margin-left:auto;" onclick="closeSyncSetup()">Close</button>
      </div>
    </div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap) closeSyncSetup(); });
  document.body.appendChild(wrap);
}

function closeSyncSetup() {
  const el = document.getElementById('syncSetupOverlay');
  if (el) el.remove();
}

function applySyncKey(key) {
  if (!key || key.length < 32) { showPa('Sync key must be at least 32 characters.'); return; }
  localStorage.setItem(SYNC_KEY_LS, key);
  localStorage.removeItem(SYNC_TS_LS);
  setSyncDirty(false);
  closeSyncSetup();
  showPa('Sync connected.');
  syncSetStatus('pending', 'connecting…');
  cloudPull();
}

function disconnectSync() {
  localStorage.removeItem(SYNC_KEY_LS);
  localStorage.removeItem(SYNC_TS_LS);
  setSyncDirty(false);
  closeSyncSetup();
  syncSetStatus('off', 'off');
  showPa('Sync disconnected. Data stays on this device.');
}

// Sync triggers
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') cloudPull();
  else syncFlushBeacon();
});
window.addEventListener('pagehide', syncFlushBeacon);
window.addEventListener('online', () => { syncDirty() ? cloudPush() : cloudPull(); });
setInterval(() => {
  if (document.visibilityState === 'visible' && syncKey()) cloudPull();
}, 20000);

// Initial sync state
if (syncKey()) {
  syncSetStatus('pending', 'connecting…');
  cloudPull();
} else {
  syncSetStatus('off', 'off — tap to set up');
}

// Service worker for offline/PWA (only when served over https)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

updateBackupLabel();
// Check reminders every 30 seconds + re-render
setInterval(() => {
  const activeEl = document.activeElement;
  const mainEl = document.getElementById('main');
  if (!activeEl || !mainEl || !mainEl.contains(activeEl) || activeEl.tagName !== 'INPUT') {
    render();
  }
  checkReminders();
}, 30000);
// Initial reminder check
setTimeout(checkReminders, 2000);
