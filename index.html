<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b1e28">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily OS">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1c24'/><rect x='4' y='8' width='24' height='20' rx='3' fill='none' stroke='%23d4a44a' stroke-width='2'/><line x1='4' y1='14' x2='28' y2='14' stroke='%23d4a44a' stroke-width='2'/><line x1='10' y1='5' x2='10' y2='11' stroke='%23d4a44a' stroke-width='2' stroke-linecap='round'/><line x1='22' y1='5' x2='22' y2='11' stroke='%23d4a44a' stroke-width='2' stroke-linecap='round'/><circle cx='16' cy='21' r='2.5' fill='%23d4a44a'/></svg>">
<title>Daily OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Palette tuned for sustained reading.
       - Background slightly elevated from pure black (avoids halation).
       - Text is off-white (warmer than #fff) — reduces eye strain at length.
       - Muted text bumped brighter so secondary info still scans easily.
       WCAG: --text on --bg ≈ 15:1 (AAA), --muted on --bg ≈ 7:1 (AAA). */
    --bg: #1b1e28;
    --s1: #252836;
    --s2: #2f3242;
    --s3: #3b3e50;
    --border: #444859;
    --border2: #555a72;
    --accent: #e2b257;
    --accent-bg: rgba(226,178,87,0.12);
    --accent-border: rgba(226,178,87,0.3);
    --text: #f5f5f7;
    --text2: #ecedf3;
    --muted: #ccd0e0;
    --done: #7cc59b;
    --done-bg: rgba(124,197,155,0.14);

    /* Category colors — muted, professional */
    --c-liquidbiz: #6ab891;
    --c-barkspa: #cc8a5e;
    --c-privatelabel: #6690c4;
    --c-life: #c4808e;
    --c-admin: #8a8da4;
    --c-break: #555a72;
    --c-evening: #8a8fb8;
    --c-parking: #9c8aa8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.55;
  }

  /* ── LAYOUT ── */
  .app { display: flex; min-height: 100vh; }
  .main {
    flex: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 28px 80px;
    overflow-y: auto;
    height: 100vh;
  }
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--s1);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  .hdr {
    padding: 28px 0 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
  }
  .greeting {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .date-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .day-nav {
    display: flex;
    gap: 3px;
    margin-top: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .day-btn {
    padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: all .12s;
  }
  .day-btn:hover { color: var(--text2); background: var(--s2); }
  .day-btn.active {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent-border);
    font-weight: 500;
  }
  .day-btn.has-tasks::after {
    content: '';
    display: block;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    margin: 2px auto 0;
  }

  /* ── FOCUS CARD ── */
  .focus-card {
    margin: 16px 0 8px;
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(212,164,74,0.12), rgba(212,164,74,0.04));
    border: 1px solid var(--accent-border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  .focus-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212,164,74,0.03));
    pointer-events: none;
  }
  .focus-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .focus-pulse {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(212,164,74,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(212,164,74,0); }
  }
  .focus-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .focus-sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .focus-countdown {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .focus-countdown-bar {
    flex: 1;
    height: 3px;
    background: rgba(212,164,74,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .focus-countdown-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1s linear;
  }

  /* Today's Work — visually unified across AM/PM halves */
  .block.work-zone {
    border-color: rgba(106,184,145,0.32);
    background: linear-gradient(135deg, rgba(106,184,145,0.05), rgba(106,184,145,0.01));
  }
  .block.work-zone .bk-title { font-weight: 700; }
  .block.work-zone + .block:not(.work-zone) { margin-top: 14px; }
  .block:not(.work-zone) + .block.work-zone { margin-top: 14px; }
  .block.work-zone .bk-time { color: var(--c-liquidbiz); }

  /* ── CAPACITY BANNER (short-day awareness) ── */
  .capacity-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0 4px;
    padding: 8px 14px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text2);
  }
  .capacity-banner.short {
    background: rgba(226,178,87,0.08);
    border-color: rgba(226,178,87,0.28);
  }
  .capacity-banner.short .cap-dot {
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(226,178,87,0.4);
    animation: pulse 2.4s infinite;
  }
  .capacity-banner.full .cap-dot {
    background: var(--done);
  }
  .cap-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cap-text b { font-weight: 600; color: var(--text); }

  /* ── PARKING LOT ── */
  .parking-block {
    border-color: rgba(156,138,168,0.22);
    background: linear-gradient(135deg, rgba(156,138,168,0.05), rgba(156,138,168,0.01));
    margin-top: 16px;
    opacity: 0.92;
  }
  .parking-block .bk-hd { cursor: default; }
  .parking-block .bk-time {
    color: var(--c-parking);
    letter-spacing: 1.5px;
    font-weight: 500;
  }
  .parking-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--c-parking);
    background: rgba(156,138,168,0.15);
    border: 1px solid rgba(156,138,168,0.3);
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 8px;
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* ── EVENING MODE ── */
  .focus-card.focus-evening {
    background: linear-gradient(135deg, rgba(138,143,184,0.12), rgba(138,143,184,0.03));
    border-color: rgba(138,143,184,0.28);
    border-left-color: var(--c-evening);
  }
  .focus-card.focus-evening::before {
    background: linear-gradient(90deg, transparent, rgba(138,143,184,0.04));
  }
  .focus-card.focus-evening .focus-label { color: var(--c-evening); }
  .focus-card.focus-evening .focus-pulse {
    background: var(--c-evening);
    animation: pulseEvening 2.4s infinite;
  }
  @keyframes pulseEvening {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(138,143,184,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(138,143,184,0); }
  }

  .evening-block {
    border-color: rgba(138,143,184,0.22);
    background: linear-gradient(135deg, rgba(138,143,184,0.05), rgba(138,143,184,0.01));
  }
  .evening-block .bk-hd { cursor: default; }
  .evening-block .bk-time {
    color: var(--c-evening);
    letter-spacing: 1.5px;
    font-weight: 500;
  }

  .outstanding {
    margin: 12px 0 10px;
    padding: 12px 16px 4px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .outstanding-hd {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 8px;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .outstanding-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.6px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .outstanding-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    padding: 1px 6px;
    background: var(--s3);
    border-radius: 3px;
  }
  .outstanding-sub {
    font-size: 11px;
    color: #5e6280;
    margin-left: auto;
    font-style: italic;
  }
  .ot-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background .12s;
  }
  .ot-row:last-child { border-bottom: none; }
  .ot-row:hover { background: rgba(255,255,255,0.015); }
  .ot-text {
    flex: 1;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.4;
    cursor: pointer;
  }
  .ot-text.done { text-decoration: line-through; color: var(--muted); }
  .ot-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .ot-cat {
    width: 3px;
    height: 18px;
    border-radius: 2px;
    flex-shrink: 0;
    opacity: 0.55;
  }

  /* ── PAST SUMMARY ── */
  .past-summary {
    margin-bottom: 10px;
    padding: 10px 14px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all .15s;
    opacity: 0.6;
  }
  .past-summary:hover { opacity: 0.85; background: var(--s2); }
  .past-summary-text {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }
  .past-summary-text strong { color: var(--text2); font-weight: 500; }
  .past-summary-toggle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* ── MISSED TASKS ── */
  .missed-tasks {
    margin-bottom: 10px;
    padding: 10px 14px;
    background: rgba(196, 128, 142, 0.06);
    border: 1px solid rgba(196, 128, 142, 0.2);
    border-radius: 8px;
  }
  .missed-hd {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--c-life);
    letter-spacing: 0.3px;
    opacity: 0.85;
  }
  .missed-tasks .task {
    padding: 5px 0;
    border-bottom: 1px solid rgba(196, 128, 142, 0.08);
  }
  .missed-tasks .task:last-child { border-bottom: none; }
  .missed-tasks .t-block-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.6;
    margin-left: auto;
    white-space: nowrap;
  }

  /* ── PROGRESS ── */
  .prog {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 6px;
  }
  .prog-bar {
    flex: 1;
    height: 3px;
    background: var(--s3);
    border-radius: 2px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .prog-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 32px;
    text-align: right;
  }
  .prog-text strong { color: var(--accent); font-weight: 500; }

  /* Non-negotiables strip on main view */
  .nn-strip {
    margin: 14px 0 14px;
    padding: 10px 14px 12px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .nn-strip-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .nn-strip-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .nn-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .nn-chip:hover { border-color: var(--accent-border); background: var(--s3); }
  .nn-chip.done {
    background: var(--done-bg);
    border-color: rgba(124,197,155,0.3);
    color: var(--muted);
    text-decoration: line-through;
  }
  .nn-chip-ck {
    width: 15px;
    height: 15px;
    border: 1.5px solid var(--border2);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
    color: white;
  }
  .nn-chip.done .nn-chip-ck {
    background: var(--done);
    border-color: var(--done);
  }
  .prog-detail {
    display: flex;
    gap: 14px;
    margin-bottom: 10px;
  }
  .pd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .pd b { color: var(--text); font-weight: 600; }

  /* ── UPCOMING EVENTS BANNER ── */
  .event-banner {
    margin: 8px 0;
    padding: 10px 14px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--accent);
  }
  .event-banner .eb-icon {
    width: 28px; height: 28px;
    background: rgba(212,164,74,0.15);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .event-banner .eb-text { flex: 1; line-height: 1.4; }
  .event-banner .eb-text strong { font-weight: 600; }
  .event-banner .eb-days {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.7;
  }

  /* ── TIME BLOCKS ── */
  .blocks { margin-top: 8px; }

  .block {
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--s1);
    overflow: hidden;
    transition: all .2s;
  }
  .block.is-now {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(212,164,74,0.08), rgba(212,164,74,0.02));
    box-shadow: 0 0 20px rgba(212,164,74,0.08), inset 0 1px 0 rgba(212,164,74,0.15);
  }
  .block.is-past { opacity: 0.6; }
  .block.is-past:hover { opacity: 0.75; }
  .block.is-break {
    background: transparent;
    border: 1px dashed var(--border);
    opacity: 0.5;
    margin-bottom: 6px;
  }
  .block.is-break .bk-hd { padding: 8px 16px; }
  .block.is-break .bk-sub { display: none; }

  /* Task just added highlight */
  .block.just-added {
    animation: blockHighlight 1.5s ease;
  }
  @keyframes blockHighlight {
    0% { box-shadow: 0 0 0 2px var(--accent); }
    100% { box-shadow: none; }
  }

  .bk-hd {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .bk-cat {
    width: 5px;
    border-radius: 3px;
    align-self: stretch;
    flex-shrink: 0;
  }

  .bk-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 85px;
    flex-shrink: 0;
  }
  .block.is-now .bk-time { color: var(--accent); font-weight: 500; }

  .bk-info { flex: 1; min-width: 0; }
  .bk-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .now-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 2px 7px;
    background: var(--accent);
    color: #0c0d11;
    border-radius: 3px;
    font-weight: 600;
  }
  .bk-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.45;
  }
  .block:not(.expanded):not(.is-now) .bk-sub { display: none; }

  .bk-prog {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .bk-prog.all-done { color: var(--done); }

  .bk-cap {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--s3);
    flex-shrink: 0;
  }
  .bk-cap.over { color: #c45050; background: rgba(196,80,80,0.1); }

  .bk-chev {
    color: var(--muted);
    font-size: 10px;
    transition: transform .15s;
    flex-shrink: 0;
  }
  .bk-chev.open { transform: rotate(90deg); }

  /* Block body */
  .bk-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .2s ease;
  }
  .bk-body.open { max-height: 1000px; }
  .bk-inner {
    padding: 0 16px 14px;
    padding-left: 118px;
    border-top: 1px solid var(--border);
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .task:last-child { border-bottom: none; }
  .task.just-added-task {
    animation: taskGlow .8s ease;
  }
  @keyframes taskGlow {
    0% { background: rgba(212,164,74,0.15); }
    100% { background: transparent; }
  }

  .tck {
    width: 20px; height: 20px;
    border: 1.5px solid var(--border2);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    position: relative;
    transition: all .12s;
  }
  .tck:hover { border-color: var(--accent); }
  .tck.done { background: var(--done); border-color: var(--done); }
  .tck.done::after {
    content: '';
    position: absolute;
    top: 3px; left: 6px;
    width: 5px; height: 9px;
    border: 1.5px solid #fff;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  /* -- COMPLETION ANIMATIONS -- */
  @keyframes checkPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .tck.just-done {
    animation: checkPop 0.25s ease;
  }

  @keyframes taskFlash {
    0% { background: rgba(90,158,124,0.2); }
    100% { background: transparent; }
  }
  .task.just-completed {
    animation: taskFlash 0.6s ease;
  }

  @keyframes blockComplete {
    0% { border-color: var(--done); box-shadow: 0 0 20px rgba(90,158,124,0.2); }
    100% { border-color: var(--border); box-shadow: none; }
  }
  .block.block-complete {
    animation: blockComplete 1.2s ease;
  }

  @keyframes chipPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .nn-chip.just-done {
    animation: chipPop 0.3s ease;
  }

  .t-content { flex: 1; min-width: 0; }
  .t-text { font-size: 14px; color: var(--text); line-height: 1.45; }
  .t-text.done { text-decoration: line-through; color: var(--muted); opacity: 0.7; }
  .t-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #6b6f8a;
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .t-meta.nn { color: var(--accent); opacity: 0.6; }
  .t-bullets {
    margin-top: 3px;
    padding-left: 2px;
  }
  .t-bullet {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    padding: 1px 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .t-bullet::before {
    content: '•';
    color: var(--border2);
    flex-shrink: 0;
    font-size: 10px;
  }
  .t-move {
    color: #3a3d50;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    transition: color .12s;
    padding: 0 3px;
  }
  .t-move:hover { color: var(--accent); }
  .t-rm {
    color: #3a3d50;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    transition: color .12s;
    padding: 0 2px;
  }
  .t-rm:hover { color: #c45050; }

  /* Inline event in day flow */
  .inline-event {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    margin: 6px 0;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s;
    position: relative;
  }
  .inline-event:hover { background: rgba(212,164,74,0.12); }
  .inline-event.is-past { opacity: 0.5; }
  .ie-bar {
    width: 3px;
    height: 28px;
    background: var(--accent);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .ie-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 40px;
    flex-shrink: 0;
  }
  .ie-info { flex: 1; min-width: 0; }
  .ie-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .ie-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .ie-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    color: var(--accent);
    opacity: 0.6;
    flex-shrink: 0;
  }

  /* Drag and drop */
  .task[draggable="true"], .ot-row[draggable="true"] { cursor: grab; }
  .task[draggable="true"]:active, .ot-row[draggable="true"]:active { cursor: grabbing; }
  .task.dragging, .ot-row.dragging { opacity: 0.3; }
  .bk-body.drag-over, .bk-hd.drag-over {
    background: var(--accent-bg) !important;
    outline: 2px dashed var(--accent-border);
    outline-offset: -2px;
    border-radius: 8px;
  }

  /* Gym gear icon */
  .gym-gear {
    font-size: 12px;
    color: var(--muted);
    margin-left: 6px;
    cursor: pointer;
    opacity: 0.4;
    transition: all .15s;
    vertical-align: middle;
  }
  .gym-gear:hover { opacity: 1; color: var(--accent); }

  /* Gym day picker */
  .gym-picker {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .gym-picker-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }
  .gym-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 4px;
    color: var(--muted);
    background: var(--s3);
    cursor: pointer;
    transition: all .12s;
    user-select: none;
  }
  .gym-day:hover { color: var(--text2); background: var(--s2); }
  .gym-day.active {
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
  }

  /* Block inline add */
  .bk-add {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    margin-top: 4px;
    cursor: text;
    opacity: 0.4;
    transition: opacity .15s;
  }
  .bk-add:hover, .bk-add.focused { opacity: 1; }
  .bk-add-plus {
    font-size: 13px;
    color: var(--muted);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .bk-add.focused .bk-add-plus { color: var(--accent); }
  .bk-add-inp {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    outline: none;
    color: var(--text);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    padding: 2px 0;
  }
  .bk-add.focused .bk-add-inp { border-bottom-color: var(--border); }
  .bk-add-inp::placeholder { color: #3a3d50; }

  /* Quick inline add */
  .quick-add {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-top: 10px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: text;
    transition: all .15s;
  }
  .quick-add:hover, .quick-add.focused {
    border-color: var(--accent-border);
    background: var(--s2);
  }
  .quick-add-icon {
    font-size: 18px;
    color: var(--border2);
    font-weight: 300;
    flex-shrink: 0;
    width: 18px;
    text-align: center;
    line-height: 1;
    transition: color .15s;
  }
  .quick-add:hover .quick-add-icon,
  .quick-add.focused .quick-add-icon { color: var(--accent); }
  .quick-add-inp {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    line-height: 1.4;
  }
  .quick-add-inp::placeholder { color: #50546e; }

  .t-divider {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #5e6280;
    text-transform: uppercase;
    padding: 8px 0 3px;
    margin-top: 2px;
    border-top: 1px dashed rgba(255,255,255,0.08);
  }

  /* ── SIDEBAR ── */
  .sb-top {
    padding: 16px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sb-stats-strip {
    display: flex;
    gap: 12px;
    align-items: center;
    flex: 1;
  }
  .sb-stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .sb-stat-pill .sv { color: var(--text2); font-weight: 600; }
  .sb-stat-pill .sv.accent { color: var(--accent); }

  .sb-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  /* Cloud sync status dot (sits on the data ⋮ button) */
  #syncDot {
    position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%;
    pointer-events: none;
    background: var(--border2);
  }
  #syncDot.sync-ok { background: #6fbf73; }
  #syncDot.sync-pending { background: var(--accent); }
  #syncDot.sync-err { background: #e06c75; }
  #syncDot.sync-off { background: var(--border2); }

  .sb-icon-btn {
    position: relative;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
    transition: all .15s;
    position: relative;
  }
  .sb-icon-btn:hover { background: var(--s2); color: var(--text2); }
  .sb-icon-btn.active { background: var(--s3); color: var(--accent); }

  /* Search overlay inside sidebar */
  .sb-search-wrap {
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .2s ease, padding .2s ease;
  }
  .sb-search-wrap.open {
    max-height: 60px;
    padding: 8px 16px;
    overflow: visible;
  }

  /* Data dropdown */
  .sb-data-menu {
    position: absolute;
    top: 34px;
    right: 0;
    background: var(--s2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 4px;
    min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 60;
    display: none;
  }
  .sb-data-menu.show { display: block; }
  .sb-data-item {
    display: block;
    width: 100%;
    padding: 7px 10px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    color: var(--text2);
    background: none;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    transition: background .12s;
  }
  .sb-data-item:hover { background: var(--s3); }
  .sb-data-item.danger { color: #c45050; }
  .sb-data-item.danger:hover { background: rgba(196,80,80,0.1); }

  .sb-sec {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sb-h {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sb-h-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sb-h-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sb-badge {
    background: var(--s3);
    padding: 1px 7px;
    border-radius: 8px;
    font-size: 10px;
    color: var(--text2);
  }
  .sb-chev {
    font-size: 8px;
    color: var(--muted);
    transition: transform .2s ease;
    display: inline-block;
  }
  .sb-chev.open { transform: rotate(180deg); }
  .sb-h.clickable { cursor: pointer; user-select: none; }
  .sb-h.clickable:hover { color: var(--text2); }

  /* Quick Add (PA) */
  .qa-form { display: flex; flex-direction: column; gap: 6px; }
  .qa-inp {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .12s;
  }
  .qa-inp:focus { border-color: var(--accent); }
  .qa-inp::placeholder { color: #50546e; }
  .qa-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #5e6280;
    letter-spacing: 0.2px;
    line-height: 1.4;
    padding: 2px 0;
  }
  .qa-row { display: flex; gap: 5px; }
  .qa-sel, .qa-num {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 11px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    outline: none;
  }
  .qa-sel { flex: 1; }
  .qa-num { width: 52px; }
  .qa-btn {
    background: var(--accent);
    color: #0c0d11;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: opacity .12s;
    white-space: nowrap;
  }
  .qa-btn:hover { opacity: 0.85; }
  .pa-msg {
    margin-top: 4px;
    padding: 8px 12px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 6px;
    font-size: 11px;
    color: var(--accent);
    display: none;
    animation: fadeUp .2s;
    line-height: 1.4;
  }
  .pa-msg.show { display: block; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:translateY(0); } }

  /* Add Event form */
  .ae-form { display: flex; flex-direction: column; gap: 6px; }
  .ae-row { display: flex; gap: 5px; }
  .ae-inp {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .ae-inp:focus { border-color: var(--accent); }
  .ae-inp::placeholder { color: #50546e; }
  .ae-date {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 11px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    color-scheme: dark;
  }
  .ae-btn {
    background: var(--s3);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all .12s;
    white-space: nowrap;
  }
  .ae-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }

  /* Non-negotiable rows */
  .nn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nn:last-child { border-bottom: none; }
  .nn-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0.6;
  }
  .nn-dot.done { background: var(--done); opacity: 1; }
  .nn-txt { font-size: 11px; color: var(--text2); flex: 1; }
  .nn-txt.done { text-decoration: line-through; color: var(--muted); }
  .nn-biz {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* Weekly task rows */
  .wt {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
  }
  .wt:last-child { border-bottom: none; }
  .wt-ck {
    width: 12px; height: 12px;
    border: 1.5px solid var(--border2);
    border-radius: 3px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: all .12s;
  }
  .wt-ck:hover { border-color: var(--accent); }
  .wt-ck.done { background: var(--done); border-color: var(--done); }
  .wt-ck.done::after {
    content: '';
    position: absolute;
    top: 1px; left: 2px;
    width: 4px; height: 6px;
    border: 1.5px solid #fff;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .wt-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .wt-txt { flex: 1; color: var(--text2); }
  .wt-txt.done { text-decoration: line-through; color: var(--muted); }
  .wt-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 5px;
    background: var(--s3);
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all .12s;
  }
  .wt-day:hover { color: var(--accent); background: var(--accent-bg); }
  .wt-rm {
    color: #3a3d50;
    cursor: pointer;
    font-size: 11px;
    transition: color .12s;
  }
  .wt-rm:hover { color: #c45050; }

  /* Events list */
  .ev-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
  }
  .ev-item:last-child { border-bottom: none; }
  .ev-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 48px;
    flex-shrink: 0;
  }
  .ev-txt { flex: 1; color: var(--text2); }
  .ev-days {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 5px;
    background: var(--s3);
    border-radius: 3px;
  }
  .ev-days.soon { color: var(--accent); background: var(--accent-bg); }
  .ev-days.today { color: var(--done); background: var(--done-bg); font-weight: 500; }
  .ev-rm {
    color: #3a3d50;
    cursor: pointer;
    font-size: 11px;
    transition: color .12s;
  }
  .ev-rm:hover { color: #c45050; }

  /* PA nudge — integrated into bottom */
  .pa-strip {
    padding: 10px 16px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: auto;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .pa-strip .pa-icon {
    width: 18px; height: 18px;
    background: var(--accent-bg);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pa-strip strong { color: var(--accent); font-weight: 500; }

  /* Category BG colors */
  .cat-bg-liquidbiz { background: var(--c-liquidbiz); }
  .cat-bg-barkspa { background: var(--c-barkspa); }
  .cat-bg-privatelabel { background: var(--c-privatelabel); }
  .cat-bg-life { background: var(--c-life); }
  .cat-bg-admin { background: var(--c-admin); }
  .cat-bg-break { background: var(--c-break); }
  .cat-bg-evening { background: var(--c-evening); }
  .cat-bg-parking { background: var(--c-parking); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3d50; border-radius: 2px; }

  /* ── SEARCH RESULTS ── */
  #searchResults {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    z-index: 50;
    background: var(--s1);
    border: 1px solid var(--border2);
    border-radius: 8px;
    margin-top: 4px;
    max-height: 280px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .sr-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background .1s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--s2); }
  .sr-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .sr-text { flex: 1; font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-text em { font-style: normal; color: var(--accent); font-weight: 600; }
  .sr-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
    text-align: right;
    letter-spacing: 0.3px;
  }
  .sr-empty {
    padding: 14px 12px;
    font-size: 11px;
    color: #5e6280;
    text-align: center;
  }

  /* ── CALENDAR DROPDOWN ── */
  .cal {
    position: absolute;
    top: 28px;
    left: 0;
    z-index: 100;
    background: var(--s1);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: 280px;
    animation: calIn .15s ease;
  }
  @keyframes calIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .cal-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .cal-nav {

<script>

// ── CATEGORY LOGIC ──

// ── STATE ──
const DATA_VERSION = 3;
const STORAGE_KEY = 'dailyOS';

// Map old (pre-v3) block ids to the new mainwork_am / mainwork_pm halves.
// PM-half ids (after 13:30) go into mainwork_pm; the rest into mainwork_am.
const LEGACY_BLOCK_MAP = {
  'morning-scan': 'mainwork_am',

function nextDateOfWeekday(dow) {
  // Returns YYYY-MM-DD for the next occurrence of dow (0=Sun..6=Sat), today inclusive.
  const d = new Date();
  const delta = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + delta);
  return toDateStr(d);
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('dos4');
    let s = JSON.parse(raw || 'null') || def();
    s = migrateState(s);
    return s;
  } catch { return def(); }
}

function def() {
  return { _v: DATA_VERSION, done:{}, weekly:[], custom:{}, events:[], streak:[], daysOff:[], recurring:[] };
}

function migrateState(s) {
  if (!s._v) { s._v = 1; }
  if (s._v < 2) {
    s.done = s.done || {};
    s.weekly = s.weekly || [];
    s.custom = s.custom || {};
    s.events = s.events || [];
    s.streak = s.streak || [];
    s.daysOff = s.daysOff || [];
    s.recurring = s.recurring || [];
    s._v = 2;
  }
  if (s._v < 3) {
    // v3: template simplification. Rehome custom tasks that lived in defunct blocks.
    s.custom = s.custom || {};
    for (const day of Object.keys(s.custom)) {
      const dayMap = s.custom[day];
      if (!dayMap || typeof dayMap !== 'object') continue;
      for (const oldId of Object.keys(LEGACY_BLOCK_MAP)) {
        if (!dayMap[oldId] || !dayMap[oldId].length) continue;
        const newId = LEGACY_BLOCK_MAP[oldId];
        if (!dayMap[newId]) dayMap[newId] = [];
        dayMap[newId].push(...dayMap[oldId]);
        delete dayMap[oldId];
      }
    }
    // Rehome user-recurring tasks whose `block` no longer exists
    if (Array.isArray(s.recurring)) {
      for (const r of s.recurring) {
        if (r && LEGACY_BLOCK_MAP[r.block]) r.block = LEGACY_BLOCK_MAP[r.block];
      }
    }
    s._v = 3;
  }
  return s;
}

let S = load();
if (!S.daysOff) S.daysOff = [];
if (!S.recurring) S.recurring = [];
if (!S.taskMoves) S.taskMoves = {};
// recurring: [{ id, text, cat, dur, dayOfWeek (0=Sun,6=Sat), block (for weekdays), notes }]
// Gym days — configurable, stored in state
if (!S.gymDays) S.gymDays = [1, 2, 4]; // default Mon, Tue, Thu
syncGymDays();

  if (!monExists) {
    S.events.push({ id: uid(), text: 'Daisy pickup', date: nextDateOfWeekday(1), repeat: 'weekly', time: '14:00', reminder: null });

  if (!friExists) {
    S.events.push({ id: uid(), text: 'Daisy pickup', date: nextDateOfWeekday(5), repeat: 'weekly', time: '14:00', reminder: null });
  }
  S._daisyEvents = true;
  // Persist migration + Daisy events immediately so we don't recreate on next load.
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch {}
}

function syncGymDays() {
  // Remove all gym recurring tasks, re-create from S.gymDays
  S.recurring = S.recurring.filter(r => !r.id?.startsWith('rec_gym_'));
  for (const dow of S.gymDays) {
    S.recurring.push({ id: 'rec_gym_' + dow, text: 'Gym', cat: 'life', dur: 60, dayOfWeek: dow, block: 'gym' });

}

}

  const idx = S.gymDays.indexOf(dow);

  syncGymDays();

}
let viewDay = today();

// ── ROLLING BACKUP (localStorage, no file downloads) ──
function rollingBackup() {
  const tk = today();
  const bkKey = 'dailyOS_bk_' + tk;
  // Only backup once per day
  if (localStorage.getItem(bkKey)) return;
  localStorage.setItem(bkKey, JSON.stringify(S));
  // Clean up old backups (keep last 3)
  const allKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('dailyOS_bk_')) allKeys.push(k);
  }
  allKeys.sort().reverse();
  allKeys.slice(3).forEach(k => localStorage.removeItem(k));
}

// ── EXPORT / IMPORT ──
function exportData() {
  const backup = {
    _type: 'dailyOS-backup',
    _v: DATA_VERSION,
    _exportedAt: new Date().toISOString(),
    data: S
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `daily-os-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  S._lastExport = new Date().toISOString();
  save();
  updateBackupLabel();
  showPa('Backup exported successfully.');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      let imported;
      if (parsed._type === 'dailyOS-backup' && parsed.data) {
        imported = parsed.data;
      } else if (parsed.done !== undefined || parsed.weekly !== undefined) {
        imported = parsed;
      } else {
        showPa('Invalid backup file.');
        return;
      }
      if (!confirm('This will replace ALL your current data. Are you sure?')) return;
      S = migrateState(imported);
      save();
      render();
      showPa('Data imported successfully from backup.');
    } catch (err) {
      showPa('Failed to import: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('This will DELETE all your data (tasks, events, progress). Export a backup first!\n\nAre you absolutely sure?')) return;
  if (!confirm('Last chance — all data will be gone. Continue?')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem('dos4');
  S = def();
  location.reload();
}

function updateBackupLabel() {
  const el = document.getElementById('lastBackup');

    const d = new Date(S._lastExport);
    el.textContent = 'Last export: ' + d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  } else {
    el.textContent = 'Auto-saved to browser. Export for external backup.';
  }
}

function toDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
Date.prototype.toLocalDate = function() { return toDateStr(this); };
function today() { return toDateStr(new Date()); }

function getMon(d) {
  const x = new Date(d);
  const day = x.getDay();
  x.setDate(x.getDate() - day + (day===0?-6:1));
  x.setHours(0,0,0,0);
  return x;
}
function getWeek(mon) {
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(d.getDate()+i); return d; });
}
function timeToMin(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function getNow() { const n=new Date(); return n.getHours()*60+n.getMinutes(); }

function isWeekend(dayStr) {
  if (S.daysOff.includes(dayStr)) return true;
  const d = new Date(dayStr + 'T12:00:00');
  const dow = d.getDay();
  return dow === 0 || dow === 6;
}

function isDayOff(dayStr) { return S.daysOff.includes(dayStr); }

const EVENING_START = 17 * 60; // 17:00

function isEveningMode(day) {
  if (isWeekend(day)) return false;
  if (day !== today()) return false;
  return getNow() >= EVENING_START;
}

function eveningTasks(day) {
  return ((S.custom[day] || {})['evening']) || [];
}

function getOutstandingPastTasks(day) {
  if (day !== today()) return [];
  const tmpl = getTemplateForDay(day);
  const evIds = new Set(eveningTasks(day).map(t => t.id));
  const out = [];
  for (const b of tmpl) {
    if (b.isBreak) continue;
    if (blockStatus(b) !== 'past') continue;
    const { recurring, weekly, custom } = blockTasks(b.id, day);
    const meta = { blockTime: b.time, blockId: b.id, blockCat: b.cat };
    for (const t of recurring) {
      if (isDone(t.id, day) || evIds.has(t.id)) continue;
      const isUserRecur = typeof t.id === 'string' && t.id.startsWith('rec');
      out.push({ ...t, ...meta, _type: isUserRecur ? 'rec' : 'r' });
    }
    for (const t of weekly) {
      if (isDone(t.id, day) || evIds.has(t.id)) continue;
      out.push({ ...t, ...meta, _type: 'w' });
    }
    for (const t of custom) {
      if (isDone(t.id, day) || evIds.has(t.id)) continue;
      out.push({ ...t, ...meta, _type: 'c' });
    }
  }
  return out;
}

function toggleDayOff(dayStr) {
  const idx = S.daysOff.indexOf(dayStr);
  if (idx > -1) {
    S.daysOff.splice(idx, 1);
  } else {
    S.daysOff.push(dayStr);
  }
  save(); render();
}

function getTemplateForDay(dayStr) {
  if (isWeekend(dayStr)) return [];
  const dow = new Date(dayStr + 'T00:00:00').getDay();
  const isGymDay = S.gymDays.includes(dow);
  return TEMPLATE.map(b => {
    if (b.id !== 'gym') return b;
    if (isGymDay) return b;
    // Non-gym day: usable overflow block
    return { ...b, title: 'Break / Overflow', sub: 'No gym. Use for tasks, errands, or rest.', isBreak: false, tasks: [], cat: 'admin' };
  });
}

function blockStatus(b) {
  if (viewDay !== today()) return 'future';
  const now = getNow();
  const s = timeToMin(b.time), e = timeToMin(b.end);
  if (now >= e) return 'past';
  if (now >= s) return 'now';
  return 'future';
}

function detectCat(text) {
  const l = text.toLowerCase();
  for (const [cat, kws] of Object.entries(CAT_KW)) {
    for (const k of kws) { if (l.includes(k)) return cat; }
  }
  return null;
}

function bestBlock(cat) { return CAT_BLOCK[cat] || 'flex'; }

function nextWeekday(fromDate) {
  const d = new Date(fromDate);
  d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toLocalDate();
}

// ── CAPACITY-AWARE SCHEDULING ──
function getBlockCapacity(blockId, day) {
  const b = TEMPLATE.find(x => x.id === blockId);
  if (!b) return { total: 0, used: 0, free: 0 };
  const total = b.dur;
  const { recurring, weekly, custom } = blockTasks(blockId, day);
  let used = recurring.reduce((s, t) => s + (t.dur || 15), 0); // recurring ~15min each
  used += weekly.reduce((s, t) => s + (t.dur || 30), 0);
  used += custom.reduce((s, t) => s + (t.dur || 30), 0);
  return { total, used, free: Math.max(0, total - used) };
}

function smartBlock(cat, day, dur) {
  // Parking-lot categories (private label etc) → parking lot, never the main work zone.
  if (cat === 'privatelabel') return 'parking';
  // Life things land in the gym/break slot.
  if (cat === 'life') return 'gym';
  // Default: today's work. Route to PM half once we're past 13:30 so the just-added
  // task lands somewhere visually "current"; otherwise AM half.
  if (day === today() && getNow() >= timeToMin('13:30')) return 'mainwork_pm';
  return 'mainwork_am';
}

function bestDay(cat, when) {
  if (when === 'today') return viewDay;
  if (when === 'tomorrow') return literalTomorrow();
  if (when === 'week') {
    const mon = getMon(new Date());
    const wk = getWeek(mon).map(d=>d.toLocalDate()).filter(d => !isWeekend(d));
    const todayIdx = wk.indexOf(today());
    return wk[Math.min(todayIdx + 1, wk.length - 1)] || today();
  }

  if (viewDay !== today()) return viewDay;
  if (isWeekend(today())) return nextWeekday(new Date());

  const blk = TEMPLATE.find(b => b.id === bestBlock(cat));
  if (blk) {
    const st = blockStatus(blk);
    if (st !== 'past') return today();
  }
  return nextWeekday(new Date());
}

// ── GET TASKS FOR BLOCK+DAY ──
function blockTasks(blockId, day) {
  const b = TEMPLATE.find(x=>x.id===blockId);
  // Filter out template tasks that were moved to another block for this day
  const dayMoves = (S.taskMoves || {})[day] || {};
  const recurring = [...(b.tasks||[])].filter(t => !dayMoves[t.id] || dayMoves[t.id] === blockId);

  // Add user-created recurring tasks for this day of week + block
  // Honour taskMoves overrides so a per-day move/skip applies to user-recurring too
  const dow = new Date(day + 'T00:00:00').getDay();
  const recur = S.recurring.filter(r =>
    r.dayOfWeek === dow && r.block === blockId &&
    (!dayMoves[r.id] || dayMoves[r.id] === blockId)
  );
  recurring.push(...recur);

  const weekly = S.weekly.filter(w => {
    if (w.day !== day) return false;
    const tb = bestBlock(w.cat);
    return tb === blockId;
  });

  let flexExtra = [];
  if (blockId === 'flex') {
    flexExtra = S.weekly.filter(w => {
      if (w.day !== day) return false;
      const tb = bestBlock(w.cat);
      return !TEMPLATE.find(x=>x.id===tb) || tb === 'flex';
    }).filter(f => !weekly.find(w=>w.id===f.id));
  }

  let custom = ((S.custom[day]||{})[blockId]) || [];

  // Rescue orphaned custom tasks from non-existent blocks into flex
  if (blockId === 'flex') {
    const dayCustom = S.custom[day] || {};
    for (const [bid, tasks] of Object.entries(dayCustom)) {
      if (bid === 'flex' || bid === 'weekend') continue;
      if (!TEMPLATE.find(x => x.id === bid)) {
        custom = [...custom, ...tasks];
      }
    }
  }

  return { recurring, weekly: [...weekly, ...flexExtra], custom };
}

  // Remove from current day/block
  const c = (S.custom[viewDay]||{})[fromBid];
  if (!c) return;
  const idx = c.findIndex(t => t.id === tid);
  if (idx === -1) return;
  const task = c.splice(idx, 1)[0];

  // Determine target block
  const toWeekend = isWeekend(toDay);
  const targetBid = toWeekend ? 'weekend' : smartBlock(task.cat || 'life', toDay, task.dur || 30);

  // Add to new day/block
  if (!S.custom[toDay]) S.custom[toDay] = {};
  if (!S.custom[toDay][targetBid]) S.custom[toDay][targetBid] = [];
  S.custom[toDay][targetBid].push(task);

  save();

  // Close picker
  const picker = document.getElementById('task-move-picker');
  if (picker) picker.remove();

  const dayLbl = toDay === today() ? 'today' :
    toDay === literalTomorrow() ? 'tomorrow' :
    new Date(toDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  showPa(`Moved "${task.text}" to ${dayLbl}.`);

  // Stay on current day, just re-render to remove the moved task
  render();
}

function execMoveTaskToDate(type, fromBid, tid, toDay) {
  let movingTask = null;
  let label = '';

  if (type === 'c') {
    const c = (S.custom[viewDay] || {})[fromBid];
    if (!c) return;
    const idx = c.findIndex(t => t.id === tid);
    if (idx === -1) return;
    movingTask = c.splice(idx, 1)[0];
    label = movingTask.text;
  } else if (type === 'r') {
    const srcBlock = TEMPLATE.find(b => b.id === fromBid);
    const srcTask = srcBlock?.tasks?.find(t => t.id === tid);
    if (!srcTask) return;
    if (!S.taskMoves) S.taskMoves = {};
    if (!S.taskMoves[viewDay]) S.taskMoves[viewDay] = {};
    S.taskMoves[viewDay][tid] = '__moved__'; // sentinel — hidden from every block today
    movingTask = { id: 'ct'+uid(), text: srcTask.text, dur: srcTask.dur || 15, cat: srcTask.cat || 'admin', notes: srcTask.notes };
    label = srcTask.text;
  } else if (type === 'w') {
    const w = S.weekly.find(x => x.id === tid);
    if (!w) return;
    w.day = toDay;
    save();
    const picker = document.getElementById('task-move-picker');
    if (picker) picker.remove();
    showPa(`Moved "${w.text}" to ${labelForDay(toDay)}.`);
    render();
    return;
  } else if (type === 'rec') {
    const r = S.recurring.find(x => x.id === tid);
    if (!r) return;
    if (!S.taskMoves) S.taskMoves = {};
    if (!S.taskMoves[viewDay]) S.taskMoves[viewDay] = {};
    S.taskMoves[viewDay][tid] = '__moved__'; // skip today's recurring instance
    movingTask = { id: 'ct'+uid(), text: r.text, dur: r.dur, cat: r.cat, notes: r.notes };
    label = r.text;
  }

  if (!movingTask) return;

  const targetBid = isWeekend(toDay) ? 'weekend' : smartBlock(movingTask.cat || 'life', toDay, movingTask.dur || 30);
  if (!S.custom[toDay]) S.custom[toDay] = {};
  if (!S.custom[toDay][targetBid]) S.custom[toDay][targetBid] = [];
  S.custom[toDay][targetBid].push(movingTask);

  save();
  const picker = document.getElementById('task-move-picker');
  if (picker) picker.remove();
  showPa(`Moved "${label}" to ${labelForDay(toDay)}.`);
  render();
}

function labelForDay(dk) {
  if (dk === today()) return 'today';
  if (dk === literalTomorrow()) return 'tomorrow';
  return new Date(dk+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
}

// ── IMPROVED parseTime — requires "at" prefix OR am/pm suffix to avoid matching bare numbers ──
function parseTime(text) {
  const l = text.toLowerCase();
  // Match "at 10", "at 2pm", "at 14:30", "10am", "2:30pm" — but NOT bare "10" without am/pm/at
  const m = l.match(/(?:at\s+)(\d{1,2})(?::(\d{2}))?\s*(am|pm)?|(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  if (!m) return null;
  // "at X" match: groups 1,2,3. "Xam/pm" match: groups 4,5,6
  let h = parseInt(m[1] || m[4]);
  const mins = parseInt(m[2] || m[5] || '0');
  const ampm = m[3] || m[6];
  if (ampm === 'pm' && h < 12) h += 12;
  if (ampm === 'am' && h === 12) h = 0;
  if (h < 6 || h > 22) return null;
  return { hour: h, min: mins, totalMin: h * 60 + mins };
}

// ── Parse "today" / "tomorrow" from text ──
function literalTomorrow() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toLocalDate();
}

function parseWhenFromText(text) {
  const l = text.toLowerCase();
  if (/\btoday\b/.test(l)) return today();
  if (/\btomorrow\b/.test(l)) return literalTomorrow();
  return null;
}

// ── Parse duration from text: "30 mins", "1 hour", "1.5 hours", "45m", "2h" ──
function parseDuration(text) {
  const l = text.toLowerCase();
  // "1 hour", "2 hours", "1.5 hours", "1.5h"
  const hm = l.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/);
  if (hm) return Math.round(parseFloat(hm[1]) * 60);
  // "30 mins", "45 min", "15 minutes"
  const mm = l.match(/(\d+)\s*(?:mins?|minutes?)\b/);
  if (mm) return parseInt(mm[1]);
  return null;
}

// Parse day from text like "monday", "tuesday", "wed"
// Returns { day: 'YYYY-MM-DD', match: 'tuesday' } or null
function parseDayName(text) {
  const l = text.toLowerCase();
  // Check longest names first to avoid "tue" matching inside "tuesday" prematurely
  const dayEntries = [
    ['wednesday',3],['thursday',4],['saturday',6],['tuesday',2],['sunday',0],['monday',1],['friday',5],
    ['wed',3],['thu',4],['sat',6],['tue',2],['sun',0],['mon',1],['fri',5]
  ];
  for (const [name, dow] of dayEntries) {
    const re = new RegExp('\\b' + name + '\\b', 'i');
    const m = l.match(re);
    if (m) {
      const now = new Date();
      const todayDow = now.getDay();
      let diff = dow - todayDow;
      if (diff <= 0) diff += 7;
      if (diff === 7 && l.includes('this')) diff = 0;
      const target = new Date(now);
      target.setDate(target.getDate() + diff);
      return { day: target.toLocalDate(), match: m[0] };
    }
  }
  return null;
}

// Find which block a time falls into
function findBlockAtTime(timeMin) {
  for (const b of TEMPLATE) {
    const s = timeToMin(b.time), e = timeToMin(b.end);
    if (timeMin >= s && timeMin < e) return b;
  }
  return null;
}

function paAdd() {
  const inp = document.getElementById('qaInp');
  const text = inp.value.trim();
  if (!text) return;

  let cat = document.getElementById('qaCat').value;
  let dur = parseInt(document.getElementById('qaDur').value)||30;
  const when = document.getElementById('qaWhen').value;

  if (cat === 'auto') cat = detectCat(text) || 'life';

  // Parse duration from text (overrides the manual input if found)
  const parsedDur = parseDuration(text);
  if (parsedDur) dur = parsedDur;

  // ── Check for "every [day]" → create a RECURRING weekly task ──
  const everyMatch = text.match(/\bevery\s+(sun(?:day)?|mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?)\b/i);
  if (everyMatch) {
    const dayMap = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
    const prefix = everyMatch[1].slice(0,3).toLowerCase();
    const dow = dayMap[prefix];
    const cleanText = text.replace(everyMatch[0], '').replace(/\s{2,}/g,' ').trim();
    const isWeekdayDow = dow >= 1 && dow <= 5;
    const block = isWeekdayDow ? smartBlock(cat, today(), dur) : null;
    S.recurring.push({ id: 'rec'+uid(), text: cleanText || text, cat, dur, dayOfWeek: dow, block });
    save();
    const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    showPa(`Recurring task added: "${cleanText||text}" every ${dayNames[dow]}. ${dur}min.`);
    inp.value = '';
    render();
    return;
  }

  // Check for specific time in text
  const parsedTime = parseTime(text);

  // Parse day from text and clean the task title
  let textDay = null;
  let cleanText = text;
  const whenFromText = parseWhenFromText(text);
  const dayFromName = parseDayName(text);
  if (whenFromText) {
    textDay = whenFromText;
    cleanText = cleanText.replace(/\b(today|tomorrow)\b/gi, '');
  } else if (dayFromName) {
    textDay = dayFromName.day;
    cleanText = cleanText.replace(new RegExp('\\b' + dayFromName.match + '\\b', 'i'), '');
  }
  // Also strip duration and time phrases from text
  cleanText = cleanText.replace(/\b\d+(?:\.\d+)?\s*(?:hours?|hrs?|mins?|minutes?)\b/gi, '');
  cleanText = cleanText.replace(/\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '');
  cleanText = cleanText.replace(/\s{2,}/g, ' ').trim();
  if (!cleanText) cleanText = text; // fallback if everything was stripped

  // ── "This week" → add as a WEEKLY TASK (sidebar), not a day-specific custom task ──
  if (when === 'week' && !textDay && !parsedTime) {
    // Find the lightest weekday for this category
    const mon = getMon(new Date());
    const wkDays = getWeek(mon).map(d=>d.toLocalDate()).filter(d => !isWeekend(d));
    let bestWkDay = wkDays[0];
    let minLoad = Infinity;
    for (const wd of wkDays) {
      // Skip past days
      if (wd < today()) continue;
      const blk = smartBlock(cat, wd, dur);
      const cap = getBlockCapacity(blk, wd);
      if (cap.used < minLoad) { minLoad = cap.used; bestWkDay = wd; }
    }
    const wkId = uid();
    S.weekly.push({ id: wkId, text: cleanText, cat, dur, day: bestWkDay, done: false });
    save();
    const dayLbl = new Date(bestWkDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});
    showPaWithMove(wkId, `Added "${cleanText}" to weekly list on ${dayLbl}. ${dur}min.`);
    inp.value = '';
    render();
    return;
  }

  // Check for "today"/"tomorrow" in text first, then day names, then auto
  let day = textDay;
  if (!day) day = bestDay(cat, when);


  // For weekends: everything goes into a flat custom list keyed by time
  if (isWeekend(day)) {
    const timeKey = parsedTime ? `${String(parsedTime.hour).padStart(2,'0')}:${String(parsedTime.min).padStart(2,'0')}` : null;
    if (!S.custom[day]) S.custom[day] = {};
    if (!S.custom[day]['weekend']) S.custom[day]['weekend'] = [];
    const taskId = 'ct'+uid();
    S.custom[day]['weekend'].push({
      id: taskId, text: cleanText, done:false, cat, dur,
      time: timeKey
    });
    save();
    const dayLbl = new Date(day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});
    showPa(`Added to ${dayLbl}${timeKey ? ' at ' + timeKey : ''}. ${dur}min.`);
    inp.value = '';
    // Navigate to that day
    viewDay = day;
    render();
    return;
  }

  // For weekdays with a specific time: find which block it falls in
  let blk;
  let paMessage;

  if (parsedTime) {
    const hitBlock = findBlockAtTime(parsedTime.totalMin);
    if (hitBlock && !hitBlock.isBreak) {
      blk = hitBlock.id;
      paMessage = `Slotted into ${hitBlock.title} at ${String(parsedTime.hour).padStart(2,'0')}:${String(parsedTime.min).padStart(2,'0')}`;
    } else if (parsedTime.totalMin >= EVENING_START && day === today()) {
      blk = 'evening';
      paMessage = `Added to Evening`;
    } else {
      blk = 'flex';
      paMessage = `No block at that time, added to Flex Block`;
    }
  } else if (day === today() && isEveningMode(today())) {
    blk = 'evening';
    paMessage = `Added to Evening`;
  } else {
    // Capacity-aware scheduling
    blk = smartBlock(cat, day, dur);
    const blkDef = TEMPLATE.find(b=>b.id===blk);
    const cap = getBlockCapacity(blk, day);
    const freeAfter = cap.free - dur;
    if (freeAfter < 0) {
      paMessage = `\u26a0\ufe0f OVERFLOW: ${blkDef?blkDef.title:'Flex'} is ${Math.abs(freeAfter)}min over capacity!`;
    } else {
      paMessage = `Scheduled into ${blkDef?blkDef.title:'Flex'} (${freeAfter}min free after)`;
    }
  }

  if (!S.custom[day]) S.custom[day] = {};
  if (!S.custom[day][blk]) S.custom[day][blk] = [];
  const taskId = 'ct'+uid();
  S.custom[day][blk].push({
    id: taskId, text: cleanText, done:false, cat, dur,
    time: parsedTime ? `${String(parsedTime.hour).padStart(2,'0')}:${String(parsedTime.min).padStart(2,'0')}` : null
  });

  save();

  const dayLbl = day===today() ? 'today' :
    day===literalTomorrow() ? 'tomorrow' :
    new Date(day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  const blkName = blk === 'evening' ? 'Evening' : (TEMPLATE.find(b=>b.id===blk)?.title || 'Flex');
  showPa(`Added to ${blkName} on ${dayLbl} (${dur}min). Viewing now.`);

  // Track for highlight animation
  _lastAddedBlock = blk;
  _lastAddedTaskId = taskId;

  inp.value = '';
  // Navigate to the day where task was added (update week offset too)
  viewDay = day;
  const _tMon = getMon(new Date(day + 'T12:00:00'));
  const _cMon = getMon(new Date());
  viewWeekOffset = Math.round((_tMon - _cMon) / 86400000 / 7);
  render();

  // Auto-expand the block and scroll to it
  setTimeout(() => {
    const body = document.getElementById('bd-' + blk);
    const chev = document.getElementById('ch-' + blk);
    if (body && !body.classList.contains('open')) {
      body.classList.add('open');
      if (chev) chev.classList.add('open');
    }
    // Scroll to block
    const blockEl = document.querySelector(`[data-block="${blk}"]`);
    if (blockEl) blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    // Clear highlight trackers after animation
    setTimeout(() => { _lastAddedBlock = null; _lastAddedTaskId = null; }, 1600);
  }, 50);
}

function showPa(msg) {
  const el = document.getElementById('paMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 4000);
}

function showPaWithMove(taskId, msg) {
  const el = document.getElementById('paMsg');
  const mon = getMon(new Date());
  const wk = getWeek(mon);
  const dayLabels = ['M','T','W','T','F','S','S'];
  const t = S.weekly.find(w => w.id === taskId);

  let btns = wk.map((d, i) => {
    const dk = d.toLocalDate();
    const isActive = t && dk === t.day;
    return `<span onclick="moveWeeklyTask('${taskId}','${dk}')" style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:${isActive?'700':'400'};background:${isActive?'var(--accent)':'var(--s3)'};color:${isActive?'#0c0d11':'var(--muted)'};">${dayLabels[i]}</span>`;
  }).join('');

  el.innerHTML = `${msg}<div style="display:flex;gap:3px;margin-top:6px;align-items:center;"><span style="font-size:9px;color:var(--muted);margin-right:4px;">Move:</span>${btns}</div>`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 8000);
}

function moveWeeklyTask(id, newDay) {
  const t = S.weekly.find(w => w.id === id);
  if (!t) return;
  t.day = newDay;
  save();
  const dayLbl = new Date(newDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});
  showPa(`Moved to ${dayLbl}.`);
  render();
}

          <button class="qa-btn" style="flex:1;" onclick="saveTaskEdit('${type}','${bid}','${tid}')">Save</button>

        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

  document.getElementById('te-text').select();
  modal.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveTaskEdit(type, bid, tid);

  });

function saveTaskEdit(type, bid, tid) {
  const newText = document.getElementById('te-text').value.trim();
  const newNotes = document.getElementById('te-notes').value.trim();
  const newCat = document.getElementById('te-cat').value;
  const newDur = parseInt(document.getElementById('te-dur').value) || 30;
  const newBlock = type === 'c' ? document.getElementById('te-block').value : null;

  if (!newText) return;

  if (type === 'w') {
    const task = S.weekly.find(w => w.id === tid);
    if (task) {
      task.text = newText;
      task.notes = newNotes || undefined;
      task.cat = newCat;
      task.dur = newDur;
    }
  } else if (type === 'c') {
    const c = (S.custom[viewDay]||{})[bid];
    const task = c ? c.find(t => t.id === tid) : null;
    if (task) {
      task.text = newText;
      task.notes = newNotes || undefined;
      task.cat = newCat;
      task.dur = newDur;

      // Move to different block if changed
      if (newBlock && newBlock !== bid) {
        const idx = c.findIndex(t => t.id === tid);
        if (idx > -1) c.splice(idx, 1);
        if (!S.custom[viewDay][newBlock]) S.custom[viewDay][newBlock] = [];
        S.custom[viewDay][newBlock].push(task);
      }
    }
  } else if (type === 'rec') {
    const task = S.recurring.find(r => r.id === tid);
    if (task) {
      task.text = newText;
      task.notes = newNotes || undefined;
      task.cat = newCat;
      task.dur = newDur;
      const newDow = document.getElementById('te-dow');
      if (newDow) task.dayOfWeek = parseInt(newDow.value);
    }
  }

  save();
  document.getElementById('task-edit-modal').remove();
  render();
}

function getUpcomingEvents() {
  const now = new Date();
  now.setHours(0,0,0,0);
  const cutoff = new Date(now);
  cutoff.setDate(cutoff.getDate() + 60);

  let upcoming = [];
  for (const ev of S.events) {
    let evDate = new Date(ev.date + 'T00:00:00');

    if (ev.repeat === 'yearly') {
      evDate.setFullYear(now.getFullYear());
      if (evDate < now) evDate.setFullYear(now.getFullYear() + 1);
    } else if (ev.repeat === 'monthly') {
      evDate.setFullYear(now.getFullYear());
      evDate.setMonth(now.getMonth());
      if (evDate < now) evDate.setMonth(now.getMonth() + 1);
    } else if (ev.repeat === 'weekly') {
      while (evDate < now) evDate.setDate(evDate.getDate() + 7);
    }

    if (evDate >= now && evDate <= cutoff) {
      const diffDays = Math.round((evDate - now) / 86400000);
      upcoming.push({ ...ev, nextDate: evDate, daysAway: diffDays });
    }
  }

  return upcoming.sort((a,b) => {
    if (a.daysAway !== b.daysAway) return a.daysAway - b.daysAway;
    // Same day: events with time before events without, then by time
    if (a.time && !b.time) return -1;
    if (!a.time && b.time) return 1;
    if (a.time && b.time) return a.time.localeCompare(b.time);
    return 0;
  });
}

function getTodayEvents() {
  return getUpcomingEvents().filter(e => e.daysAway === 0);
}

function getSoonEvents() {
  return getUpcomingEvents().filter(e => e.daysAway > 0 && e.daysAway <= 7);
}

// ── STREAK ──
function checkStreak() {
  const tk = today();
  const d = S.done[tk] || {};
  const allNn = NN.every(n => d[n.link]);
  if (allNn && !S.streak.includes(tk)) S.streak.push(tk);
  else if (!allNn) S.streak = S.streak.filter(x=>x!==tk);
}

function streakCount() {
  const sorted = [...S.streak].sort().reverse();
  if (!sorted.length) return 0;
  let count = 0;
  let check = new Date();
  const tk = today();
  const d = S.done[tk]||{};
  if (!NN.every(n=>d[n.link])) check.setDate(check.getDate()-1);
  for (let i=0;i<90;i++) {
    if (sorted.includes(check.toLocalDate())) {
      count++; check.setDate(check.getDate()-1);
    } else break;
  }
  return count;
}
