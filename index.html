<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141b">
<script>
  // Theme is a per-device preference (localStorage, not synced). Applied before first
  // paint so there is no flash; dark is the default when nothing is stored.
  (function(){try{var t=localStorage.getItem('dailyOS_theme');if(t==='light'){document.documentElement.dataset.theme='light';var m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#f6f6f8';}}catch(e){}})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily OS">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1c24'/><rect x='4' y='8' width='24' height='20' rx='3' fill='none' stroke='%23d4a44a' stroke-width='2'/><line x1='4' y1='14' x2='28' y2='14' stroke='%23d4a44a' stroke-width='2'/><line x1='10' y1='5' x2='10' y2='11' stroke='%23d4a44a' stroke-width='2' stroke-linecap='round'/><line x1='22' y1='5' x2='22' y2='11' stroke='%23d4a44a' stroke-width='2' stroke-linecap='round'/><circle cx='16' cy='21' r='2.5' fill='%23d4a44a'/></svg>">
<title>Daily OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Palette: the approved concept's dark theme (feature-research/redesign/concept.html).
       - --text/--text2 for anything a user must read (task text, names, inputs).
       - --muted is SECONDARY info only (≈5.5:1 on --bg, AA). --faint is tertiary.
       Dark is the default (no data-theme stamp); the light block below redefines
       ONLY tokens. Every colour in the app must come from here. */
    --bg: #12141b;
    --s1: #181b24;
    --s2: #1e222d;
    --s3: #262a36;
    --border: #262a36;
    --border2: #2f3442;
    --accent: #e4b45a;
    --accent-bg: rgba(228,180,90,.14);
    --accent-border: rgba(228,180,90,.35);
    --text: #e9ebf1;
    --text2: #dfe2ea;
    --muted: #8a90a3;
    --faint: #5c6276;
    --done: #6fb08d;
    --done-bg: rgba(111,176,141,.14);
    --carry: #d9846f;
    --carry-bg: rgba(217,132,111,.14);
    --danger: #e06c75;
    --danger-bg: rgba(224,108,117,.12);
    --mufc: #e0433a;
    --mufc-bg: rgba(218,41,28,.14);
    --on-accent: #0c0d11;      /* text on a solid --accent fill */
    --on-done: #ffffff;        /* tick mark / text on a solid --done fill */
    --overlay: rgba(0,0,0,.6);  /* modal backdrop */
    --hairline: rgba(255,255,255,.06);
    --hover: rgba(255,255,255,.04);
    --shadow: 0 1px 0 rgba(0,0,0,.25), 0 12px 32px -16px rgba(0,0,0,.6);
    --shadow-pop: 0 8px 24px rgba(0,0,0,.4);   /* menus, calendar, search results */

    /* Category colors — concept palette */
    --c-liquidbiz: #4fb3a3;
    --c-barkspa: #e08fb6;
    --c-privatelabel: #9b8cf2;
    --c-life: #7cb37a;
    --c-admin: #8c98b8;
    --c-break: #555a72;
    --c-evening: #8a8fb8;
    --c-parking: #9c8aa8;

    /* Two-accent semantic system (documented, per design-consistency lock):
       gold = work / action / focus;  teal = personal / calendar / life (holiday badge). */
    --accent2: #6ea8b8;
    --accent2-bg: rgba(110,168,184,0.10);
    --accent2-border: rgba(110,168,184,0.38);

    /* Radius scale — one documented system used everywhere:
       card = containers/blocks/modals; ctl = buttons/inputs; chip = tags/day-btns; xs = tiny caps/checks. */
    --r-card: 12px;
    --r-ctl: 8px;
    --r-chip: 6px;
    --r-xs: 4px;
  }

  /* Light theme — concept.html's light values mapped onto the app's token names.
     Opt-in via the Dark | Light pill (per-device, localStorage 'dailyOS_theme'). */
  :root[data-theme="light"] {
    --bg: #f6f6f8;
    --s1: #ffffff;
    --s2: #f0f1f5;
    --s3: #e4e6ee;
    --border: #e4e6ee;
    --border2: #d5d8e3;
    --accent: #b8862e;
    --accent-bg: rgba(184,134,46,.12);
    --accent-border: rgba(184,134,46,.35);
    --text: #1a1c26;
    --text2: #2a2d3a;
    --muted: #61677c;     /* 5.2:1 on --bg, 5.6:1 on --s1 (concept's #6b7186 was 4.49:1) */
    --faint: #8a90a4;     /* tertiary: times, durations (≈3:1, matches dark's --faint) */
    --done: #2f8a5e;
    --done-bg: rgba(47,138,94,.12);
    --carry: #b9634a;
    --carry-bg: rgba(185,99,74,.12);
    --danger: #c8414b;
    --danger-bg: rgba(200,65,75,.12);
    --mufc: #c4241a;
    --mufc-bg: rgba(196,36,26,.12);
    --on-accent: #0c0d11;
    --on-done: #ffffff;
    --overlay: rgba(20,22,40,.45);
    --hairline: rgba(20,22,40,.06);
    --hover: rgba(20,22,40,.04);
    --shadow: 0 1px 2px rgba(20,22,40,.06), 0 8px 24px -12px rgba(20,22,40,.12);
    --shadow-pop: 0 8px 24px rgba(20,22,40,.14);
    --c-liquidbiz: #2f9c8b;
    --c-privatelabel: #7a6ae0;
    --c-barkspa: #d06a9a;
    --c-life: #5e9a5b;
    --c-admin: #6f7d9e;
    --c-break: #9a9fb5;
    --c-evening: #6f7d9e;
    --c-parking: #8a76a3;
    --accent2: #3f8a9e;
    --accent2-bg: rgba(63,138,158,.10);
    --accent2-border: rgba(63,138,158,.38);
  }
  :root[data-theme="light"] .ae-date { color-scheme: light; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;     /* no horizontal page scrollbar */
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, .tck:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ── LAYOUT ──
     One composed 1080px column; the document scrolls. Top bar (date · week ·
     utilities), then a two-column grid: the day on the left, a quiet rail of
     context on the right. */
  .shell { max-width: 1080px; margin: 0 auto; padding: 0 32px 80px; }

  /* Top bar: date, week, utilities. Slim, sticky. */
  .top {
    display: flex; align-items: center; gap: 24px;
    padding: 28px 0 14px; margin-bottom: 26px;
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
  }
  .today-label { position: relative; font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; }
  .today-label span { color: var(--muted); font-weight: 500; }
  .today-label .caret { font-size: 8px; margin-left: 4px; color: var(--muted); transition: color .12s; }
  .today-label:hover .caret { color: var(--accent); }
  .week { display: flex; gap: 4px; margin-left: 4px; }
  .day {
    min-width: 36px; height: 36px; padding: 0 6px;
    border-radius: 8px; display: inline-grid; place-items: center; position: relative;
    color: var(--muted); font-weight: 500; font-size: 13px; transition: all .12s;
  }
  .day:hover { background: var(--s2); color: var(--text2); }
  .day.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .day.has-tasks::after {
    content: ''; position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--faint);
  }
  .day.active.has-tasks::after { background: var(--accent); }
  .utils { margin-left: auto; display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
  .utils > * { white-space: nowrap; flex-shrink: 0; }
  .utils a, .utils button { color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .12s; }
  .utils a:hover, .utils button:hover { color: var(--text); }
  .utils b { font-weight: 500; color: var(--text); }
  .hdr-link.on { color: var(--danger); }
  .hdr-link.on:hover { color: var(--danger); opacity: .85; }
  .theme { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
  .theme button { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
  .theme button[aria-pressed="true"] { background: var(--s2); color: var(--text); }
  /* Sync status (click to open setup) */
  .sync { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .sync:hover { color: var(--text); }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); flex: none; }
  .sync-dot.sync-ok { background: var(--done); }
  .sync-dot.sync-pending { background: var(--accent); }
  .sync-dot.sync-err { background: var(--danger); }
  .sync-dot.sync-off { background: var(--border2); }
  /* Icon buttons: search ⌕ and the ⋯ data menu */
  .icon-btn {
    position: relative; width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-chip); color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .icon-btn:hover { background: var(--s2); color: var(--text); }
  .icon-btn.active { background: var(--s3); color: var(--accent); }
  #syncDot {
    position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%;
    pointer-events: none; background: var(--border2);
  }
  #syncDot.sync-ok { background: var(--done); }
  #syncDot.sync-pending { background: var(--accent); }
  #syncDot.sync-err { background: var(--danger); }
  #syncDot.sync-off { background: var(--border2); }
  /* Data dropdown (under ⋯) */
  .data-menu {
    position: absolute; top: 34px; right: 0;
    background: var(--s2); border: 1px solid var(--border2); border-radius: var(--r-ctl);
    padding: 4px; min-width: 150px; box-shadow: var(--shadow-pop); z-index: 60;
    text-align: left; font-size: 13px;
  }
  .data-item {
    display: block; width: 100%; padding: 7px 10px;
    color: var(--text2); border-radius: 5px; cursor: pointer; transition: background .12s;
    white-space: nowrap;
  }
  .data-item:hover { background: var(--s3); }
  .data-item.danger { color: var(--danger); }
  .data-item.danger:hover { background: var(--danger-bg); }

  /* Search (hidden until ⌕) */
  .search-wrap { max-height: 0; overflow: hidden; transition: max-height .2s ease, margin .2s ease; margin-bottom: 0; }
  .search-wrap.open { max-height: 60px; overflow: visible; margin-bottom: 20px; }
  .search-wrap .inner { position: relative; max-width: 480px; }
  .search-wrap .qa-inp { padding-left: 32px; }
  .search-wrap .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }

  /* Two columns: the day, and quiet context. */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; align-items: start; }

  /* ── NOW — the one answer ── */
  .now { margin-bottom: 36px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .now h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
  .now h1 .soft { color: var(--muted); font-weight: 500; }
  .now .then { margin-top: 10px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .now .then > span { cursor: pointer; }
  .now .then > span.plain { cursor: default; }
  .now .then .t { color: var(--faint); margin-right: 6px; font-size: 13px; }
  .now .then .past { text-decoration: line-through; color: var(--faint); }
  .now .then .bd { margin-left: 6px; }

  /* ── CAPACITY BANNER (short-day awareness) ── */
  .capacity-banner {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 18px; padding: 8px 14px;
    background: var(--s1); border: 1px solid var(--border); border-radius: var(--r-ctl);
    font-size: 12.5px; color: var(--text2);
  }
  .capacity-banner.short { background: var(--accent-bg); border-color: var(--accent-border); }
  .capacity-banner.short .cap-dot { background: var(--accent); box-shadow: 0 0 0 0 var(--accent-border); animation: pulse 2.4s infinite; }
  .capacity-banner.full .cap-dot { background: var(--done); }
  .cap-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .cap-text b { font-weight: 600; color: var(--text); }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-border); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px transparent; }
  }

  /* ── TODAY list ── */
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .sec-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .sec-head .count { color: var(--muted); font-size: 13px; }
  .progress { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--done); width: 0; transition: width .4s ease; }

  .list {
    background: var(--s1); border: 1px solid var(--border); border-radius: var(--r-card);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .list.drag-over { border-color: var(--accent); }
  .sd-empty { padding: 12px 16px; font-size: 13px; color: var(--muted); }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-top: 1px solid var(--border);
    transition: padding .15s ease, background .15s ease;
  }
  .row:first-child { border-top: 0; }
  .t-content { flex: 1; min-width: 0; }
  .t-text { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; letter-spacing: -.005em; }
  .t-text.done { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
  .t-bullets { margin-top: 3px; padding-left: 2px; }
  .t-bullet { font-size: 12px; color: var(--text2); line-height: 1.5; padding: 1px 0; display: flex; align-items: baseline; gap: 6px; }
  .t-bullet::before { content: '•'; color: var(--border2); flex-shrink: 0; font-size: 10px; }
  /* Row meta: carry chip · category (dot) · duration · repeat */
  .meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .cat { display: inline-flex; align-items: center; gap: 6px; }
  .cat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--faint)); }
  .dur { color: var(--faint); }
  .rep { color: var(--faint); font-size: 13px; }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
  .chip.carry { color: var(--carry); background: var(--carry-bg); }
  .chip.daily { color: var(--accent); background: var(--accent-bg); }
  /* Done rows recede: same ground as the card (a lighter band read as emphasis). */
  .row.done, .row:has(.tck.done) { padding: 8px 16px; background: var(--s1); }
  .row.done .t-text, .row:has(.tck.done) .t-text { font-size: 13px; font-weight: 400; color: var(--muted); }
  .row.done .meta, .row:has(.tck.done) .meta { opacity: .55; }
  .row.pin { background: var(--accent-bg); }
  .row.pin.done { background: var(--s1); }
  .row.just-added-task { animation: taskGlow .8s ease; }
  @keyframes taskGlow { 0% { background: var(--accent-bg); } 100% { background: transparent; } }

  .tck {
    width: 20px; height: 20px;
    border: 1.5px solid var(--faint); border-radius: 6px;
    flex-shrink: 0; cursor: pointer; position: relative; transition: all .12s;
  }
  .tck:hover { border-color: var(--accent); }
  .tck.done { background: var(--done); border-color: var(--done); }
  .tck.done::after {
    content: ''; position: absolute; top: 3px; left: 6px; width: 5px; height: 9px;
    border: 1.5px solid var(--on-done); border-top: none; border-left: none; transform: rotate(45deg);
  }
  /* -- COMPLETION ANIMATIONS -- */
  @keyframes checkPop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .tck.just-done { animation: checkPop 0.25s ease; }
  @keyframes taskFlash { 0% { background: var(--done-bg); } 100% { background: transparent; } }
  .row.just-completed { animation: taskFlash 0.6s ease; }

  /* Row controls: grip · move · remove — hover-reveal on pointer devices */
  .sd-grip { color: var(--faint); font-size: 13px; letter-spacing: -2px; cursor: grab; opacity: 0; transition: opacity .15s; flex-shrink: 0; }
  .row.pin .sd-grip { opacity: 0; pointer-events: none; }
  .t-move { color: var(--faint); cursor: pointer; font-size: 13px; flex-shrink: 0; transition: color .12s, opacity .15s; padding: 0 3px; opacity: 0; }
  .t-move:hover { color: var(--accent); }
  .t-rm { color: var(--faint); cursor: pointer; font-size: 14px; flex-shrink: 0; transition: color .12s, opacity .15s; padding: 0 2px; opacity: 0; }
  .t-rm:hover { color: var(--danger); }
  .row:hover .sd-grip, .row:hover .t-move, .row:hover .t-rm { opacity: 1; }
  @media (hover: none) {
    .sd-grip, .t-move, .t-rm { opacity: 0.6; }
    .sd-grip { font-size: 15px; }
    .t-move, .t-rm { font-size: 16px; min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; }
  }
  .row.drop-above { box-shadow: 0 -2px 0 var(--accent); }
  .sd-menu {
    position: fixed; background: var(--s2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 4px; box-shadow: var(--shadow-pop);
    display: flex; flex-direction: column; z-index: 999; min-width: 150px;
  }
  .sd-menu-item { font-size: 12px; color: var(--text2); padding: 7px 10px; border-radius: 5px; cursor: pointer; }
  .sd-menu-item:hover { background: var(--s3); }

  /* Drag and drop */
  .row[draggable="true"] { cursor: grab; }
  .row[draggable="true"]:active { cursor: grabbing; }
  .row.dragging { opacity: 0.3; }

  /* Gym day picker (edit-task modal) */
  .gym-picker { display: flex; align-items: center; gap: 4px; padding: 6px 0; margin-bottom: 4px; border-bottom: 1px solid var(--hairline); }
  .gym-picker-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 4px; }
  .gym-day { font-size: 11px; font-weight: 500; padding: 3px 7px; border-radius: 4px; color: var(--muted); background: var(--s3); cursor: pointer; transition: all .12s; user-select: none; }
  .gym-day:hover { color: var(--text2); background: var(--s2); }
  .gym-day.active { color: var(--accent); background: var(--accent-bg); border: 1px solid var(--accent-border); }

  /* The one add box — last row of the list card */
  .bk-add { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--faint); cursor: text; }
  .bk-add-plus { font-size: 14px; color: var(--faint); width: 20px; text-align: center; flex-shrink: 0; transition: color .15s; }
  .bk-add.focused .bk-add-plus { color: var(--accent); }
  .bk-add-inp { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font-size: 14px; font-family: inherit; padding: 2px 0; }
  .bk-add-inp::placeholder { color: var(--faint); }

  /* Parking lot: one quiet line when empty, a second .list when not */
  .earlier-head { display:flex; align-items:baseline; gap:8px; padding:12px 16px 6px; border-top:1px solid var(--border); font-size:12px; font-weight:600; color:var(--muted); }
  .earlier-head .n { color:var(--text); }
  .earlier-head .hint { margin-left:auto; font-weight:400; color:var(--faint); } margin-top: 18px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .parking.drag-over { outline: 1px dashed var(--accent); outline-offset: 4px; border-radius: 6px; }
  .parking b { font-weight: 600; color: var(--text); }
  .parking .n { color: var(--faint); }
  .parking button { color: var(--muted); }
  .parking button:hover { color: var(--accent); }
  .parking-sec { margin-top: 28px; }

  /* ── RIGHT RAIL ── */
  .rail { display: flex; flex-direction: column; gap: 34px; }
  .rail h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .rail h3 .right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .rail h3.clickable { cursor: pointer; user-select: none; }
  .rail h3.clickable:hover { color: var(--text2); }
  .rail h3 .add { font-size: 12px; font-weight: 500; color: var(--muted); }
  .rail h3 .add:hover { color: var(--accent); }
  .badge { font-family: 'JetBrains Mono', monospace; background: var(--s3); padding: 1px 7px; border-radius: var(--r-ctl); font-size: 11px; color: var(--text2); }
  .chev { font-size: 8px; color: var(--muted); transition: transform .2s ease; display: inline-block; }
  .chev.open { transform: rotate(180deg); }

  /* Counting down */
  .rail .count { display: flex; align-items: baseline; gap: 10px; }
  .rail .count + .count { margin-top: 14px; }
  .rail .count .n { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .rail .count .l { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
  .rail .count .l b { color: var(--text); font-weight: 600; }
  .rail .count .l small { display: block; color: var(--faint); margin-top: 2px; font-size: 12px; }
  .rail .count .unpin { color: var(--faint); font-size: 16px; line-height: 1; opacity: 0; transition: opacity .12s, color .12s; align-self: center; min-width: 24px; min-height: 24px; }
  .rail .count:hover .unpin { opacity: 1; }
  .rail .count .unpin:hover { color: var(--accent); }

  /* Coming up, grouped per day */
  .up { display: flex; flex-direction: column; gap: 14px; }
  .up .d { display: grid; grid-template-columns: 56px 1fr; gap: 6px 12px; }
  .up .dh { color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 2px; }
  .up .dh.today { color: var(--accent); }
  .up .mh { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 6px; border-top: 1px solid var(--hairline); }
  .up .ev { display: flex; gap: 10px; align-items: baseline; font-size: 13px; grid-column: 2; cursor: pointer; min-width: 0; }
  .up .ev .t { color: var(--faint); font-size: 11.5px; min-width: 38px; flex-shrink: 0; }
  .up .ev .x { color: var(--text); flex: 1; min-width: 0; }
  .up .ev .x.past { color: var(--faint); text-decoration: line-through; }
  .up .ev .sub { color: var(--faint); }
  .up .ev .acts { display: inline-flex; gap: 6px; align-items: center; opacity: 0; transition: opacity .12s; flex-shrink: 0; }
  .up .ev:hover .acts { opacity: 1; }
  .ev-pin { cursor: pointer; opacity: 0.5; transition: opacity .12s, transform .12s; font-size: 11px; line-height: 1; }
  .ev-pin:hover { opacity: 1; transform: scale(1.15); }
  .ev-pin.active { opacity: 1; }
  .ev-rm { color: var(--faint); cursor: pointer; font-size: 12px; transition: color .12s; }
  .ev-rm:hover { color: var(--danger); }
  .bd { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; color: var(--mufc); background: var(--mufc-bg); flex-shrink: 0; text-decoration: none; }
  .bd.hol { color: var(--accent2); background: var(--accent2-bg); }
  .bell { font-size: 10px; color: var(--accent); margin-left: 4px; }
  .later { color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; padding: 2px 0; }
  .later:hover { color: var(--text); }
  .later .chev { margin-left: 6px; }
  .up-empty { font-size: 12px; color: var(--muted); }
  @media (hover: none) { .up .ev .acts, .rail .count .unpin { opacity: .7; } }

  /* This week (weekly task rows) */
  .wt { display: flex; align-items: center; gap: 7px; padding: 5px 0; border-bottom: 1px solid var(--hairline); font-size: 12px; }
  .wt:last-child { border-bottom: none; }
  .wt-ck { width: 12px; height: 12px; border: 1.5px solid var(--border2); border-radius: 3px; flex-shrink: 0; cursor: pointer; position: relative; transition: all .12s; }
  .wt-ck:hover { border-color: var(--accent); }
  .wt-ck.done { background: var(--done); border-color: var(--done); }
  .wt-ck.done::after {
    content: ''; position: absolute; top: 1px; left: 2px; width: 4px; height: 6px;
    border: 1.5px solid var(--on-done); border-top: none; border-left: none; transform: rotate(45deg);
  }
  .wt-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .wt-txt { flex: 1; color: var(--text2); }
  .wt-txt.done { text-decoration: line-through; color: var(--muted); }
  .wt-day { font-size: 11px; font-weight: 500; color: var(--muted); padding: 2px 6px; background: var(--s3); border-radius: 4px; cursor: pointer; transition: all .12s; }
  .wt-day:hover { color: var(--accent); background: var(--accent-bg); }
  .wt-rm { color: var(--faint); cursor: pointer; font-size: 11px; transition: color .12s; }
  .wt-rm:hover { color: var(--danger); }
  .wk-empty { font-size: 12px; color: var(--muted); }

  /* ── FORM CONTROLS (modals, event form, search) ── */
  .qa-inp {
    width: 100%;
    background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; color: var(--text); font-family: inherit; outline: none;
    transition: border-color .12s;
  }
  .qa-inp:focus { border-color: var(--accent); }
  .qa-inp::placeholder { color: var(--faint); }
  .qa-sel, .qa-num {
    background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 8px; font-size: 13px; color: var(--text); font-family: inherit; outline: none;
  }
  .qa-sel { flex: 1; }
  .qa-num { width: 56px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .qa-btn {
    background: var(--accent); color: var(--on-accent); border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: opacity .12s; white-space: nowrap;
  }
  .qa-btn:hover { opacity: 0.85; }

  /* Toast (#paMsg) — fixed, bottom-centre. showPa / showPaWithMove write here. */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    z-index: 950; max-width: min(92vw, 480px);
    padding: 10px 14px;
    background: var(--s2); border: 1px solid var(--accent-border); border-radius: 10px;
    box-shadow: var(--shadow-pop);
    font-size: 13px; color: var(--text); line-height: 1.4;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:translateY(0); } }

  /* App-update toast — gentle "update available" prompt for long-lived PWA sessions.
     z-index sits below the 1000 modal tier so an open modal always paints over it. */
  .update-toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    z-index: 900;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px 9px 14px;
    background: var(--s2);
    border: 1px solid var(--accent-border);
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    font-size: 12px; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .update-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .update-toast .ut-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); flex-shrink: 0; }
  .update-toast .ut-text { white-space: nowrap; }
  .update-toast .ut-refresh { font-family: inherit; font-size: 11px; font-weight: 600; color: var(--on-accent); background: var(--accent); border: none; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  .update-toast .ut-refresh:hover { filter: brightness(1.08); }
  .update-toast .ut-refresh:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .update-toast .ut-dismiss { font-family: inherit; font-size: 16px; line-height: 1; color: var(--muted); background: none; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 26px; min-height: 26px; padding: 0; }
  .update-toast .ut-dismiss:hover { color: var(--text); background: var(--hover); }
  .update-toast .ut-dismiss:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }

  /* Add Event form (rail) */
  .ae-form { display: flex; flex-direction: column; gap: 6px; }
  .ae-row { display: flex; gap: 5px; }
  .ae-inp {
    flex: 1; background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; color: var(--text); font-family: inherit; outline: none;
  }
  .ae-inp:focus { border-color: var(--accent); }
  .ae-inp::placeholder { color: var(--faint); }
  .ae-date {
    background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 8px; font-size: 13px; color: var(--text); font-family: inherit; outline: none;
    color-scheme: dark; min-width: 0;
  }
  .ae-btn {
    background: var(--s2); color: var(--text2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: all .12s; white-space: nowrap;
  }
  .ae-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .modal-eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }

  /* Category BG colors (search dot, weekly dot) */
  .cat-bg-liquidbiz { background: var(--c-liquidbiz); }
  .cat-bg-barkspa { background: var(--c-barkspa); }
  .cat-bg-privatelabel { background: var(--c-privatelabel); }
  .cat-bg-life { background: var(--c-life); }
  .cat-bg-admin { background: var(--c-admin); }
  .cat-bg-break { background: var(--c-break); }
  .cat-bg-evening { background: var(--c-evening); }
  .cat-bg-parking { background: var(--c-parking); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }

  /* ── SEARCH RESULTS ── */
  #searchResults {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: var(--s1); border: 1px solid var(--border2); border-radius: var(--r-ctl);
    margin-top: 4px; max-height: 280px; overflow-y: auto; box-shadow: var(--shadow-pop);
  }
  .sr-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; transition: background .1s; border-bottom: 1px solid var(--hairline); }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--s2); }
  .sr-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .sr-text { flex: 1; font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-text em { font-style: normal; color: var(--accent); font-weight: 600; }
  .sr-meta { font-size: 11px; color: var(--muted); flex-shrink: 0; text-align: right; }
  .sr-empty { padding: 14px 12px; font-size: 12px; color: var(--muted); text-align: center; }

  /* ── CALENDAR DROPDOWN (under the date label) ── */
  .cal {
    position: absolute; top: 30px; left: 0; z-index: 100;
    background: var(--s1); border: 1px solid var(--border2); border-radius: var(--r-card);
    padding: 14px; box-shadow: var(--shadow-pop); width: 280px; animation: calIn .15s ease;
    font-weight: 400; letter-spacing: 0; white-space: normal; cursor: default;
  }
  @keyframes calIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .cal-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); }
  .cal-nav { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); cursor: pointer; padding: 3px 8px; font-size: 12px; transition: all .12s; }
  .cal-nav:hover { color: var(--accent); border-color: var(--accent-border); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-dow { font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
  .cal-day { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text2); padding: 6px 0; border-radius: var(--r-chip); cursor: pointer; transition: all .1s; border: 1px solid transparent; }
  .cal-day:hover { background: var(--s3); color: var(--text); }
  .cal-day.other { color: var(--faint); }
  .cal-day.today { color: var(--accent); border-color: var(--accent-border); }
  .cal-day.selected { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .cal-day.has-ev::after { content: ''; display: block; width: 3px; height: 3px; background: var(--accent); border-radius: 50%; margin: 1px auto 0; }
  .cal-day.selected.has-ev::after { background: var(--on-accent); }

  /* Tactile feedback — a small physical "push" on press.
     Respect reduced-motion: skip the transform for users who opt out. */
  @media (prefers-reduced-motion: no-preference) {
    .tck:active { transform: scale(0.86); }
    .qa-btn:active, .day:active, .icon-btn:active, .cal-day:active, .theme button:active { transform: scale(0.95); }
  }

  /* ── MOBILE ── single column; the rail simply follows main in source order. */
  @media (max-width: 900px) {
    .shell {
      padding: 0 calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    }
    /* Wrapped, the bar is ~180px tall — too much to pin on a phone, so it scrolls. */
    .top { position: static; flex-wrap: wrap; gap: 14px 20px; padding-top: calc(16px + env(safe-area-inset-top)); margin-bottom: 22px; }
    .utils { margin-left: 0; flex-wrap: wrap; gap: 12px 16px; }
    /* Week strip: one scrollable line, no wrapping */
    .week { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; max-width: 100%; margin-left: 0; }
    .week::-webkit-scrollbar { display: none; }
    .day { flex: 0 0 auto; min-height: 36px; min-width: 36px; padding: 0 8px; }
    .cols { grid-template-columns: 1fr; gap: 40px; }
    .rail { gap: 34px; }
    .now h1 { font-size: 26px; }
    .row.pin { min-height: 40px; }
    .meta { gap: 8px; }
    /* Tap targets */
    .tck { width: 26px; height: 26px; border-radius: 6px; }
    .tck.done::after { top: 5px; left: 9px; width: 6px; height: 11px; }
  }
  @media (max-width: 480px) {
    .shell {
      padding-left: calc(14px + env(safe-area-inset-left));
      padding-right: calc(14px + env(safe-area-inset-right));
    }
    .rail .count small { display: none; }
  }
</style>

<body>

<div class="shell">

        <span class="sync-dot" id="syncPillDot"></span><span id="syncPillText">sync off</span>
      </span>
      <a href="https://book.squareup.com/appointments/nwad0qj8ufr98p/location/LP6ABYFXRWNDT/availability" target="_blank" rel="noopener" title="Book a haircut">Book haircut</a>
      <span id="topBtns" style="display:contents;"></span>
      <button class="icon-btn" type="button" onclick="toggleSbSearch()" id="sbSearchBtn" title="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
      </button>
      <div class="icon-btn" onclick="toggleDataMenu(this)" title="Data">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>

  <!-- Search (hidden until ⌕) -->
  <div class="search-wrap" id="sbSearchWrap">

      <div id="searchResults" style="display:none;"></div>

  <div class="cols">

<!-- Toast: showPa / showPaWithMove write here -->
<div class="toast" id="paMsg" role="status" aria-live="polite"></div>

<script>
// ══════════════════════════════════════════════════
// BEN'S DAILY OS v5
// ══════════════════════════════════════════════════

// ── YOUR DAILY STRUCTURE ──
// Simple Day: no time blocks. Each day is a single flat tick-list
// (S.custom[day].list) plus the optional Parking Lot. The old template's
// daily work tasks live on as plain weekday recurring tasks (see
// workSeedTasks / the v4 migration).
function workSeedTasks() {
  const seeds = [];
  const WORK = [
    { key: 'parcels', text: 'Pack & post orders', dur: 30 },
    { key: 'list',    text: 'List stock on eBay', dur: 45 },
  ];
  for (const w of WORK) {
    for (let dow = 1; dow <= 5; dow++) {
      seeds.push({ id: 'rec_work_' + w.key + '_' + dow, text: w.text, cat: 'liquidbiz', dur: w.dur, dayOfWeek: dow });
    }
  }
  return seeds;
}

// Daily non-negotiables — small quick ticks, render as chips above Today's Work.
// `link` is the unique key used for done state in S.done[day][link].
const NN = [
  { id: 'nn3', text: 'Creatine + protein + multivit', biz: 'Health', link: 'nn_supps'     },
];

// Parking lot — optional work, doesn't count toward progress. Lives below mainwork_pm.
const PARKING_TEMPLATE = [
  { id: 'park_pl', text: 'Work on next PL/Bundle product', dur: 60, cat: 'privatelabel' },
];

// ── CATEGORY LOGIC ──

const LEGACY_BLOCK_MAP = {
  'morning-scan': 'mainwork_am',
  'liquidbiz':    'mainwork_am',
  'flex':         'mainwork_pm',
  'eod':          'mainwork_pm',

function nextDateOfWeekday(dow) {
  // Returns YYYY-MM-DD for the next occurrence of dow (0=Sun..6=Sat), today inclusive.
  const d = new Date();
  const delta = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + delta);
  return toDateStr(d);
}

function def() {

function migrateState(s) {
  if (!s._v) { s._v = 1; }
  if (s._v < 2) {
    s.done = s.done || {};
    s.weekly = s.weekly || [];
    s.custom = s.custom || {};
    s.events = s.events || [];
    s.streak = s.streak || [];
    s.daysOff = s.daysOff || [];
    s.recurring = s.recurring || [];
    s._v = 2;
  }
  if (s._v < 3) {
    // v3: template simplification. Rehome custom tasks that lived in defunct blocks.
    s.custom = s.custom || {};
    for (const day of Object.keys(s.custom)) {
      const dayMap = s.custom[day];
      if (!dayMap || typeof dayMap !== 'object') continue;
      for (const oldId of Object.keys(LEGACY_BLOCK_MAP)) {
        if (!dayMap[oldId] || !dayMap[oldId].length) continue;
        const newId = LEGACY_BLOCK_MAP[oldId];
        if (!dayMap[newId]) dayMap[newId] = [];
        dayMap[newId].push(...dayMap[oldId]);
        delete dayMap[oldId];
      }
    }
    // Rehome user-recurring tasks whose `block` no longer exists
    if (Array.isArray(s.recurring)) {
      for (const r of s.recurring) {
        if (r && LEGACY_BLOCK_MAP[r.block]) r.block = LEGACY_BLOCK_MAP[r.block];
      }
    }
    s._v = 3;
  }
  if (s._v < 4) {
    // v4: Simple Day. Fold every day's block-keyed custom arrays into one flat
    // list (block-time order), convert taskMoves overrides into per-day skips,
    // drop recurring `block` fields, and re-home the old TEMPLATE's daily work
    // tasks as plain weekday recurring tasks. Idempotent: gated on _v, so it
    // runs once per payload on BOTH the startup and adoptState (sync) paths.
    s.custom = s.custom || {};
    s.order = s.order || {};
    s.skips = s.skips || {};
    s.carryDismissed = s.carryDismissed || {};
    const FOLD_ORDER = ['mainwork_am', 'gym', 'lunch', 'mainwork_pm', 'flex', 'evening', 'weekend'];
    for (const day of Object.keys(s.custom)) {
      const dayMap = s.custom[day];
      if (!dayMap || typeof dayMap !== 'object' || Array.isArray(dayMap)) continue;
      const list = Array.isArray(dayMap.list) ? dayMap.list : [];
      const rest = Object.keys(dayMap).filter(k => k !== 'list' && k !== 'parking' && !FOLD_ORDER.includes(k));
      for (const bid of [...FOLD_ORDER, ...rest]) {
        if (Array.isArray(dayMap[bid])) list.push(...dayMap[bid]);
      }
      const next = { list };
      if (Array.isArray(dayMap.parking)) next.parking = dayMap.parking;
      s.custom[day] = next;
    }
    // taskMoves → skips. Every override (block id or '__moved__' sentinel)
    // meant "hide the template/recurring original for this day" — the visible
    // copy already lives in the custom arrays folded above.
    for (const [day, moves] of Object.entries(s.taskMoves || {})) {
      if (!moves || typeof moves !== 'object') continue;
      for (const tid of Object.keys(moves)) {
        if (!s.skips[day]) s.skips[day] = {};
        s.skips[day][tid] = true;
      }
    }
    delete s.taskMoves;
    // Recurrence is dayOfWeek only now.
    if (Array.isArray(s.recurring)) {
      for (const r of s.recurring) { if (r) delete r.block; }
    } else {
      s.recurring = [];
    }
    // Old TEMPLATE work tasks → weekday recurring seeds.
    for (const seed of workSeedTasks()) {
      if (!s.recurring.some(r => r && r.id === seed.id)) s.recurring.push(seed);
    }
    // Carry done-state over from the old template task ids so history (and
    // anything ticked today on an old client) still reads as done.
    for (const [day, dmap] of Object.entries(s.done || {})) {
      if (!dmap) continue;
      const dow = new Date(day + 'T00:00:00').getDay();
      if (dow < 1 || dow > 5) continue;
      if (dmap['nn_parcels']) dmap['rec_work_parcels_' + dow] = true;
      if (dmap['nn_list']) dmap['rec_work_list_' + dow] = true;
    }
    s._v = 4;
  }
  return s;
}

// ── ROLLING BACKUP (localStorage, no file downloads) ──
function rollingBackup() {
  const tk = today();
  const bkKey = 'dailyOS_bk_' + tk;
  // Only backup once per day
  if (localStorage.getItem(bkKey)) return;
  localStorage.setItem(bkKey, JSON.stringify(S));
  // Clean up old backups (keep last 3)
  const allKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('dailyOS_bk_')) allKeys.push(k);
  }
  allKeys.sort().reverse();
  allKeys.slice(3).forEach(k => localStorage.removeItem(k));
}

function exportData() {

    data: S
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });

  a.href = url;

  a.click();
  URL.revokeObjectURL(url);
  S._lastExport = new Date().toISOString();
  save();
  updateBackupLabel();
  showPa('Backup exported successfully.');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      let imported;
      if (parsed._type === 'dailyOS-backup' && parsed.data) {
        imported = parsed.data;
      } else if (parsed.done !== undefined || parsed.weekly !== undefined) {
        imported = parsed;
      } else {
        showPa('Invalid backup file.');
        return;
      }
      if (!confirm('This will replace ALL your current data. Are you sure?')) return;
      S = migrateState(imported);
      // Additive fields aren't part of migrateState — guard them so an older
      // backup can't leave rmEvent/toggle writing to undefined.
      if (!S.deletedSeeds) S.deletedSeeds = {};
      if (!S.carryTicked) S.carryTicked = {};
      save();
      render();
      showPa('Data imported successfully from backup.');
    } catch (err) {
      showPa('Failed to import: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function toDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
Date.prototype.toLocalDate = function() { return toDateStr(this); };
// toLocaleDateString builds a new Intl formatter on every call (~0.7ms each on a
// phone); renders format a dozen dates, search one per match. Reuse one per format.
// (Cache hangs off the hoisted function, so it's safe to call before this line runs.)
function fmtDate(d, opts) {
  const cache = fmtDate._c || (fmtDate._c = new Map());
  const k = JSON.stringify(opts);
  let f = cache.get(k);
  if (!f) { f = new Intl.DateTimeFormat('en-GB', opts); cache.set(k, f); }
  return isNaN(d) ? 'Invalid Date' : f.format(d);  // toLocaleDateString's answer; format() would throw
}
function today() { return toDateStr(new Date()); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }

// ── ENSURE EVENTS EXIST (additive) ──
function ensureEvent(match, eventData) {
  // User deleted this seeded event — never re-add it.
  if (S.deletedSeeds[match]) return false;
  const exists = S.events.some(e => e.text === match);
  if (!exists) {
    S.events.push({ id: uid(), ...eventData });
    return true;
  }
  return false;
}

    const MUFC_ALIASES = {
      'Manchester City': 'Man City',
      'Tottenham Hotspur': 'Tottenham',
      'AFC Bournemouth': 'Bournemouth',
      'Brighton & Hove Albion': 'Brighton',
      'Newcastle United': 'Newcastle',
      'West Ham United': 'West Ham',
      'Wolverhampton Wanderers': 'Wolves',
      'Manchester United': 'Man Utd',
    };
    const todayStr = toDateStr(new Date());
    const fixtures = []; // { text, date, time } across all competitions
    let leagueOk = false;
    // Each competition is fetched + parsed in its own try/catch: one feed
    // failing (or returning an unexpected shape) must not affect the others.
    // Empty events arrays are normal (no draw yet / not in the competition).
    await Promise.all(MUFC_COMPETITIONS.map(async cmp => {
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/' + cmp.code + '/teams/360/schedule?fixture=true');
        if (!res.ok) return;
        const json = await res.json();
        if (!json || !Array.isArray(json.events)) return;
        json.events.forEach(event => {
          const comp = event.competitions && event.competitions[0];
          if (!event.date || !comp || !Array.isArray(comp.competitors)) return;
          const utd = comp.competitors.find(c => c.team && c.team.id === '360');
          const opp = comp.competitors.find(c => c.team && c.team.id !== '360');
          if (!utd || !opp) return;
          const ko = new Date(event.date); // UTC kickoff → device-local date/time
          const dateStr = toDateStr(ko);
          // Stale-season guard: cup feeds serve LAST season until ESPN rolls
          // them over. Never add or update past fixtures.
          if (dateStr < todayStr) return;
          const oppName = MUFC_ALIASES[opp.team.displayName] || opp.team.displayName;
          const text = (utd.homeAway === 'home'
            ? 'Man Utd vs ' + oppName + ' (H)'
            : oppName + ' vs Man Utd (A)') + cmp.suffix;
          fixtures.push({
            text,
            date: dateStr,
            time: String(ko.getHours()).padStart(2, '0') + ':' + String(ko.getMinutes()).padStart(2, '0'),
          });
        });
        if (cmp.code === 'eng.1') leagueOk = true;
      } catch (e) { /* per-competition isolation: swallow and move on */ }
    }));
    if (leagueOk) localStorage.setItem(MUFC_FIXTURE_CHECK_LS, new Date().toISOString());
    if (_applyingRemote) return; // a sync pull is mid-flight; try again next window
    // Group by canonical text: one text can carry two future fixtures (e.g.
    // UCL league-phase home vs X plus a knockout home leg vs X). Pair stored
    // events and API fixtures in date order; update pairs in place, add any
    // unpaired API fixtures. Never delete.
    const byText = new Map();
    fixtures.forEach(f => {
      if (!byText.has(f.text)) byText.set(f.text, []);
      byText.get(f.text).push(f);
    });
    let changed = false;
    byText.forEach((apiList, text) => {
      apiList.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      const stored = S.events
        .filter(e => e.mufc && e.text === text)
        .sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
      apiList.forEach((f, i) => {
        const ev = stored[i];
        if (ev) {
          if (ev.date !== f.date || ev.time !== f.time) {
            ev.date = f.date;
            ev.time = f.time;
            changed = true;
          }
        } else if (!S.deletedSeeds[f.text]) {
          if (!ensureEvent(f.text, { text:f.text, date:f.date, repeat:'none', mufc:true, time:f.time, quiet:true })) {
            // ensureEvent dedupes by text, so a SECOND fixture sharing a text
            // (e.g. added moments ago in this loop) must be pushed directly
            // using the same id/shape ensureEvent uses.
            S.events.push({ id: uid(), text: f.text, date: f.date, repeat:'none', mufc:true, time: f.time, quiet:true });
          }
          changed = true;
        }
      });
      // Never delete: stored fixtures missing from the API are left alone.
    });
    // saveLocal, NOT save(): fixture corrections are auto-derived on every
    // device — pushing them let a stale device clobber the cloud (8 Jul 2026).
    if (changed) { saveLocal(); render(); }
  } catch (e) {
    console.warn('MUFC fixture refresh failed', e);
  }
}

// ── CARRY-OVER ──
// Any custom task left unticked on yesterday's (or the day before's) list
// surfaces at the top of today with a ↩ YESTERDAY chip. Same task, not a copy:
// ticking it marks it done for its home day. Recurring tasks never carry (they
// recur anyway). A task follows for at most 2 days. Parking Lot tasks carry
// separately with no day cap — see getParkingCarries().
// An unticked task follows you until it's ticked or dismissed (×) — no day cap.
// Newest first, so the most recent loose ends sit at the top of the group.
function getCarryTasks() {
  if (viewDay !== today()) return [];
  const tk = today();
  // Guard like getParkingCarries: an id already on today's list never doubles up.
  const seen = new Set(((((S.custom[tk]) || {}).list) || []).map(t => t.id));
  const out = [];
  for (const dk of Object.keys(S.custom).sort().reverse()) {
    if (dk >= tk) continue;
    const dismissed = (S.carryDismissed || {})[dk] || {};
    for (const t of ((S.custom[dk] || {}).list) || []) {
      if (dismissed[t.id] || seen.has(t.id)) continue;
      seen.add(t.id);
      // Ticked TODAY stays visible (struck through) until the day rolls over;
      // ticked on an earlier day (or on its own home day) stays hidden.
      if (isDone(t.id, dk) && (S.carryTicked || {})[t.id] !== today()) continue;
      out.push({ ...t, _type: 'c', _home: dk });
    }
  }
  return out;
}

// Parking Lot carry-over: a user-parked task left unticked keeps following
// into today's Parking Lot until it's ticked or dismissed — no day cap
// (it's "if I get time" work, so it waits). Template rows re-render daily
// anyway and live outside S.custom, so only user-added tasks are scanned.
function getParkingCarries() {
  if (viewDay !== today()) return [];
  const tk = today();
  // Seed with today's own parking ids: if a purge-rescued task's old home day
  // gets resurrected by a stale-device cloud pull, it must not ALSO surface
  // as a carry alongside today's physical copy.
  const seen = new Set(((((S.custom[tk]) || {}).parking) || []).map(t => t.id));
  const out = [];
  for (const dk of Object.keys(S.custom).sort()) {
    if (dk >= tk) continue;
    const dismissed = (S.carryDismissed || {})[dk] || {};
    for (const t of (S.custom[dk].parking) || []) {
      if (dismissed[t.id] || seen.has(t.id)) continue;
      // Same visibility rule as getCarryTasks: ticked today stays visible.
      if (isDone(t.id, dk) && (S.carryTicked || {})[t.id] !== today()) continue;
      seen.add(t.id);
      out.push({ ...t, _type: 'c', _home: dk });
    }
  }
  return out;
}

function dismissCarry(homeDay, tid) {

// ── THE DAY'S FLAT LIST ──
// Recurring (this day of week, minus per-day skips) + weekly tasks assigned to
// the day + the day's custom list, in that natural order — then S.order[day]
// (manual drag order) wins where it has an opinion; unlisted ids keep their
// natural position at the end.
function listTasks(day) {
  const dow = new Date(day + 'T00:00:00').getDay();
  const skips = (S.skips || {})[day] || {};
  const all = [
    ...S.recurring.filter(r => r.dayOfWeek === dow && !skips[r.id]).map(t => ({ ...t, _type: 'rec' })),
    ...S.weekly.filter(w => w.day === day).map(t => ({ ...t, _type: 'w' })),
    ...(((S.custom[day]) || {}).list || []).map(t => ({ ...t, _type: 'c' })),
  ];
  const order = (S.order || {})[day];
  if (order && order.length) {
    const pos = new Map(order.map((id, i) => [id, i]));
    return all
      .map((t, i) => ({ t, k: pos.has(t.id) ? pos.get(t.id) : order.length + i }))
      .sort((a, b) => a.k - b.k)
      .map(x => x.t);
  }
  return all;
}

function isDone(tid, day) { return !!(S.done[day]||{})[tid]; }

function toggle(tid, day) {
  // `day` defaults to the day being viewed; carry-over rows pass their home
  // day so ticking a carried task marks it done where it actually lives.
  const dk = day || viewDay;
  if (!S.done[dk]) S.done[dk] = {};
  S.done[dk][tid] = !S.done[dk][tid];
  const nowDone = S.done[dk][tid];
  // Carry rows are exactly the case where a home day differing from the viewed
  // day is passed in. Record the day they were ticked so they stay visible
  // (struck through) until the day rolls over.
  if (day && day !== viewDay) {
    if (nowDone) S.carryTicked[tid] = viewDay;
    else delete S.carryTicked[tid];
  }
  checkStreak();
  save(); render();
  if (nowDone) {
    // Checkbox pop + task row flash
    setTimeout(() => {
      const el = document.querySelector('.tck.done[onclick*="' + tid + '"]');
      if (el) {
        el.classList.add('just-done');
        const taskRow = el.closest('.row');
        if (taskRow) taskRow.classList.add('just-completed');
        setTimeout(() => {
          el.classList.remove('just-done');
          if (taskRow) taskRow.classList.remove('just-completed');
        }, 600);
      }
    }, 20);
    // All non-negotiables complete banner
    const nnD = S.done[viewDay] || {};
    if (NN.every(n => nnD[n.link])) {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--done);color:var(--on-done);padding:12px 24px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 4px 20px var(--done-bg);animation:fadeUp 0.3s ease;';
      banner.textContent = 'All non-negotiables done! Streak: ' + streakCount() + ' days';
      document.body.appendChild(banner);
      setTimeout(() => { banner.style.opacity = '0'; banner.style.transition = 'opacity 0.5s'; setTimeout(() => banner.remove(), 500); }, 2500);
    }
  }
}

  htm += `<div class="sd-menu-item" onclick="event.stopPropagation();this.style.display='none';const d=document.getElementById('sd-move-date');d.style.display='block';d.focus();">Pick a date&hellip;</div>`;
  htm += `<input id="sd-move-date" class="ae-date" type="date" style="display:none;margin:4px;"
    onclick="event.stopPropagation()"
    onchange="if(this.value)execMove(${args},'date:'+this.value)">`;
  htm += zone === 'parking'
    ? `<div class="sd-menu-item" onclick="execMove(${args},'today')">To Today</div>`
    : `<div class="sd-menu-item" onclick="execMove(${args},'parking')">To Parking Lot</div>`;

function execMove(type, tid, zone, homeDay, target) {
  let toDay, toZone;
  if (target === 'tomorrow') { toDay = literalTomorrow(); toZone = 'list'; }
  else if (target === 'today') { toDay = today(); toZone = 'list'; }
  else if (target === 'parking') { toDay = viewDay; toZone = 'parking'; }
  else if (target.startsWith('date:')) { toDay = target.slice(5); toZone = 'list'; }
  else return;

  if (!S.custom[toDay]) S.custom[toDay] = {};
  if (!S.custom[toDay][toZone]) S.custom[toDay][toZone] = [];

  let label = '';
  if (type === 'c') {
    const arr = (S.custom[homeDay] || {})[zone];
    if (!arr) return;
    const idx = arr.findIndex(t => t.id === tid);
    if (idx === -1) return;
    const task = arr.splice(idx, 1)[0];
    S.custom[toDay][toZone].push(task);
    if (S.order[homeDay]) S.order[homeDay] = S.order[homeDay].filter(id => id !== tid);
    // Moving clears any carry-over state.
    if ((S.carryDismissed[homeDay] || {})[tid]) delete S.carryDismissed[homeDay][tid];
    label = task.text;
  } else if (type === 'rec') {
    // Recurring instance: hide it for this day, drop a one-off copy on the
    // target. The recurrence itself is untouched.
    const r = S.recurring.find(x => x.id === tid);
    if (!r) return;
    if (!S.skips[viewDay]) S.skips[viewDay] = {};
    S.skips[viewDay][tid] = true;
    S.custom[toDay][toZone].push({ id: 'ct'+uid(), text: r.text, dur: r.dur, cat: r.cat, notes: r.notes, done: false });
    label = r.text;
  } else if (type === 'w') {
    const w = S.weekly.find(x => x.id === tid);
    if (!w) return;
    if (toZone === 'parking') {
      // Weekly → parking: becomes a plain parked custom task.
      S.weekly = S.weekly.filter(x => x.id !== tid);
      S.custom[toDay][toZone].push({ id: w.id, text: w.text, dur: w.dur, cat: w.cat, notes: w.notes, done: false });
    } else {
      w.day = toDay;
    }
    label = w.text;
  } else {
    return;
  }

  save();
  closeMoveMenu();
  showPa(`Moved "${label}" to ${toZone === 'parking' ? 'the Parking Lot' : labelForDay(toDay)}.`);
  render();
}

function labelForDay(dk) {
  if (dk === today()) return 'today';
  if (dk === literalTomorrow()) return 'tomorrow';
  return fmtDate(new Date(dk+'T12:00:00'), {weekday:'long',day:'numeric',month:'short'});
}

// ── IMPROVED parseTime — requires "at" prefix OR am/pm suffix to avoid matching bare numbers ──
function parseTime(text) {
  const l = text.toLowerCase();
  // Match "at 10", "at 2pm", "at 14:30", "10am", "2:30pm" — but NOT bare "10" without am/pm/at
  const m = l.match(/(?:at\s+)(\d{1,2})(?::(\d{2}))?\s*(am|pm)?|(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  if (!m) return null;
  // "at X" match: groups 1,2,3. "Xam/pm" match: groups 4,5,6
  let h = parseInt(m[1] || m[4]);
  const mins = parseInt(m[2] || m[5] || '0');
  const ampm = m[3] || m[6];
  if (ampm === 'pm' && h < 12) h += 12;
  if (ampm === 'am' && h === 12) h = 0;
  if (h < 6 || h > 22) return null;
  return { hour: h, min: mins, totalMin: h * 60 + mins };
}

// ── Parse "today" / "tomorrow" from text ──
function literalTomorrow() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toLocalDate();
}

function parseWhenFromText(text) {
  const l = text.toLowerCase();
  if (/\btoday\b/.test(l)) return today();
  if (/\btomorrow\b/.test(l)) return literalTomorrow();
  return null;
}

// ── Parse duration from text: "30 mins", "1 hour", "1.5 hours", "45m", "2h" ──
function parseDuration(text) {
  const l = text.toLowerCase();
  // "1 hour", "2 hours", "1.5 hours", "1.5h"
  const hm = l.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/);
  if (hm) return Math.round(parseFloat(hm[1]) * 60);
  // "30 mins", "45 min", "15 minutes"
  const mm = l.match(/(\d+)\s*(?:mins?|minutes?)\b/);
  if (mm) return parseInt(mm[1]);
  return null;
}

// Parse day from text like "monday", "tuesday", "wed"
// Returns { day: 'YYYY-MM-DD', match: 'tuesday' } or null
function parseDayName(text) {
  const l = text.toLowerCase();
  // Check longest names first to avoid "tue" matching inside "tuesday" prematurely
  const dayEntries = [
    ['wednesday',3],['thursday',4],['saturday',6],['tuesday',2],['sunday',0],['monday',1],['friday',5],
    ['wed',3],['thu',4],['sat',6],['tue',2],['sun',0],['mon',1],['fri',5]
  ];
  for (const [name, dow] of dayEntries) {
    const re = new RegExp('\\b' + name + '\\b', 'i');
    const m = l.match(re);
    if (m) {
      const now = new Date();
      const todayDow = now.getDay();
      let diff = dow - todayDow;
      if (diff <= 0) diff += 7;
      if (diff === 7 && l.includes('this')) diff = 0;
      const target = new Date(now);
      target.setDate(target.getDate() + diff);
      return { day: target.toLocalDate(), match: m[0] };
    }
  }
  return null;
}

// ── THE ONE ADD PATH ──
// Every add box routes through here (the day list, the parking lot). Parses the
// text exactly as the old sidebar Quick Add did — "every <day>" → S.recurring,
// "this week" → S.weekly, "today"/"tomorrow"/day names → that day's list — and
// otherwise drops the task on viewDay's `zone`. Returns what it created:
//   { kind:'recurring', id } | { kind:'weekly', id, day } | { kind:'custom', id, day, zone }
function addTaskFromText(text, opts = {}) {
  const zone = opts.zone || 'list';
  let cat = opts.cat || 'auto';
  let dur = opts.dur != null ? opts.dur : 30;   // 30 = the old paAdd/listQuickAdd default
  const when = opts.when || 'auto';
  text = (text || '').trim();
  if (!text) return null;

  if (cat === 'auto') cat = detectCat(text) || (zone === 'parking' ? 'privatelabel' : 'life');

  // Parse duration from text (overrides the manual input if found)
  const parsedDur = parseDuration(text);
  if (parsedDur) dur = parsedDur;

  // ── Check for "every [day]" → create a RECURRING weekly task ──
  const everyMatch = text.match(/\bevery\s+(sun(?:day)?|mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?)\b/i);
  if (everyMatch) {
    const dayMap = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
    const prefix = everyMatch[1].slice(0,3).toLowerCase();
    const dow = dayMap[prefix];
    const cleanText = text.replace(everyMatch[0], '').replace(/\s{2,}/g,' ').trim();
    const recId = 'rec'+uid();
    S.recurring.push({ id: recId, text: cleanText || text, cat, dur, dayOfWeek: dow });
    save();
    const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    showPa(`Recurring task added: "${cleanText||text}" every ${dayNames[dow]}. ${dur}min.`);
    render();
    return { kind: 'recurring', id: recId };
  }

  // Check for specific time in text
  const parsedTime = parseTime(text);

  // Parse day from text and clean the task title
  let textDay = null;
  let cleanText = text;
  const whenFromText = parseWhenFromText(text);
  const dayFromName = parseDayName(text);
  if (whenFromText) {
    textDay = whenFromText;
    cleanText = cleanText.replace(/\b(today|tomorrow)\b/gi, '');
  } else if (dayFromName) {
    textDay = dayFromName.day;
    cleanText = cleanText.replace(new RegExp('\\b' + dayFromName.match + '\\b', 'i'), '');
  }
  // "this week" → weekly list (same as the old When = This week selector)
  let weekWord = false;
  if (!textDay && /\bthis\s+week\b/i.test(cleanText)) weekWord = true;
  // Only strip the phrase when it actually routes to the weekly list — a timed
  // task like "call bank this week 3pm" keeps its full title.
  const weekRoute = (when === 'week' || weekWord) && !textDay && !parsedTime;
  if (weekRoute) cleanText = cleanText.replace(/\bthis\s+week\b/gi, '');
  // Also strip duration and time phrases from text
  cleanText = cleanText.replace(/\b\d+(?:\.\d+)?\s*(?:hours?|hrs?|mins?|minutes?)\b/gi, '');
  cleanText = cleanText.replace(/\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '');
  cleanText = cleanText.replace(/\s{2,}/g, ' ').trim();
  if (!cleanText) cleanText = text; // fallback if everything was stripped

  // ── "This week" → add as a WEEKLY TASK (rail), not a day-specific custom task ──
  if (weekRoute) {
    // Find the lightest remaining weekday (fewest open tasks)
    const mon = getMon(new Date());
    const wkDays = getWeek(mon).map(d=>d.toLocalDate()).filter(d => !isWeekend(d));
    let bestWkDay = wkDays[0];
    let minLoad = Infinity;
    for (const wd of wkDays) {
      // Skip past days
      if (wd < today()) continue;
      const load = listTasks(wd).filter(t => !isDone(t.id, wd)).length;
      if (load < minLoad) { minLoad = load; bestWkDay = wd; }
    }
    const wkId = uid();
    S.weekly.push({ id: wkId, text: cleanText, cat, dur, day: bestWkDay, done: false });
    save();
    const dayLbl = fmtDate(new Date(bestWkDay+'T12:00:00'), {weekday:'long'});
    showPaWithMove(wkId, `Added "${cleanText}" to weekly list on ${dayLbl}. ${dur}min.`);
    render();
    return { kind: 'weekly', id: wkId, day: bestWkDay };
  }

  // "today"/"tomorrow" in text first, then day names, then the When option.
  // No block routing any more — everything lands on the day's flat list.
  let day = textDay;
  if (!day) {
    if (when === 'tomorrow') day = literalTomorrow();
    else day = viewDay; // 'today' and 'auto' both mean the day being viewed
  }

  if (!S.custom[day]) S.custom[day] = {};
  if (!S.custom[day][zone]) S.custom[day][zone] = [];
  const taskId = 'ct'+uid();
  S.custom[day][zone].push({ id: taskId, text: cleanText, done:false, cat, dur });

  save();

  // Track for highlight animation
  _lastAddedTaskId = taskId;

  if (day !== viewDay) {
    const dayLbl = day===today() ? 'today' :
      day===literalTomorrow() ? 'tomorrow' :
      fmtDate(new Date(day+'T12:00:00'), {weekday:'long',day:'numeric',month:'short'});
    showPa(`Added to ${dayLbl} (${dur}min). Viewing now.`);
    // Navigate to the day where the task was added (update week offset too)
    viewDay = day;
    const _tMon = getMon(new Date(day + 'T12:00:00'));
    const _cMon = getMon(new Date());
    viewWeekOffset = Math.round((_tMon - _cMon) / 86400000 / 7);
  }
  render();
  return { kind: 'custom', id: taskId, day, zone };
}

// Enter in a .list add box. Same-day adds keep focus in that box; anything that
// routed elsewhere (other day, recurring, weekly) has already jumped + toasted.
function listQuickAdd(zone, inp) {
  const text = inp.value.trim();
  if (!text) return;
  const res = addTaskFromText(text, { zone });
  if (!res) return;
  setTimeout(() => {
    if (res.kind === 'custom' && res.day === viewDay) {
      const newInp = document.querySelector(`.list[data-zone="${zone}"] .bk-add-inp`);
      if (newInp) newInp.focus();
    } else {
      const cardEl = document.querySelector('.list[data-zone="list"]');
      if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    setTimeout(() => { _lastAddedTaskId = null; }, 1600);
  }, 50);
}
