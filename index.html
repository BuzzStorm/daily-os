  return null;
}

// ── THE DAY'S FLAT LIST ──
// Recurring (this day of week, minus per-day skips) + weekly tasks assigned to
// the day + the day's custom list, in that natural order — then S.order[day]
// (manual drag order) wins where it has an opinion; unlisted ids keep their
// natural position at the end.
function listTasks(day) {
  const dow = new Date(day + 'T00:00:00').getDay();
  const skips = (S.skips || {})[day] || {};
  const all = [
    ...S.recurring.filter(r => r.dayOfWeek === dow && !skips[r.id]).map(t => ({ ...t, _type: 'rec' })),
    ...S.weekly.filter(w => w.day === day).map(t => ({ ...t, _type: 'w' })),
    ...(((S.custom[day]) || {}).list || []).map(t => ({ ...t, _type: 'c' })),
  ];
  const order = (S.order || {})[day];
  if (order && order.length) {
    const pos = new Map(order.map((id, i) => [id, i]));
    return all
      .map((t, i) => ({ t, k: pos.has(t.id) ? pos.get(t.id) : order.length + i }))
      .sort((a, b) => a.k - b.k)
      .map(x => x.t);
  }
  return all;
}

function isDone(tid, day) { return !!(S.done[day]||{})[tid]; }

function toggle(tid, day) {
  // `day` defaults to the day being viewed; carry-over rows pass their home
  // day so ticking a carried task marks it done where it actually lives.
  const dk = day || viewDay;
  if (!S.done[dk]) S.done[dk] = {};
  S.done[dk][tid] = !S.done[dk][tid];
  const nowDone = S.done[dk][tid];
  // Carry rows are exactly the case where a home day differing from the viewed
  // day is passed in. Record the day they were ticked so they stay visible
  // (struck through) until the day rolls over.
  if (day && day !== viewDay) {
    if (nowDone) S.carryTicked[tid] = viewDay;
    else delete S.carryTicked[tid];
  }
  checkStreak();
  save(); render();
  if (nowDone) {

function execMove(type, tid, zone, homeDay, target) {
  let toDay, toZone;
  if (target === 'tomorrow') { toDay = literalTomorrow(); toZone = 'list'; }
  else if (target === 'today') { toDay = today(); toZone = 'list'; }
  else if (target === 'parking') { toDay = viewDay; toZone = 'parking'; }
  else if (target.startsWith('date:')) { toDay = target.slice(5); toZone = 'list'; }
  else return;

  if (!S.custom[toDay]) S.custom[toDay] = {};
  if (!S.custom[toDay][toZone]) S.custom[toDay][toZone] = [];

  let label = '';
  if (type === 'c') {
    const arr = (S.custom[homeDay] || {})[zone];
    if (!arr) return;
    const idx = arr.findIndex(t => t.id === tid);
    if (idx === -1) return;
    const task = arr.splice(idx, 1)[0];
    S.custom[toDay][toZone].push(task);
    if (S.order[homeDay]) S.order[homeDay] = S.order[homeDay].filter(id => id !== tid);
    // Moving clears any carry-over state.
    if ((S.carryDismissed[homeDay] || {})[tid]) delete S.carryDismissed[homeDay][tid];
    label = task.text;
  } else if (type === 'rec') {
    // Recurring instance: hide it for this day, drop a one-off copy on the
    // target. The recurrence itself is untouched.
    const r = S.recurring.find(x => x.id === tid);
    if (!r) return;
    if (!S.skips[viewDay]) S.skips[viewDay] = {};
    S.skips[viewDay][tid] = true;
    S.custom[toDay][toZone].push({ id: 'ct'+uid(), text: r.text, dur: r.dur, cat: r.cat, notes: r.notes, done: false });
    label = r.text;
  } else if (type === 'w') {
    const w = S.weekly.find(x => x.id === tid);
    if (!w) return;
    if (toZone === 'parking') {
      // Weekly → parking: becomes a plain parked custom task.
      S.weekly = S.weekly.filter(x => x.id !== tid);
      S.custom[toDay][toZone].push({ id: w.id, text: w.text, dur: w.dur, cat: w.cat, notes: w.notes, done: false });
    } else {
      w.day = toDay;
    }
    label = w.text;
  } else {
    return;
  }

  save();
  closeMoveMenu();
  showPa(`Moved "${label}" to ${toZone === 'parking' ? 'the Parking Lot' : labelForDay(toDay)}.`);
  render();
}

function labelForDay(dk) {
  if (dk === today()) return 'today';
  if (dk === literalTomorrow()) return 'tomorrow';
  return new Date(dk+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
}

// ── IMPROVED parseTime — requires "at" prefix OR am/pm suffix to avoid matching bare numbers ──
function parseTime(text) {
  const l = text.toLowerCase();
  // Match "at 10", "at 2pm", "at 14:30", "10am", "2:30pm" — but NOT bare "10" without am/pm/at
  const m = l.match(/(?:at\s+)(\d{1,2})(?::(\d{2}))?\s*(am|pm)?|(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  if (!m) return null;
  // "at X" match: groups 1,2,3. "Xam/pm" match: groups 4,5,6
  let h = parseInt(m[1] || m[4]);
  const mins = parseInt(m[2] || m[5] || '0');
  const ampm = m[3] || m[6];
  if (ampm === 'pm' && h < 12) h += 12;
  if (ampm === 'am' && h === 12) h = 0;
  if (h < 6 || h > 22) return null;
  return { hour: h, min: mins, totalMin: h * 60 + mins };
}

// ── Parse "today" / "tomorrow" from text ──
function literalTomorrow() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toLocalDate();
}

function parseWhenFromText(text) {
  const l = text.toLowerCase();
  if (/\btoday\b/.test(l)) return today();
  if (/\btomorrow\b/.test(l)) return literalTomorrow();
  return null;
}

// ── Parse duration from text: "30 mins", "1 hour", "1.5 hours", "45m", "2h" ──
function parseDuration(text) {
  const l = text.toLowerCase();
  // "1 hour", "2 hours", "1.5 hours", "1.5h"
  const hm = l.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/);
  if (hm) return Math.round(parseFloat(hm[1]) * 60);
  // "30 mins", "45 min", "15 minutes"
  const mm = l.match(/(\d+)\s*(?:mins?|minutes?)\b/);
  if (mm) return parseInt(mm[1]);
  return null;
}

// Parse day from text like "monday", "tuesday", "wed"
// Returns { day: 'YYYY-MM-DD', match: 'tuesday' } or null
function parseDayName(text) {
  const l = text.toLowerCase();
  // Check longest names first to avoid "tue" matching inside "tuesday" prematurely
  const dayEntries = [
    ['wednesday',3],['thursday',4],['saturday',6],['tuesday',2],['sunday',0],['monday',1],['friday',5],
    ['wed',3],['thu',4],['sat',6],['tue',2],['sun',0],['mon',1],['fri',5]
  ];
  for (const [name, dow] of dayEntries) {
    const re = new RegExp('\\b' + name + '\\b', 'i');
    const m = l.match(re);
    if (m) {
      const now = new Date();
      const todayDow = now.getDay();
      let diff = dow - todayDow;
      if (diff <= 0) diff += 7;
      if (diff === 7 && l.includes('this')) diff = 0;
      const target = new Date(now);
      target.setDate(target.getDate() + diff);
      return { day: target.toLocalDate(), match: m[0] };
    }
  }
  return null;
}

function paAdd() {
  const inp = document.getElementById('qaInp');
  const text = inp.value.trim();
  if (!text) return;

  let cat = document.getElementById('qaCat').value;
  let dur = parseInt(document.getElementById('qaDur').value)||30;
  const when = document.getElementById('qaWhen').value;

  if (cat === 'auto') cat = detectCat(text) || 'life';

  // Parse duration from text (overrides the manual input if found)
  const parsedDur = parseDuration(text);
  if (parsedDur) dur = parsedDur;

  // ── Check for "every [day]" → create a RECURRING weekly task ──
  const everyMatch = text.match(/\bevery\s+(sun(?:day)?|mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?)\b/i);
  if (everyMatch) {
    const dayMap = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
    const prefix = everyMatch[1].slice(0,3).toLowerCase();
    const dow = dayMap[prefix];
    const cleanText = text.replace(everyMatch[0], '').replace(/\s{2,}/g,' ').trim();
    S.recurring.push({ id: 'rec'+uid(), text: cleanText || text, cat, dur, dayOfWeek: dow });
    save();
    const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    showPa(`Recurring task added: "${cleanText||text}" every ${dayNames[dow]}. ${dur}min.`);
    inp.value = '';
    render();
    return;
  }

  // Check for specific time in text
  const parsedTime = parseTime(text);

  // Parse day from text and clean the task title
  let textDay = null;
  let cleanText = text;
  const whenFromText = parseWhenFromText(text);
  const dayFromName = parseDayName(text);
  if (whenFromText) {
    textDay = whenFromText;
    cleanText = cleanText.replace(/\b(today|tomorrow)\b/gi, '');
  } else if (dayFromName) {
    textDay = dayFromName.day;
    cleanText = cleanText.replace(new RegExp('\\b' + dayFromName.match + '\\b', 'i'), '');
  }
  // Also strip duration and time phrases from text
  cleanText = cleanText.replace(/\b\d+(?:\.\d+)?\s*(?:hours?|hrs?|mins?|minutes?)\b/gi, '');
  cleanText = cleanText.replace(/\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi, '');
  cleanText = cleanText.replace(/\s{2,}/g, ' ').trim();
  if (!cleanText) cleanText = text; // fallback if everything was stripped

  // ── "This week" → add as a WEEKLY TASK (sidebar), not a day-specific custom task ──
  if (when === 'week' && !textDay && !parsedTime) {
    // Find the lightest remaining weekday (fewest open tasks)
    const mon = getMon(new Date());
    const wkDays = getWeek(mon).map(d=>d.toLocalDate()).filter(d => !isWeekend(d));
    let bestWkDay = wkDays[0];
    let minLoad = Infinity;
    for (const wd of wkDays) {
      // Skip past days
      if (wd < today()) continue;
      const load = listTasks(wd).filter(t => !isDone(t.id, wd)).length;
      if (load < minLoad) { minLoad = load; bestWkDay = wd; }
    }
    const wkId = uid();
    S.weekly.push({ id: wkId, text: cleanText, cat, dur, day: bestWkDay, done: false });
    save();
    const dayLbl = new Date(bestWkDay+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});
    showPaWithMove(wkId, `Added "${cleanText}" to weekly list on ${dayLbl}. ${dur}min.`);
    inp.value = '';
    render();
    return;
  }

  // Check for "today"/"tomorrow" in text first, then day names, then the
  // When selector. No block routing any more \u2014 everything lands on the day's
  // flat list.
  let day = textDay;
  if (!day) {
    if (when === 'tomorrow') day = literalTomorrow();
    else day = viewDay; // 'today' and 'auto' both mean the day being viewed
  }

  if (!S.custom[day]) S.custom[day] = {};
  if (!S.custom[day].list) S.custom[day].list = [];
  const taskId = 'ct'+uid();
  S.custom[day].list.push({ id: taskId, text: cleanText, done:false, cat, dur });

  save();

  const dayLbl = day===today() ? 'today' :
    day===literalTomorrow() ? 'tomorrow' :
    new Date(day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  showPa(`Added to ${dayLbl} (${dur}min). Viewing now.`);

  // Track for highlight animation
  _lastAddedTaskId = taskId;

  inp.value = '';
  // Navigate to the day where task was added (update week offset too)
  viewDay = day;
  const _tMon = getMon(new Date(day + 'T12:00:00'));
  const _cMon = getMon(new Date());
  viewWeekOffset = Math.round((_tMon - _cMon) / 86400000 / 7);
  render();

  // Scroll the day card into view, then clear the highlight tracker
  setTimeout(() => {
    const cardEl = document.querySelector('.sd-card[data-zone="list"]');
    if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => { _lastAddedTaskId = null; }, 1600);
  }, 50);
}

function saveTaskEdit(type, bid, tid) {
  const newText = document.getElementById('te-text').value.trim();
  const newNotes = document.getElementById('te-notes').value.trim();
  const newCat = document.getElementById('te-cat').value;
  const newDur = parseInt(document.getElementById('te-dur').value) || 30;

  if (!newText) return;

  if (type === 'w') {
    const task = S.weekly.find(w => w.id === tid);
    if (task) {
      task.text = newText;
      task.notes = newNotes || undefined;
      task.cat = newCat;
      task.dur = newDur;
    }
  } else if (type === 'c') {
    const c = (S.custom[viewDay]||{})[bid];
    const task = c ? c.find(t => t.id === tid) : null;
    if (task) {
      task.text = newText;
      task.notes = newNotes || undefined;
      task.cat = newCat;
      task.dur = newDur;
    }
  } else if (type === 'rec') {
    const task = S.recurring.find(r => r.id === tid);
    if (task) {
      task.text = newText;
      task.notes = newNotes || undefined;
      task.cat = newCat;
      task.dur = newDur;
      const newDow = document.getElementById('te-dow');
      if (newDow) task.dayOfWeek = parseInt(newDow.value);
    }
  }

  save();
  document.getElementById('task-edit-modal').remove();
  render();
}

            <option value="30" ${ev.reminder===30?'selected':''}>30 min before</option>

}

function saveEventEdit(id) {
  const ev = S.events.find(e => e.id === id);
  if (!ev) return;
  ev.text = document.getElementById('ee-title').value.trim() || ev.text;
  ev.date = document.getElementById('ee-date').value || ev.date;
  ev.time = document.getElementById('ee-time').value || null;
  ev.location = document.getElementById('ee-loc').value.trim() || null;
  ev.notes = document.getElementById('ee-notes').value.trim() || null;
  ev.repeat = document.getElementById('ee-repeat').value;

  ev.reminder = reminderVal !== '' ? parseInt(reminderVal) : null;
  if (ev.reminder !== null) requestNotificationPermission();
  save();
  document.getElementById('ev-edit-modal').remove();
  render();
}

function getUpcomingEvents() {
  const now = new Date();
  now.setHours(0,0,0,0);
  const cutoff = new Date(now);
  cutoff.setDate(cutoff.getDate() + 60);

  let upcoming = [];
  for (const ev of S.events) {
    let evDate = new Date(ev.date + 'T00:00:00');

    if (ev.repeat === 'yearly') {
      evDate.setFullYear(now.getFullYear());
      if (evDate < now) evDate.setFullYear(now.getFullYear() + 1);
    } else if (ev.repeat === 'monthly') {
      evDate.setFullYear(now.getFullYear());
      evDate.setMonth(now.getMonth());
      if (evDate < now) evDate.setMonth(now.getMonth() + 1);
    } else if (ev.repeat === 'weekly') {
      while (evDate < now) evDate.setDate(evDate.getDate() + 7);
    }

    if (evDate >= now && evDate <= cutoff) {
      const diffDays = Math.round((evDate - now) / 86400000);
      upcoming.push({ ...ev, nextDate: evDate, daysAway: diffDays });
    }
  }

  return upcoming.sort((a,b) => {
    if (a.daysAway !== b.daysAway) return a.daysAway - b.daysAway;
    // Same day: events with time before events without, then by time
    if (a.time && !b.time) return -1;
    if (!a.time && b.time) return 1;
    if (a.time && b.time) return a.time.localeCompare(b.time);
    return 0;
  });
}

function getTodayEvents() {
  return getUpcomingEvents().filter(e => e.daysAway === 0);
}

function getSoonEvents() {
  return getUpcomingEvents().filter(e => e.daysAway > 0 && e.daysAway <= 7);
}

// ── PINNED COUNTDOWN ──
// Seed the default countdown events (stag, baby) + pins, once each. Returns true if
// anything changed. Idempotent and safe to call on startup AND after every sync pull,
// so a remote state saved before these existed can't permanently clobber them.
// NB: seeds are declared inside the function — this runs during startup (before the
// rest of the script body executes), so a module-level `const` would be in its TDZ.
function ensureCountdowns() {
  const COUNTDOWN_SEEDS = [
    { flag: '_stagSeeded', text: "Benson's Stag", date: '2026-09-04', location: 'Marbella' },
    { flag: '_babySeeded', text: 'Baby due',      date: '2026-11-16' },
  ];
  let changed = false;
  // Migrate the old single-pin model to the array.
  if (S.pinnedCountdown !== undefined) {
    if (!Array.isArray(S.pinnedCountdowns)) S.pinnedCountdowns = [];
    if (S.pinnedCountdown && !S.pinnedCountdowns.some(p => p.eventId === S.pinnedCountdown.eventId)) {
      S.pinnedCountdowns.push(S.pinnedCountdown);
    }
    delete S.pinnedCountdown;
    changed = true;
  }
  if (!Array.isArray(S.pinnedCountdowns)) { S.pinnedCountdowns = []; changed = true; }

  for (const seed of COUNTDOWN_SEEDS) {
    if (S[seed.flag]) continue;
    S.events = S.events || [];
    let ev = S.events.find(e => e.text === seed.text);
    if (!ev) {
      ev = { id: uid(), text: seed.text, date: seed.date, repeat: 'none', time: null, reminder: null };
      if (seed.location) ev.location = seed.location;
      S.events.push(ev);
    }
    if (!S.pinnedCountdowns.some(p => p.eventId === ev.id)) {
      S.pinnedCountdowns.push({ eventId: ev.id, pinnedAt: today() });
    }
    S[seed.flag] = true;
    changed = true;
  }
  return changed;
}

function isPinnedCountdown(id) {
  return Array.isArray(S.pinnedCountdowns) && S.pinnedCountdowns.some(p => p.eventId === id);
}

// Resolve one pin to its next occurrence. Returns { ev, evDate, diffDays, pinnedAt } or null.
// Unlike getUpcomingEvents() this is NOT capped at 60 days.
function countdownTarget(pin) {
  const ev = S.events.find(e => e.id === pin.eventId);
  if (!ev) return null;

  const now = new Date();
  now.setHours(0, 0, 0, 0);
  let evDate = new Date(ev.date + 'T00:00:00');

  if (ev.repeat === 'yearly') {
    evDate.setFullYear(now.getFullYear());
    if (evDate < now) evDate.setFullYear(now.getFullYear() + 1);
  } else if (ev.repeat === 'monthly') {
    evDate.setFullYear(now.getFullYear());
    evDate.setMonth(now.getMonth());
    if (evDate < now) evDate.setMonth(now.getMonth() + 1);
  } else if (ev.repeat === 'weekly') {
    while (evDate < now) evDate.setDate(evDate.getDate() + 7);
  } else if (evDate < now) {
    return null; // one-off that has passed
  }

  const diffDays = Math.round((evDate - now) / 86400000);
  return { ev, evDate, diffDays, pinnedAt: pin.pinnedAt };
}

function togglePinCountdown(id) {
  if (!Array.isArray(S.pinnedCountdowns)) S.pinnedCountdowns = [];
  if (isPinnedCountdown(id)) {
    S.pinnedCountdowns = S.pinnedCountdowns.filter(p => p.eventId !== id);
  } else {
    S.pinnedCountdowns.push({ eventId: id, pinnedAt: today() });
  }
  save(); render();
}

function unpinCountdown(id) {
  S.pinnedCountdowns = (S.pinnedCountdowns || []).filter(p => p.eventId !== id);
  save(); render();
}

function renderCountdownCard(target) {
  const { ev, evDate, diffDays, pinnedAt } = target;

  // Runway bar: empty when pinned -> full on the day. Guard zero/negative span.
  const pinDate = new Date((pinnedAt || today()) + 'T00:00:00');
  const spanDays = Math.round((evDate - pinDate) / 86400000);
  let pct = 0;
  if (spanDays > 0) {
    pct = Math.max(0, Math.min(100, Math.round(((spanDays - diffDays) / spanDays) * 100)));
  } else if (diffDays <= 0) {
    pct = 100;
  }

  const num = diffDays === 0 ? 'Today' : diffDays;
  const unit = diffDays === 0 ? '' : (diffDays === 1 ? 'Day to go' : 'Days to go');
  const loc = ev.location ? `<span class="cd-hero-loc">&middot; ${ev.location}</span>` : '';
  const dateStr = evDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  return `
    <div class="cd-hero">
      <span class="cd-hero-unpin" title="Unpin countdown" onclick="unpinCountdown('${ev.id}')">&times;</span>
      <div class="cd-hero-label">&#9203; ${ev.text}${loc}</div>
      <div class="cd-hero-body">
        <div class="cd-hero-num">${num}</div>
        ${unit ? `<div class="cd-hero-unit">${unit}</div>` : ''}
      </div>
      <div class="cd-hero-foot">
        <div class="cd-hero-bar"><div class="cd-hero-bar-fill" style="width:${pct}%"></div></div>
        <span class="cd-hero-date">${dateStr}</span>
      </div>
    </div>`;
}

function renderCountdownHero() {
  const pins = S.pinnedCountdowns || [];
  const targets = [];
  const stale = [];
  for (const pin of pins) {
    const t = countdownTarget(pin);
    if (t) targets.push(t); else stale.push(pin.eventId);
  }
  // Drop pins whose event was deleted or whose one-off date has passed.
  if (stale.length) {
    S.pinnedCountdowns = pins.filter(p => !stale.includes(p.eventId));
    save();
  }
  if (!targets.length) return '';
  // Nearest event first.
  targets.sort((a, b) => a.diffDays - b.diffDays);
  return `<div class="cd-hero-row">${targets.map(renderCountdownCard).join('')}</div>`;
}

// ── STREAK ──
function checkStreak() {
  const tk = today();
  const d = S.done[tk] || {};
  const allNn = NN.every(n => d[n.link]);
  if (allNn && !S.streak.includes(tk)) S.streak.push(tk);
  else if (!allNn) S.streak = S.streak.filter(x=>x!==tk);
}

function streakCount() {
  const sorted = [...S.streak].sort().reverse();
  if (!sorted.length) return 0;
  let count = 0;
  let check = new Date();
  const tk = today();
  const d = S.done[tk]||{};
  if (!NN.every(n=>d[n.link])) check.setDate(check.getDate()-1);
  for (let i=0;i<90;i++) {
    if (sorted.includes(check.toLocalDate())) {
      count++; check.setDate(check.getDate()-1);
    } else break;
  }
  return count;
}

// ── WEEKLY TASKS ──
function toggleWk(id) {
  const t = S.weekly.find(w=>w.id===id);
  if (t) {
    t.done = !t.done;
    if (t.day) {
      if (!S.done[t.day]) S.done[t.day] = {};
      S.done[t.day][id] = t.done;
    }
    save(); render();
  }
}

function cycleDay(id, el) {
  const t = S.weekly.find(w=>w.id===id);
  if (!t) return;

  const existing = document.getElementById('day-picker');
  if (existing) existing.remove();

  const mon = getMon(new Date());
  const wk = getWeek(mon);
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const picker = document.createElement('div');
  picker.id = 'day-picker';
  picker.style.cssText = 'position:fixed;z-index:999;background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,0.5);';
  const rect = el.getBoundingClientRect();
  picker.style.top = (rect.bottom + 4) + 'px';
  picker.style.left = (rect.left - 40) + 'px';

  wk.forEach((d, i) => {
    const dk = d.toLocalDate();
    const isCurrent = dk === t.day;
    const btn = document.createElement('button');
    btn.textContent = dayNames[i];
    btn.style.cssText = `display:block;width:100%;padding:5px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;border:none;background:${isCurrent?'var(--accent-bg)':'none'};color:${isCurrent?'var(--accent)':'var(--text2)'};cursor:pointer;text-align:left;border-radius:4px;`;
    btn.onmouseenter = () => { if(!isCurrent) btn.style.background='var(--s3)'; };
    btn.onmouseleave = () => { if(!isCurrent) btn.style.background='none'; };
    btn.onclick = () => {
      t.day = dk;
      save();
      picker.remove();
      render();
    };
    picker.appendChild(btn);
  });

  document.body.appendChild(picker);

  setTimeout(() => {
    const close = (e) => {
      if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('click', close); }
    };
    document.addEventListener('click', close);
  }, 10);
}

function rmWk(id) {
  S.weekly = S.weekly.filter(w=>w.id!==id);
  save(); render();
}

        <div id="calendarDrop"></div>
      </div>

// ── DAY CARD (the new core) ──
function renderDayCard(day) {
  const isToday = day === today();
  const tasks = listTasks(day);
  const carries = isToday ? getCarryTasks() : [];
  const doneCount = tasks.filter(t => isDone(t.id, day)).length;
  const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;
  const title = isToday ? 'TODAY' : new Date(day + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long' }).toUpperCase();
  const dayEvents = getUpcomingEvents()
    .filter(e => e.nextDate.toLocalDate() === day)
    .sort((a, b) => (a.time ? timeToMin(a.time) : -1) - (b.time ? timeToMin(b.time) : -1));

  let htm = `<div class="sd-card" data-zone="list" ondragover="dragOverBlock(event)" ondragleave="dragLeaveBlock(event)" ondrop="dropTask(event,'list')">
    <div class="sd-head"><span class="sd-title">${title}</span><span class="sd-count">${doneCount}/${tasks.length}</span></div>
    <div class="sd-progress"><i style="width:${pct}%"></i></div>`;
  for (const ev of dayEvents) htm += sdEventRow(ev);
  for (const t of carries) htm += sdTaskRow(t, 'list', { carry: true });
  // Group ticked tasks first — display-only; S.order must stay untouched
  // because moveOrReorder rebuilds it from listTasks() order on every drag.
  const grouped = [...tasks].sort((a, b) => Number(isDone(b.id, day)) - Number(isDone(a.id, day)));
  for (const t of grouped) htm += sdTaskRow(t, 'list', {});
  if (!tasks.length && !carries.length) {
    htm += `<div style="padding:14px 4px;font-size:13px;color:var(--muted);">${isDayOff(day) ? 'Day off. Enjoy.' : 'Nothing on the list yet.'}</div>`;
  }
  htm += `<div class="bk-add" onclick="this.querySelector('input').focus()">
      <span class="bk-add-plus">+</span>
      <input class="bk-add-inp" type="text" placeholder="Add to ${isToday ? 'today' : 'this day'}..."
        onkeydown="if(event.key==='Enter'){listQuickAdd('list',this);event.stopPropagation();}"
        onfocus="this.parentElement.classList.add('focused')"
        onblur="this.parentElement.classList.remove('focused')">
    </div>
  </div>`;
  return htm;
}

function sdEventRow(ev) {
  const cls = ev.mufc ? ' mufc' : ev.holiday ? ' holiday' : '';
  const badge = ev.mufc ? 'MAN UTD' : ev.holiday ? 'HOLIDAY' : 'EVENT';
  const locStr = ev.location ? ` &middot; ${ev.location}` : '';
  return `<div class="sd-ev${cls}" onclick="editEvent('${ev.id}')">
    <span class="sd-ev-time">${ev.time || 'ALL&nbsp;DAY'}</span>
    <span class="sd-ev-name">${ev.mufc ? '⚽ ' : ''}${ev.text}${locStr ? `<span style="color:var(--muted);font-size:11px;">${locStr}</span>` : ''}</span>
    <span class="sd-ev-badge">${badge}</span>
  </div>`;
}

// One task row. `zone` is 'list' or 'parking'; opts.carry marks a carried-over
// task surfaced from a previous day (t._home).
function sdTaskRow(t, zone, opts = {}) {
  const home = opts.carry ? t._home : viewDay;
  const d = isDone(t.id, home);
  const type = t._type || 'c';
  const justAdded = t.id === _lastAddedTaskId;
  const repeatTag = type === 'rec' ? '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:var(--accent);opacity:0.7;margin-left:6px;">REPEATS</span>' : '';
  const carryChip = opts.carry ? `<span class="sd-carry">&#8617; ${carryChipLabel(t._home)}</span>` : '';
  const rmBtn = opts.carry
    ? `<span class="t-rm" title="Stop carrying" onclick="event.stopPropagation();dismissCarry('${home}','${t.id}')">&times;</span>`
    : type === 'c' ? (t._template ? '' : `<span class="t-rm" onclick="event.stopPropagation();rmCustom('${zone}','${t.id}')">&times;</span>`)
    : type === 'w' ? `<span class="t-rm" onclick="event.stopPropagation();rmWk('${t.id}')">&times;</span>`
    : `<span class="t-rm" onclick="event.stopPropagation();rmRecurring('${t.id}')">&times;</span>`;
  const moveBtn = t._template ? '' : `<span class="t-move" title="Move to&hellip;" onclick="event.stopPropagation();moveMenu('${type}','${t.id}','${zone}','${home}',this)">&#8644;</span>`;
  const dragAttrs = (opts.carry || t._template) ? '' :
    `draggable="true" ondragstart="dragTask(event,'${zone}','${type}','${t.id}')" ondragover="dragOverRow(event)" ondragleave="dragLeaveRow(event)" ondrop="dropOnRow(event,'${zone}','${t.id}')"`;
  const editAttr = t._template ? '' : `style="cursor:pointer;" onclick="editTask('${type}','${zone}','${t.id}')"`;
  return `
    <div class="task ${justAdded ? 'just-added-task' : ''}" ${dragAttrs}>
      <span class="sd-grip">&#8942;&#8942;</span>
      <div class="tck ${d ? 'done' : ''}" onclick="toggle('${t.id}','${home}')"></div>
      <div class="sd-cat cat-bg-${t.cat || 'life'}"></div>
      <div class="t-content" ${editAttr}>
        <div class="t-text ${d ? 'done' : ''}">${t.text}${repeatTag}</div>
        ${t.notes ? `<div class="t-bullets">${t.notes.split('\n').filter(l => l.trim()).map(l => `<div class="t-bullet">${l.trim()}</div>`).join('')}</div>` : ''}
      </div>
      ${carryChip}
      ${moveBtn}
      ${rmBtn}
    </div>`;
}

  for (const t of carries) htm += sdTaskRow(t, 'parking', { carry: true });

function rmRecurring(id) {
  // Gym rows are rebuilt from S.gymDays on every launch and sync pull, so
  // filtering S.recurring alone gets undone. Remove the day from the source
  // of truth instead and let syncGymDays() rebuild.
  if (id.startsWith('rec_gym_')) {
    const dow = parseInt(id.slice('rec_gym_'.length), 10);
    S.gymDays = S.gymDays.filter(d => d !== dow);
    syncGymDays();
    save(); render();
    return;
  }
  S.recurring = S.recurring.filter(r => r.id !== id);
  save(); render();
}

// ── DRAG AND DROP (reorder within a list, or move between list & parking) ──
function dragTask(e, fromZone, type, tid) {
  e.dataTransfer.setData('text/plain', JSON.stringify({ fromZone, type, tid }));
  e.dataTransfer.effectAllowed = 'move';
  // Add dragging class after a tick so it doesn't affect the drag image
  setTimeout(() => e.target.closest('.task')?.classList.add('dragging'), 0);
}
function dragOverBlock(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dragLeaveBlock(e) {
  e.currentTarget.classList.remove('drag-over');
}
function dragOverRow(e) {
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drop-above');
}
function dragLeaveRow(e) {
  e.currentTarget.classList.remove('drop-above');
}
function dropOnRow(e, zone, beforeTid) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drop-above');
  let data;
  try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  moveOrReorder(data, zone, beforeTid);
}
function dropTask(e, toZone) {
  // Card-level drop: append to the end of that zone.
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  let data;
  try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  moveOrReorder(data, toZone, null);
}
function moveOrReorder(data, toZone, beforeTid) {
  const { fromZone, type, tid } = data;
  if (!tid || tid === beforeTid) return;
  if (fromZone === toZone) {
    // Reorder within the zone
    if (toZone === 'list') {
      const ids = listTasks(viewDay).map(t => t.id).filter(id => id !== tid);
      if (beforeTid) {
        const i = ids.indexOf(beforeTid);
        ids.splice(i === -1 ? ids.length : i, 0, tid);
      } else {
        ids.push(tid);
      }
      S.order[viewDay] = ids;
    } else {
      const arr = (S.custom[viewDay] || {}).parking || [];
      const i = arr.findIndex(t => t.id === tid);
      if (i === -1) return;
      const [task] = arr.splice(i, 1);
      const j = beforeTid ? arr.findIndex(t => t.id === beforeTid) : -1;
      if (j === -1) arr.push(task); else arr.splice(j, 0, task);
    }
    save(); render();
    return;
  }
  // Cross-zone (list ↔ parking): same semantics as the ⇄ move menu.
  execMove(type, tid, fromZone, viewDay, toZone === 'parking' ? 'parking' : 'date:' + viewDay);
}

function renderEvents() {
  const el = document.getElementById('evList');
  const upcoming = getUpcomingEvents();
  if (!upcoming.length) {
    el.innerHTML = '<div style="font-size:11px;color:#5e6280;font-style:italic;">No upcoming events.</div>';
    return;
  }

  const evItemHtml = (ev) => {
    const dateStr = ev.nextDate.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const soon = ev.daysAway <= 7;
    const timeStr = ev.time ? ' ' + ev.time : '';
    const locTag = ev.location ? `<span style="font-size:10px;color:var(--muted);"> ${ev.location}</span>` : '';
    const bellTag = ev.reminder != null ? `<span style="font-size:9px;color:var(--accent);margin-left:3px;" title="Reminder set">&#128276;</span>` : '';
    const holTag = ev.holiday ? `<span style="font-size:8px;color:#6ea8b8;border:1px solid rgba(110,168,184,0.4);border-radius:3px;padding:0 3px;margin-left:5px;letter-spacing:0.5px;vertical-align:middle;">HOL</span>` : '';
    const mufcTag = ev.mufc ? `<span style="font-size:8px;color:#DA291C;border:1px solid rgba(218,41,28,0.45);border-radius:3px;padding:0 3px;margin-left:5px;letter-spacing:0.5px;vertical-align:middle;">MUFC</span>` : '';
    const isPinned = isPinnedCountdown(ev.id);
    const pinTag = `<span class="ev-pin ${isPinned?'active':''}" title="${isPinned?'Unpin countdown':'Pin as countdown'}" onclick="event.stopPropagation();togglePinCountdown('${ev.id}')">&#128204;</span>`;
    return `<div class="ev-item" style="cursor:pointer;" onclick="editEvent('${ev.id}')">
      <div class="ev-date">${dateStr}${timeStr}</div>
      <div class="ev-txt">${ev.text}${mufcTag}${holTag}${locTag}${bellTag}</div>
      <div class="ev-days ${ev.daysAway===0?'today':soon?'soon':''}">${ev.daysAway===0?'Today':ev.daysAway+'d'}</div>
      ${pinTag}
      <span class="ev-rm" onclick="event.stopPropagation();rmEvent('${ev.id}')">&times;</span>
    </div>`;
  };

  // Group nearest-first: "This week" / "Next week", then by real calendar month
  // (so a 28-day-out July event reads "July", not a misleading "This month").
  const todayD = new Date(today() + 'T12:00:00');
  const todayDow = todayD.getDay();                  // 0=Sun..6=Sat
  const daysToEndOfWeek = (7 - todayDow) % 7;        // days until upcoming Sunday
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const labelFor = (ev) => {
    if (ev.daysAway <= daysToEndOfWeek) return 'This week';
    if (ev.daysAway <= daysToEndOfWeek + 7) return 'Next week';
    const d = ev.nextDate;
    return d.getFullYear() === todayD.getFullYear() ? MONTHS[d.getMonth()] : `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  };

  // upcoming is already sorted nearest-first, so groups come out in order.
  const groups = [];
  const byLabel = {};
  for (const ev of upcoming) {
    const label = labelFor(ev);
    if (!(label in byLabel)) { byLabel[label] = groups.length; groups.push({ label, items: [] }); }
    groups[byLabel[label]].items.push(ev);
  }

  el.innerHTML = groups
    .map(g => {
      const html = `<div class="ev-group">${g.label}</div>${g.items.map(evItemHtml).join('')}`;
      return g.label === 'This week' ? `<div class="ev-now">${html}</div>` : html;
    })
    .join('');
}

  else if (h>=16) el.textContent = `Day wrapping up. ${nn}/${NN.length} non-negs, ${done}/${all.length} tasks. Finish strong.`;
  else el.textContent = `${done}/${all.length} done. ${NN.length-nn} non-negs remaining. Keep ticking.`;
}

// ── CUSTOM CALENDAR ──
let _calMonth = null; // tracks which month is displayed
let _calOpen = false;

function toggleCalendar() {
  if (_calOpen) { closeCalendar(); return; }
  _calMonth = new Date(viewDay + 'T12:00:00');
  _calOpen = true;
  renderCalendar();
  // Close on outside click (delayed to avoid catching the toggle click itself)
  setTimeout(() => {
    document.addEventListener('click', _calOutsideClick);
  }, 10);
}

function closeCalendar() {
  _calOpen = false;
  const el = document.getElementById('calendarDrop');
  if (el) el.innerHTML = '';
  document.removeEventListener('click', _calOutsideClick);
}

function _calOutsideClick(e) {
  const cal = document.querySelector('.cal');
  if (cal && !cal.contains(e.target) && !e.target.closest('.date-line')) {
    closeCalendar();
  }
}

function renderCalendar() {
  const el = document.getElementById('calendarDrop');
  if (!el || !_calOpen) return;

  const year = _calMonth.getFullYear();
  const month = _calMonth.getMonth();
  const monthName = _calMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  // First day of month and how many days
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();

  // Start on Monday (adjust: Sun=0 → 6, Mon=1 → 0, etc.)
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;

  // Days from previous month to fill first row
  const prevMonthLast = new Date(year, month, 0).getDate();

  // Get event dates for dots
  const upcoming = getUpcomingEvents();
  const evDates = new Set(upcoming.map(e => e.nextDate.toLocalDate()));

  let grid = '';
  // Day of week headers
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d => {
    grid += `<div class="cal-dow">${d}</div>`;
  });

  // Previous month trailing days
  for (let i = startDow - 1; i >= 0; i--) {
    const d = prevMonthLast - i;
    const dt = new Date(year, month - 1, d);
    const dk = dt.toLocalDate();
    grid += `<div class="cal-day other" onclick="jumpToDate('${dk}')">${d}</div>`;
  }

  // Current month days
  const tk = today();
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month, d);
    const dk = dt.toLocalDate();
    const isToday = dk === tk;
    const isSelected = dk === viewDay;
    const hasEv = evDates.has(dk);
    const cls = ['cal-day'];
    if (isToday) cls.push('today');
    if (isSelected) cls.push('selected');
    if (hasEv) cls.push('has-ev');
    grid += `<div class="${cls.join(' ')}" onclick="jumpToDate('${dk}')">${d}</div>`;
  }

  // Next month leading days to fill grid
  const totalCells = startDow + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    const dt = new Date(year, month + 1, d);
    const dk = dt.toLocalDate();
    grid += `<div class="cal-day other" onclick="jumpToDate('${dk}')">${d}</div>`;
  }

  el.innerHTML = `
    <div class="cal" onclick="event.stopPropagation()">
      <div class="cal-hdr">
        <button class="cal-nav" onclick="calNav(-1)">&#8592;</button>
        <div class="cal-title">${monthName}</div>
        <button class="cal-nav" onclick="calNav(1)">&#8594;</button>
      </div>
      <div class="cal-grid">${grid}</div>
    </div>`;
}

function calNav(dir) {
  _calMonth.setMonth(_calMonth.getMonth() + dir);
  renderCalendar();
}

// ── SEARCH ──
function searchTasks(query) {
  const el = document.getElementById('searchResults');
  const q = query.trim().toLowerCase();
  if (!q) { el.style.display = 'none'; return; }

  const results = [];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Search weekly tasks
  for (const w of S.weekly) {
    if (w.text.toLowerCase().includes(q)) {
      const dayLbl = w.day ? new Date(w.day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : 'unassigned';
      results.push({ text: w.text, type: 'weekly', cat: w.cat, day: dayLbl, jumpDay: w.day || today() });
    }
  }

  // Search custom tasks (across all days: day list + parking)
  for (const [day, zones] of Object.entries(S.custom)) {
    for (const [zone, tasks] of Object.entries(zones)) {
      if (!Array.isArray(tasks)) continue;
      for (const t of tasks) {
        if (t.text.toLowerCase().includes(q)) {
          const dayLbl = new Date(day+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
          results.push({ text: t.text, type: 'added', block: zone === 'parking' ? 'Parking Lot' : 'Day list', cat: t.cat, day: dayLbl, jumpDay: day, jumpZone: zone });
        }
      }
    }
  }

  // Search recurring user tasks
  for (const r of S.recurring) {
    if (r.text.toLowerCase().includes(q)) {
      const dayNames2 = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      results.push({ text: r.text, type: 'repeats ' + dayNames2[r.dayOfWeek], cat: r.cat, day: 'every week', jumpDay: today() });
    }
  }

  // Search events
  for (const ev of S.events) {
    if (ev.text.toLowerCase().includes(q)) {
      const loc = ev.location ? ` (${ev.location})` : '';
      results.push({ text: ev.text + loc, type: 'event', cat: null, mufc: !!ev.mufc, day: new Date(ev.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}), jumpDay: ev.date, eventId: ev.id });
    }
  }

  if (results.length === 0) {
    el.innerHTML = '<div class="sr-empty">No matches</div>';
    el.style.display = 'block';
    return;
  }

  // Highlight matching text
  function hl(text) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return text;
    return text.slice(0, idx) + '<em>' + text.slice(idx, idx + q.length) + '</em>' + text.slice(idx + q.length);
  }

  el.innerHTML = results.slice(0, 10).map((r, i) => {
    const catCls = r.cat ? 'cat-bg-' + r.cat : '';
    const catBg = r.mufc ? 'background:#DA291C;' : (r.cat ? '' : 'background:var(--accent);');
    const meta = r.type === 'recurring' ? 'daily' : (r.day || '');
    return `<div class="sr-item" onclick="searchJump(${i})" data-idx="${i}">
      <div class="sr-dot ${catCls}" style="${catBg}"></div>
      <div class="sr-text">${r.mufc?'⚽ ':''}${hl(r.text)}</div>
      <div class="sr-meta">${meta}</div>
    </div>`;
  }).join('');
  el.style.display = 'block';

  // Store results for click handler
  el._results = results;
}

function searchJump(idx) {
  const el = document.getElementById('searchResults');
  const r = el._results[idx];
  if (!r) return;

  // Jump to the day
  jumpToDate(r.jumpDay);

  // Clear search
  document.getElementById('searchInp').value = '';
  el.style.display = 'none';

  // If it's an event, open the editor
  if (r.eventId) {
    setTimeout(() => editEvent(r.eventId), 100);
    return;
  }

  // Scroll the matching card into view
  if (r.jumpZone) {
    setTimeout(() => {
      const cardEl = document.querySelector(`.sd-card[data-zone="${r.jumpZone}"]`);
      if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }
}

// ── CLEAN OLD DATA ──
const cut = new Date(); cut.setDate(cut.getDate()-30);
// Rescue unticked parked tasks before their home day is purged: move them
// into today's parking lot (dedup by id — the purge re-runs every launch and
// cloud pulls can resurrect old days, so this must stay idempotent). Must run
// before the S.done purge below, which deletes the done-state it checks.
Object.keys(S.custom).forEach(k => {
  if (new Date(k) >= cut) return;
  const strand = ((S.custom[k] || {}).parking || [])
    .filter(t => !isDone(t.id, k) && !((S.carryDismissed[k] || {})[t.id]));
  if (!strand.length) return;
  const tk = today();
  if (!S.custom[tk]) S.custom[tk] = {};
  if (!S.custom[tk].parking) S.custom[tk].parking = [];
  const have = new Set(S.custom[tk].parking.map(t => t.id));
  for (const t of strand) if (!have.has(t.id)) S.custom[tk].parking.push(t);
});
Object.keys(S.done).forEach(k=>{ if(new Date(k)<cut) delete S.done[k]; });
Object.keys(S.custom).forEach(k=>{ if(new Date(k)<cut) delete S.custom[k]; });
Object.keys(S.order).forEach(k=>{ if(new Date(k)<cut) delete S.order[k]; });
Object.keys(S.skips).forEach(k=>{ if(new Date(k)<cut) delete S.skips[k]; });
Object.keys(S.carryDismissed).forEach(k=>{ if(new Date(k)<cut) delete S.carryDismissed[k]; });
Object.keys(S.carryTicked).forEach(k=>{ if(new Date(S.carryTicked[k])<cut) delete S.carryTicked[k]; });
S.daysOff = S.daysOff.filter(d => new Date(d) >= cut);
// saveLocal, NOT save(): this purge runs on EVERY launch on every device.
// As save() it marked every device dirty at every open, so cloudPull's
// "dirty local wins" branch meant sync-enabled devices NEVER pulled first —
// the root cause of the recurring stale-device clobbers.
saveLocal();

// ── NOTIFICATIONS / REMINDERS ──
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// Track which reminders we've already fired (so we don't repeat)
const _firedReminders = new Set(JSON.parse(localStorage.getItem('dailyOS_fired') || '[]'));

function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  const now = new Date();
  const todayStr = today();

  for (const ev of S.events) {
    if (ev.reminder == null || !ev.time) continue;

    // Find the next occurrence date
    let evDate = new Date(ev.date + 'T00:00:00');
    if (ev.repeat === 'yearly') {
      evDate.setFullYear(now.getFullYear());
      if (evDate < new Date(todayStr + 'T00:00:00')) evDate.setFullYear(now.getFullYear() + 1);
    } else if (ev.repeat === 'weekly') {
      while (evDate < new Date(todayStr + 'T00:00:00')) evDate.setDate(evDate.getDate() + 7);
    } else if (ev.repeat === 'monthly') {
      evDate.setFullYear(now.getFullYear());
      evDate.setMonth(now.getMonth());
      if (evDate < new Date(todayStr + 'T00:00:00')) evDate.setMonth(now.getMonth() + 1);
    }

    const evDateStr = evDate.toLocalDate();

    // Build the exact event datetime
    const [eh, em] = ev.time.split(':').map(Number);
    const eventTime = new Date(evDate);
    eventTime.setHours(eh, em, 0, 0);

    // Calculate when the reminder should fire
    const reminderTime = new Date(eventTime.getTime() - ev.reminder * 60000);

    // Unique key for this reminder instance
    const fireKey = ev.id + '_' + evDateStr;
    if (_firedReminders.has(fireKey)) continue;

    // Fire if we're within 1 minute of reminder time
    const diffMs = now.getTime() - reminderTime.getTime();
    if (diffMs >= 0 && diffMs < 60000) {
      _firedReminders.add(fireKey);
      localStorage.setItem('dailyOS_fired', JSON.stringify([..._firedReminders]));

      const label = ev.reminder === 0 ? 'now' :
        ev.reminder < 60 ? `in ${ev.reminder} min` :
        ev.reminder === 60 ? 'in 1 hour' : 'tomorrow';
      const loc = ev.location ? ` at ${ev.location}` : '';

      new Notification('Daily OS', {
        body: `${ev.text}${loc} · ${label} (${ev.time})`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%231a1c24"/><circle cx="16" cy="16" r="8" fill="%23d4a44a"/></svg>',
        tag: fireKey,
      });
    }
  }
}

// Clean up old fired reminders (keep only last 7 days worth)
const _oldFired = [..._firedReminders].filter(k => {
  const parts = k.split('_');
  const d = parts[parts.length - 1];
  return d && new Date(d) >= new Date(today() + 'T00:00:00');
});
if (_oldFired.length !== _firedReminders.size) {
  _firedReminders.clear();
  _oldFired.forEach(k => _firedReminders.add(k));
  localStorage.setItem('dailyOS_fired', JSON.stringify([..._firedReminders]));
}

// ── CLOUD SYNC functions (constants live next to save(), above the first
// top-level save() call, to avoid TDZ errors) ──
async function syncRpc(fn, body) {
  const res = await fetch(SYNC_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SYNC_API_KEY,
      'Authorization': 'Bearer ' + SYNC_API_KEY,
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('sync http ' + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function syncSetStatus(state, label) {
  const dot = document.getElementById('syncDot');
  if (dot) dot.className = 'sync-' + state;
  const item = document.getElementById('syncMenuItem');
  if (item) item.textContent = 'Sync: ' + label;
  // Always-visible pill: short, glanceable label.
  const pillDot = document.getElementById('syncPillDot');
  const pillText = document.getElementById('syncPillText');
  if (pillDot) pillDot.className = 'sync-dot sync-' + state;
  if (pillText) {
    pillText.textContent =
      state === 'ok' ? 'synced' :
      state === 'pending' ? 'syncing…' :
      state === 'err' ? 'offline' : 'sync off';
  }
}

function scheduleCloudPush() {
  if (_applyingRemote || !syncKey()) return;
  setSyncDirty(true);
  syncSetStatus('pending', 'saving…');
  clearTimeout(_syncPushTimer);
  _syncPushTimer = setTimeout(cloudPush, 1200);
}

async function cloudPush() {
  if (!syncKey() || _syncPushing) return;
  _syncPushing = true;
  try {
    const out = await syncRpc('dailyos_push', { sync_key: syncKey(), payload: S });
    if (out && out.updated_at) localStorage.setItem(SYNC_TS_LS, out.updated_at);
    setSyncDirty(false);
    syncSetStatus('ok', 'on · up to date');
  } catch (e) {
    syncSetStatus('err', 'offline · will retry');
    clearTimeout(_syncPushTimer);
    _syncPushTimer = setTimeout(cloudPush, 10000);
  } finally {
    _syncPushing = false;
  }
}

async function cloudPull() {
  if (!syncKey()) return;
  if (syncDirty()) { cloudPush(); return; } // local changes win; push first
  try {
    const out = await syncRpc('dailyos_pull', { sync_key: syncKey() });
    if (!out) {
      // Nothing in the cloud yet for this key — seed it with local state.
      setSyncDirty(true);
      cloudPush();
      return;
    }
    if (out.updated_at && out.updated_at !== localStorage.getItem(SYNC_TS_LS)) {
      adoptState(out.data);
      localStorage.setItem(SYNC_TS_LS, out.updated_at);
    }
    syncSetStatus('ok', 'on · up to date');
  } catch (e) {
    syncSetStatus('err', 'offline · will retry');
  }
}

function adoptState(data) {
  _applyingRemote = true;
  try {
    S = migrateState(data);
    // Same post-load fixups as startup
    if (!S.daysOff) S.daysOff = [];
    if (!S.recurring) S.recurring = [];
    if (!S.order) S.order = {};
    if (!S.skips) S.skips = {};
    if (!S.carryDismissed) S.carryDismissed = {};
    if (!S.carryTicked) S.carryTicked = {};
    if (!S.deletedSeeds) S.deletedSeeds = {};
    if (!S.gymDays) S.gymDays = [1, 2, 4];
    syncGymDays();
    // Re-apply countdown seeds/pins so a remote state saved before they existed
    // (or from an older client) can't permanently clobber them.
    ensureCountdowns();
    ensureMufcFixtures();
    ensureRecoveredEvents();
    ensureAutumn26Events();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    render();
  } finally {
    _applyingRemote = false;
  }
}

// Flush pending changes when the tab is hidden/closed (sendBeacon survives unload)
function syncFlushBeacon() {
  if (!syncKey() || !syncDirty()) return;
  const body = JSON.stringify({ sync_key: syncKey(), payload: S });
  navigator.sendBeacon(
    SYNC_URL + '/rest/v1/rpc/dailyos_push?apikey=' + encodeURIComponent(SYNC_API_KEY),
    new Blob([body], { type: 'application/json' })
  );
  setSyncDirty(false);
}

function genSyncKey() {
  const b = new Uint8Array(32);
  crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
}

// Accept either a raw key or a full sync link (…#sync=KEY) pasted into the box.
function extractSyncKey(input) {
  if (!input) return '';
  input = input.trim();
  const m = input.match(/[#&?]sync=([0-9a-fA-F]{32,})/);
  return m ? m[1] : input;
}

function syncLink(key) {
  return location.origin + location.pathname + '#sync=' + key;
}

function copySyncLink() {
  const key = syncKey();
  if (!key) { showPa('No sync key on this device yet.'); return; }
  navigator.clipboard.writeText(syncLink(key))
    .then(() => showPa('Sync link copied — open it on your other device.'))
    .catch(() => showPa('Could not copy. Use Advanced → Copy key.'));
}

function generateAndShowSyncLink() {
  applySyncKey(genSyncKey());
  openSyncSetup();        // reopen so the Copy-sync-link button is ready
  copySyncLink();         // and put it on the clipboard straight away
}

function applySyncKey(input) {
  const key = extractSyncKey(input);
  if (!key || key.length < 32) { showPa('That doesn’t look like a sync link or key.'); return; }
  localStorage.setItem(SYNC_KEY_LS, key);
  localStorage.removeItem(SYNC_TS_LS);
  setSyncDirty(false);
  closeSyncSetup();
  showPa('Sync connected.');
  syncSetStatus('pending', 'connecting…');
  firstConnectSync();
}

// Auto-connect when the app is opened via a sync link (…#sync=KEY). Runs once at
// startup, before the normal sync init, then strips the key from the address bar.
function maybeAutoConnectFromHash() {
  const m = (location.hash || '').match(/sync=([0-9a-fA-F]{32,})/);
  if (!m) return false;
  const key = m[1];
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  if (key === syncKey()) return true; // already on this key
  localStorage.setItem(SYNC_KEY_LS, key);
  localStorage.removeItem(SYNC_TS_LS);
  setSyncDirty(false);
  syncSetStatus('pending', 'connecting…');
  firstConnectSync();
  return true;
}

// First connect: decide which side wins instead of blindly adopting the cloud.
// Cloud empty -> seed it with this device. Local trivial -> adopt cloud.
// Both have real data -> ask.
async function firstConnectSync() {
  try {
    const out = await syncRpc('dailyos_pull', { sync_key: syncKey() });
    if (!out) { setSyncDirty(true); cloudPush(); return; }
    const localHasData =
      Object.keys(S.done || {}).length > 0 ||
      (S.weekly || []).length > 0 ||
      Object.keys(S.custom || {}).length > 0;
    if (localHasData && !confirm(
      'This sync key already has data in the cloud.\n\n' +
      'OK = use the CLOUD data (replaces what is on this device)\n' +
      'Cancel = keep THIS device’s data (replaces the cloud)'
    )) {
      setSyncDirty(true);
      cloudPush();
      return;
    }
    adoptState(out.data);
    localStorage.setItem(SYNC_TS_LS, out.updated_at);
    syncSetStatus('ok', 'on · up to date');
  } catch (e) {
    syncSetStatus('err', 'offline · will retry');
  }
}

function disconnectSync() {
  localStorage.removeItem(SYNC_KEY_LS);
  localStorage.removeItem(SYNC_TS_LS);
  setSyncDirty(false);
  closeSyncSetup();
  syncSetStatus('off', 'off');
  showPa('Sync disconnected. Data stays on this device.');
}

// ── APP UPDATE DETECTION ──
// Surfaces a gentle "Update available" toast when a newer build is deployed
// while this session is open (e.g. a PWA left running for days). Zero-maintenance:
// polls the deployed page's ETag (fallback Last-Modified), which GitHub Pages
// changes on every deploy — so there's no build-version constant to bump. A
// cache-busted HEAD avoids the CDN's 10-min edge TTL and downloads no body. The
// network-first SW means tapping Refresh always loads the fresh code.
let _appVersionTag = null;     // baseline: the build this session is running (set once, then stable)
let _dismissedTag = null;      // a build the user dismissed — don't re-nag for this exact one
let _baselinePending = false;  // serializes concurrent baseline establishment
let _updateToastUp = false;
let _reloading = false;        // shared by every reload path so the page never reloads twice
let _lastUpdateCheck = 0;      // throttle, since visibilitychange can fire on every app-switch

// Single reload gate: the toast's Refresh and the SW controllerchange handler both
// route through this, so a deploy that changes BOTH the page and sw.js can't double-reload.
function reloadOnce() { if (_reloading) return; _reloading = true; location.reload(); }

async function fetchVersionTag() {
  try {
    const res = await fetch(location.pathname + '?_v=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    if (!res.ok || res.type !== 'basic') return null;  // ignore non-200 and cross-origin (captive-portal) responses
    return res.headers.get('etag') || res.headers.get('last-modified');
  } catch { return null; }
}

async function checkForAppUpdate() {
  if (_reloading || _updateToastUp) return;
  const now = Date.now();
  if (now - _lastUpdateCheck < 300000) return;         // at most one network check per 5 min
  _lastUpdateCheck = now;
  if (_appVersionTag === null) {                       // establish the running build's baseline once
    if (_baselinePending) return;
    _baselinePending = true;
    const t = await fetchVersionTag();
    _baselinePending = false;
    if (t) _appVersionTag = t;                         // leave null on failure so a later check retries
    return;
  }
  const tag = await fetchVersionTag();
  if (tag && tag !== _appVersionTag && tag !== _dismissedTag) showUpdateToast(tag);
}

function showUpdateToast(newTag) {
  if (_reloading || _updateToastUp) return;
  _updateToastUp = true;
  const t = document.createElement('div');
  t.className = 'update-toast';
  t.setAttribute('role', 'status');
  t.setAttribute('aria-live', 'polite');
  t.innerHTML = '<span class="ut-dot"></span>'
    + '<span class="ut-text">Update available</span>'
    + '<button class="ut-refresh">Refresh</button>'
    + '<button class="ut-dismiss" aria-label="Dismiss">×</button>';
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  t.querySelector('.ut-refresh').onclick = () => reloadOnce();
  t.querySelector('.ut-dismiss').onclick = () => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 200);
    // Remember this exact build as dismissed; keep the baseline as the running build so a
    // *further* deploy still prompts (even if it lands before the next check).
    _dismissedTag = newTag;
    _updateToastUp = false;
  };
}

// Sync triggers
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { cloudPull(); checkForAppUpdate(); }

window.addEventListener('pagehide', syncFlushBeacon);
window.addEventListener('online', () => { syncDirty() ? cloudPush() : cloudPull(); });
setInterval(() => {

if (maybeAutoConnectFromHash()) {

// Service worker for offline/PWA (only when served over https)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then((reg) => { reg.update(); }).catch(() => {});
  // When a new worker takes control (e.g. after a cache-version bump), reload once
  // so the fresh code/HTML lands without the user needing a manual hard-refresh.
  // Routed through reloadOnce() so it can't collide with a Refresh-button reload.
  navigator.serviceWorker.addEventListener('controllerchange', () => reloadOnce());
}

// Update detection (needs a server to poll, so http(s) only — not file://)
if (location.protocol.startsWith('http')) {
  checkForAppUpdate();                                              // capture baseline now
  setInterval(() => {
    if (document.visibilityState === 'visible') checkForAppUpdate();  // re-check while in use
  }, 900000);                                                       // every 15 min
}

updateBackupLabel();
// Check reminders every 30 seconds + re-render
setInterval(() => {
  const activeEl = document.activeElement;
  const mainEl = document.getElementById('main');
  if (!activeEl || !mainEl || !mainEl.contains(activeEl) || activeEl.tagName !== 'INPUT') {
    render();
  }
  checkReminders();
}, 30000);
// Initial reminder check
setTimeout(checkReminders, 2000);
// Live MUFC fixture refresh (throttled to once per 3 days inside the fn)
setTimeout(refreshMufcFixtures, 3000);
</script>
