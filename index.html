<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b1e28">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily OS">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1c24'/><rect x='4' y='8' width='24' height='20' rx='3' fill='none' stroke='%23d4a44a' stroke-width='2'/><line x1='4' y1='14' x2='28' y2='14' stroke='%23d4a44a' stroke-width='2'/><line x1='10' y1='5' x2='10' y2='11' stroke='%23d4a44a' stroke-width='2' stroke-linecap='round'/><line x1='22' y1='5' x2='22' y2='11' stroke='%23d4a44a' stroke-width='2' stroke-linecap='round'/><circle cx='16' cy='21' r='2.5' fill='%23d4a44a'/></svg>">
<title>Daily OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Palette tuned for sustained reading.
       - Background slightly elevated from pure black (avoids halation).
       - Text is off-white (warmer than #fff) — reduces eye strain at length.
       - Muted text bumped brighter so secondary info still scans easily.
       WCAG: --text on --bg ≈ 15:1 (AAA), --muted on --bg ≈ 7:1 (AAA). */
    --bg: #1b1e28;
    --s1: #252836;
    --s2: #2f3242;
    --s3: #3b3e50;
    --border: #444859;
    --border2: #555a72;
    --accent: #e2b257;
    --accent-bg: rgba(226,178,87,0.12);
    --accent-border: rgba(226,178,87,0.3);
    --text: #f5f5f7;
    --text2: #ecedf3;
    --muted: #ccd0e0;
    --faint: #8a8fa0;
    --done: #7cc59b;
    --done-bg: rgba(124,197,155,0.14);

    /* Category colors — muted, professional */
    --c-liquidbiz: #6ab891;
    --c-barkspa: #cc8a5e;
    --c-privatelabel: #6690c4;
    --c-life: #c4808e;
    --c-admin: #8a8da4;
    --c-break: #555a72;
    --c-evening: #8a8fb8;
    --c-parking: #9c8aa8;

    /* Two-accent semantic system (documented, per design-consistency lock):
       gold = work / action / focus;  teal = personal / calendar / life. */
    --accent2: #6ea8b8;
    --accent2-bg: rgba(110,168,184,0.10);
    --accent2-border: rgba(110,168,184,0.38);

    /* Radius scale — one documented system used everywhere:
       card = containers/blocks/modals; ctl = buttons/inputs; chip = tags/day-btns; xs = tiny caps/checks. */
    --r-card: 12px;
    --r-ctl: 8px;
    --r-chip: 6px;
    --r-xs: 4px;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;     /* no horizontal page scrollbar */
  }

  /* ── LAYOUT ──
     The whole app is one centered, contained unit (work surface + sidebar
     read as a cohort). Main fills its region edge-to-edge via padding rather
     than floating in a narrow centered ribbon — kills the dead side-voids on
     wide monitors. Outer whitespace on >1380px screens is balanced + intentional. */
  .app {
    display: flex;
    min-height: 100vh;
    max-width: 1280px;      /* contained, centered reading width — full-width made
                               the work column too wide/sparse on big monitors.
                               Balanced margins (not the old lopsided gap). */
    margin: 0 auto;
  }
  .main {
    flex: 1;
    min-width: 0;
    padding: 0 44px 80px;
    overflow-y: auto;
    height: 100vh;
  }
  .sidebar {
    width: 372px;
    min-width: 372px;
    background: var(--s1);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  .hdr {
    padding: 28px 0 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
  }
  .greeting {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .date-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .day-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .day-btn {
    padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    border: 1px solid transparent;
    border-radius: var(--r-chip);
    background: none;
    color: var(--muted);
    cursor: pointer;
    transition: all .12s;
  }
  .day-btn:hover { color: var(--text2); background: var(--s2); }
  .day-btn.active {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent-border);
    font-weight: 500;
  }
  .day-btn.has-tasks::after {
    content: '';
    display: block;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    margin: 2px auto 0;
  }

  /* ── FOCUS CARD ── */
  .focus-card {
    margin: 16px 0 14px;
    padding: 24px 26px;
    background: radial-gradient(120% 140% at 0% 0%, rgba(226,178,87,0.15), rgba(226,178,87,0.03) 55%);
    border: 1px solid var(--accent-border);
    border-left: 4px solid var(--accent);
    border-radius: var(--r-card);
    position: relative;
    overflow: hidden;
  }
  .focus-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212,164,74,0.03));
    pointer-events: none;
  }
  .focus-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .focus-pulse {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(212,164,74,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(212,164,74,0); }
  }
  .focus-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .focus-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }
  .focus-countdown {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .focus-countdown-bar {
    flex: 1;
    height: 3px;
    background: rgba(212,164,74,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .focus-countdown-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1s linear;
  }

  /* Pinned countdown hero */
  .cd-hero-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 16px 0 8px;
  }
  .cd-hero {
    flex: 1 1 210px;
    min-width: 0;
    padding: 11px 14px;
    background: linear-gradient(135deg, rgba(212,164,74,0.12), rgba(212,164,74,0.03));
    border: 1px solid var(--accent-border);
    border-radius: var(--r-card);
    position: relative;
    overflow: hidden;
  }
  .cd-hero-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .cd-hero-loc {
    color: var(--muted);
    letter-spacing: 1px;
  }
  .cd-hero-body {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .cd-hero-num {
    font-size: 30px;
    font-weight: 800;
    line-height: 0.9;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .cd-hero-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cd-hero-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
  }
  .cd-hero-bar {
    flex: 1;
    height: 4px;
    background: rgba(212,164,74,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .cd-hero-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 1s linear;
  }
  .cd-hero-date {
    color: var(--muted);
    white-space: nowrap;
  }
  .cd-hero-unpin {
    position: absolute;
    top: 10px;
    right: 12px;
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    opacity: 0.6;
    transition: opacity .12s, color .12s;
  }
  .cd-hero-unpin:hover { opacity: 1; color: var(--accent); }
  .ev-pin {
    cursor: pointer;
    opacity: 0.35;
    transition: opacity .12s, transform .12s;
    font-size: 11px;
    line-height: 1;
    margin-left: 2px;
  }
  .ev-pin:hover { opacity: 0.9; transform: scale(1.15); }
  .ev-pin.active { opacity: 1; }

  /* Today's Work — visually unified across AM/PM halves */
  .block.work-zone {
    border-color: rgba(106,184,145,0.32);
    background: linear-gradient(135deg, rgba(106,184,145,0.05), rgba(106,184,145,0.01));
  }
  .block.work-zone .bk-title { font-weight: 700; }
  .block.work-zone + .block:not(.work-zone) { margin-top: 14px; }
  .block:not(.work-zone) + .block.work-zone { margin-top: 14px; }
  .block.work-zone .bk-time { color: var(--c-liquidbiz); }

  /* ── CAPACITY BANNER (short-day awareness) ── */
  .capacity-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 12px 0 4px;
    padding: 8px 14px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    font-size: 12.5px;
    color: var(--text2);
  }
  .capacity-banner.short {
    background: rgba(226,178,87,0.08);
    border-color: rgba(226,178,87,0.28);
  }
  .capacity-banner.short .cap-dot {
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(226,178,87,0.4);
    animation: pulse 2.4s infinite;
  }
  .capacity-banner.full .cap-dot {
    background: var(--done);
  }
  .cap-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cap-text b { font-weight: 600; color: var(--text); }

  /* ── PARKING LOT ── */
  .parking-block {
    border-color: rgba(156,138,168,0.22);
    background: linear-gradient(135deg, rgba(156,138,168,0.05), rgba(156,138,168,0.01));
    margin-top: 16px;
    opacity: 0.92;
  }
  .parking-block .bk-hd { cursor: default; }
  .parking-block .bk-time {
    color: var(--c-parking);
    letter-spacing: 1.5px;
    font-weight: 500;
  }
  .parking-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--c-parking);
    background: rgba(156,138,168,0.15);
    border: 1px solid rgba(156,138,168,0.3);
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 8px;
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* ── EVENING MODE ── */
  .focus-card.focus-evening {
    background: linear-gradient(135deg, rgba(138,143,184,0.12), rgba(138,143,184,0.03));
    border-color: rgba(138,143,184,0.28);
    border-left-color: var(--c-evening);
  }
  .focus-card.focus-evening::before {
    background: linear-gradient(90deg, transparent, rgba(138,143,184,0.04));
  }
  .focus-card.focus-evening .focus-label { color: var(--c-evening); }
  .focus-card.focus-evening .focus-pulse {
    background: var(--c-evening);
    animation: pulseEvening 2.4s infinite;
  }
  @keyframes pulseEvening {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(138,143,184,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(138,143,184,0); }
  }

  .evening-block {
    border-color: rgba(138,143,184,0.22);
    background: linear-gradient(135deg, rgba(138,143,184,0.05), rgba(138,143,184,0.01));
  }
  .evening-block .bk-hd { cursor: default; }
  .evening-block .bk-time {
    color: var(--c-evening);
    letter-spacing: 1.5px;
    font-weight: 500;
  }

  .outstanding {
    margin: 12px 0 10px;
    padding: 12px 16px 4px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
  }
  .outstanding-hd {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 8px;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .outstanding-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.6px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .outstanding-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    padding: 1px 6px;
    background: var(--s3);
    border-radius: 3px;
  }
  .outstanding-sub {
    font-size: 11px;
    color: #888db0;
    margin-left: auto;
    font-style: italic;
  }
  .ot-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background .12s;
  }
  .ot-row:last-child { border-bottom: none; }
  .ot-row:hover { background: rgba(255,255,255,0.015); }
  .ot-text {
    flex: 1;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.4;
    cursor: pointer;
  }
  .ot-text.done { text-decoration: line-through; color: var(--muted); }
  .ot-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  .ot-cat {
    width: 3px;
    height: 18px;
    border-radius: 2px;
    flex-shrink: 0;
    opacity: 0.55;
  }

  /* ── PAST SUMMARY ── */
  .past-summary {
    margin-bottom: 10px;
    padding: 10px 14px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all .15s;
    opacity: 0.6;
  }
  .past-summary:hover { opacity: 0.85; background: var(--s2); }
  .past-summary-text {
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }
  .past-summary-text strong { color: var(--text2); font-weight: 500; }
  .past-summary-toggle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* ── MISSED TASKS ── */
  .missed-tasks {
    margin-bottom: 10px;
    padding: 10px 14px;
    background: rgba(196, 128, 142, 0.06);
    border: 1px solid rgba(196, 128, 142, 0.2);
    border-radius: var(--r-ctl);
  }
  .missed-hd {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--c-life);
    letter-spacing: 0.3px;
    opacity: 0.85;
  }
  .missed-tasks .task {
    padding: 5px 0;
    border-bottom: 1px solid rgba(196, 128, 142, 0.08);
  }
  .missed-tasks .task:last-child { border-bottom: none; }
  .missed-tasks .t-block-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    opacity: 0.6;
    margin-left: auto;
    white-space: nowrap;
  }

  /* ── PROGRESS ── */
  .prog {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 6px;
  }
  .prog-bar {
    flex: 1;
    height: 3px;
    background: var(--s3);
    border-radius: 2px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .prog-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 32px;
    text-align: right;
  }
  .prog-text strong { color: var(--accent); font-weight: 500; }

  /* Non-negotiables strip on main view */
  .nn-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 2px 0 18px;       /* tucked tight under the focus hero */
    padding: 0;
    background: transparent;
    border: none;
  }
  .nn-strip-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--faint, #8a8fa0);
    white-space: nowrap;
    margin: 0;
  }
  .nn-strip-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1;
  }
  .nn-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    background: var(--s2);
    border: 1px solid var(--border);
    border-radius: var(--r-chip);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .nn-chip:hover { border-color: var(--accent-border); background: var(--s3); }
  .nn-chip.done {
    background: var(--done-bg);
    border-color: rgba(124,197,155,0.3);
    color: var(--muted);
    text-decoration: line-through;
  }
  .nn-chip-ck {
    width: 15px;
    height: 15px;
    border: 1.5px solid var(--border2);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
    color: white;
  }
  .nn-chip.done .nn-chip-ck {
    background: var(--done);
    border-color: var(--done);
  }
  .prog-detail {
    display: flex;
    gap: 14px;
    margin-bottom: 10px;
  }
  .pd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .pd b { color: var(--text); font-weight: 600; }

  /* ── UPCOMING EVENTS BANNER ── */
  .event-banner {
    margin: 8px 0;
    padding: 10px 14px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: var(--r-ctl);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--accent);
  }
  .event-banner .eb-icon {
    width: 28px; height: 28px;
    background: rgba(212,164,74,0.15);
    border-radius: var(--r-chip);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .event-banner .eb-text { flex: 1; line-height: 1.4; }
  .event-banner .eb-text strong { font-weight: 600; }
  .event-banner .eb-days {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.7;
  }

  /* ── TIME BLOCKS ── */
  .blocks { margin-top: 8px; }

  .block {
    margin-bottom: 6px;
    border-radius: var(--r-card);
    border: 1px solid var(--border);
    background: transparent;            /* lightened: was filled --s1 (card-in-card weight) */
    overflow: hidden;
    transition: background .18s, border-color .18s, box-shadow .18s;
  }
  .block:hover { background: rgba(255,255,255,0.022); }
  .block.expanded { background: rgba(255,255,255,0.018); }
  /* The current block is the single elevated card — it carries the gold fill so
     it reads as the focus; everything else stays quiet structure. No outer glow
     (inner highlight instead) per the no-neon rule. */
  .block.is-now {
    border-color: var(--accent-border);
    background: linear-gradient(135deg, var(--accent-bg), rgba(226,178,87,0.02));
    box-shadow: inset 0 1px 0 rgba(226,178,87,0.18);
  }
  .block.is-past { opacity: 0.6; }
  .block.is-past:hover { opacity: 0.75; }
  .block.is-break {
    background: transparent;
    border: 1px dashed var(--border);
    opacity: 0.5;
    margin-bottom: 6px;
  }
  .block.is-break .bk-hd { padding: 8px 16px; }
  .block.is-break .bk-sub { display: none; }

  /* Task just added highlight */
  .block.just-added {
    animation: blockHighlight 1.5s ease;
  }
  @keyframes blockHighlight {
    0% { box-shadow: 0 0 0 2px var(--accent); }
    100% { box-shadow: none; }
  }

  .bk-hd {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .bk-cat {
    width: 5px;
    border-radius: 3px;
    align-self: stretch;
    flex-shrink: 0;
  }

  .bk-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 85px;
    flex-shrink: 0;
  }
  .block.is-now .bk-time { color: var(--accent); font-weight: 500; }

  .bk-info { flex: 1; min-width: 0; }
  .bk-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .now-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 2px 7px;
    background: var(--accent);
    color: #0c0d11;
    border-radius: 3px;
    font-weight: 600;
  }
  .bk-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.45;
  }
  .block:not(.expanded):not(.is-now) .bk-sub { display: none; }

  .bk-prog {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .bk-prog.all-done { color: var(--done); }

  .bk-cap {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--s3);
    flex-shrink: 0;
  }
  .bk-cap.over { color: #c45050; background: rgba(196,80,80,0.1); }

  .bk-chev {
    color: var(--muted);
    font-size: 10px;
    transition: transform .15s;
    flex-shrink: 0;
  }
  .bk-chev.open { transform: rotate(90deg); }

  /* Block body */
  .bk-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .2s ease;
  }
  .bk-body.open { max-height: 1000px; }
  .bk-inner {
    padding: 0 16px 14px;
    padding-left: 118px;
    border-top: 1px solid var(--border);
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .task:last-child { border-bottom: none; }
  .task.just-added-task {
    animation: taskGlow .8s ease;
  }
  @keyframes taskGlow {
    0% { background: rgba(212,164,74,0.15); }
    100% { background: transparent; }
  }

  .tck {
    width: 20px; height: 20px;
    border: 1.5px solid var(--border2);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    position: relative;
    transition: all .12s;
  }
  .tck:hover { border-color: var(--accent); }
  .tck.done { background: var(--done); border-color: var(--done); }
  .tck.done::after {
    content: '';
    position: absolute;
    top: 3px; left: 6px;
    width: 5px; height: 9px;
    border: 1.5px solid #fff;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  /* -- COMPLETION ANIMATIONS -- */
  @keyframes checkPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .tck.just-done {
    animation: checkPop 0.25s ease;
  }

  @keyframes taskFlash {
    0% { background: rgba(90,158,124,0.2); }
    100% { background: transparent; }
  }
  .task.just-completed {
    animation: taskFlash 0.6s ease;
  }

  @keyframes blockComplete {
    0% { border-color: var(--done); box-shadow: 0 0 20px rgba(90,158,124,0.2); }
    100% { border-color: var(--border); box-shadow: none; }
  }
  .block.block-complete {
    animation: blockComplete 1.2s ease;
  }

  @keyframes chipPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .nn-chip.just-done {
    animation: chipPop 0.3s ease;
  }

  .t-content { flex: 1; min-width: 0; }
  .t-text { font-size: 14px; color: var(--text); line-height: 1.45; }
  .t-text.done { text-decoration: line-through; color: var(--muted); opacity: 0.7; }
  .t-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #9398b5;
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .t-meta.nn { color: var(--accent); opacity: 0.6; }
  .t-bullets {
    margin-top: 3px;
    padding-left: 2px;
  }
  .t-bullet {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    padding: 1px 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .t-bullet::before {
    content: '•';
    color: var(--border2);
    flex-shrink: 0;
    font-size: 10px;
  }
  .t-move {
    color: #3a3d50;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    transition: color .12s;
    padding: 0 3px;
  }
  .t-move:hover { color: var(--accent); }
  .t-rm {
    color: #3a3d50;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
    transition: color .12s;
    padding: 0 2px;
  }
  .t-rm:hover { color: #c45050; }

  /* -- SIMPLE DAY CARD -- */
  .sd-card {
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 8px;
    margin-bottom: 14px;
  }
  .sd-card.drag-over { border-color: var(--accent); }
  .sd-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .sd-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--accent); text-transform: uppercase;
  }
  .sd-card.sd-park .sd-title { color: #b8905a; }
  .sd-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .sd-progress { height: 3px; background: var(--s3); border-radius: 2px; overflow: hidden; margin: 6px 0 10px; }
  .sd-progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  /* events strip — the day's fixed points, not tickable */
  .sd-ev {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px;
    border-left: 2px solid var(--accent); background: rgba(212,164,74,0.06);
    border-radius: 0 6px 6px 0; margin-bottom: 6px; cursor: pointer;
  }
  .sd-ev:hover { background: rgba(212,164,74,0.12); }
  .sd-ev.mufc { border-left-color: #DA291C; background: rgba(218,41,28,0.07); }
  .sd-ev.mufc:hover { background: rgba(218,41,28,0.13); }
  .sd-ev.holiday { border-left-color: #6ea8b8; background: rgba(110,168,184,0.07); }
  .sd-ev.holiday:hover { background: rgba(110,168,184,0.13); }
  .sd-ev-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); min-width: 42px; flex-shrink: 0; }
  .sd-ev.mufc .sd-ev-time { color: #DA291C; }
  .sd-ev.holiday .sd-ev-time { color: #6ea8b8; }
  .sd-ev-name { font-size: 13px; color: var(--text2); flex: 1; min-width: 0; }
  .sd-ev-badge { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 1px; color: #8a90a8; flex-shrink: 0; }
  .sd-ev.mufc .sd-ev-badge { color: #DA291C; }
  /* task row extras */
  .sd-grip {
    color: #565b72; font-size: 13px; letter-spacing: -2px; cursor: grab;
    opacity: 0; transition: opacity .15s; flex-shrink: 0; margin-top: 2px;
  }
  .task:hover .sd-grip { opacity: 1; }
  .sd-cat { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
  .sd-carry {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.5px;
    color: var(--accent); border: 1px solid rgba(212,164,74,0.4); border-radius: 6px;
    padding: 1px 6px; flex-shrink: 0; margin-top: 3px;
  }
  .task .t-move, .task .t-rm { opacity: 0; transition: opacity .15s, color .12s; }
  .task:hover .t-move, .task:hover .t-rm { opacity: 1; }
  @media (hover: none) {
    .sd-grip, .task .t-move, .task .t-rm { opacity: 0.6; }
    .sd-grip { font-size: 15px; }
    .task .t-move, .task .t-rm {
      font-size: 16px;
      min-width: 28px;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  }
  .task.drop-above { box-shadow: 0 -2px 0 var(--accent); }
  .sd-nudge {
    display: flex; gap: 8px; align-items: center;
    background: var(--s1); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: var(--muted); margin-bottom: 14px;
  }
  .sd-menu {
    position: fixed; background: var(--s2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; z-index: 999; min-width: 150px;
  }
  .sd-menu-item { font-size: 12px; color: var(--text2); padding: 7px 10px; border-radius: 5px; cursor: pointer; }
  .sd-menu-item:hover { background: var(--s3); }

  /* Inline event in day flow */
  .inline-event {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    margin: 6px 0;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: var(--r-card);
    cursor: pointer;
    transition: all .15s;
    position: relative;
  }
  .inline-event:hover { background: rgba(212,164,74,0.12); }
  .inline-event.is-past { opacity: 0.5; }
  .ie-bar {
    width: 3px;
    height: 28px;
    background: var(--accent);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .ie-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 40px;
    flex-shrink: 0;
  }
  .ie-info { flex: 1; min-width: 0; }
  .ie-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .ie-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .ie-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.5px;
    color: var(--accent);
    opacity: 0.6;
    flex-shrink: 0;
  }
  /* Holiday / notable date variant — calm teal to set it apart from work gold */
  .inline-event.is-holiday {
    background: rgba(110,168,184,0.08);
    border-color: rgba(110,168,184,0.35);
  }
  .inline-event.is-holiday:hover { background: rgba(110,168,184,0.14); }
  .inline-event.is-holiday .ie-bar { background: #6ea8b8; }
  .inline-event.is-holiday .ie-badge { color: #6ea8b8; }
  /* Man Utd fixture variant — United red */
  .inline-event.is-mufc {
    background: rgba(218,41,28,0.08);
    border-color: rgba(218,41,28,0.35);
  }
  .inline-event.is-mufc:hover { background: rgba(218,41,28,0.14); }
  .inline-event.is-mufc .ie-bar { background: #DA291C; }
  .inline-event.is-mufc .ie-badge { color: #DA291C; opacity: 0.9; }
  .ie-time.ie-allday {
    font-size: 8px;
    letter-spacing: 1px;
    opacity: 0.55;
  }

  /* Drag and drop */
  .task[draggable="true"], .ot-row[draggable="true"] { cursor: grab; }
  .task[draggable="true"]:active, .ot-row[draggable="true"]:active { cursor: grabbing; }
  .task.dragging, .ot-row.dragging { opacity: 0.3; }
  .bk-body.drag-over, .bk-hd.drag-over {
    background: var(--accent-bg) !important;
    outline: 2px dashed var(--accent-border);
    outline-offset: -2px;
    border-radius: var(--r-ctl);
  }

  /* Gym gear icon */
  .gym-gear {
    font-size: 12px;
    color: var(--muted);
    margin-left: 6px;
    cursor: pointer;
    opacity: 0.4;
    transition: all .15s;
    vertical-align: middle;
  }
  .gym-gear:hover { opacity: 1; color: var(--accent); }

  /* Gym day picker */
  .gym-picker {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .gym-picker-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }
  .gym-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 7px;
    border-radius: 4px;
    color: var(--muted);
    background: var(--s3);
    cursor: pointer;
    transition: all .12s;
    user-select: none;
  }
  .gym-day:hover { color: var(--text2); background: var(--s2); }
  .gym-day.active {
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
  }

  /* Block inline add */
  .bk-add {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    margin-top: 4px;
    cursor: text;
    opacity: 0.4;
    transition: opacity .15s;
  }
  .bk-add:hover, .bk-add.focused { opacity: 1; }
  .bk-add-plus {
    font-size: 13px;
    color: var(--muted);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .bk-add.focused .bk-add-plus { color: var(--accent); }
  .bk-add-inp {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid transparent;
    outline: none;
    color: var(--text);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    padding: 2px 0;
  }
  .bk-add.focused .bk-add-inp { border-bottom-color: var(--border); }
  .bk-add-inp::placeholder { color: #3a3d50; }

  /* Quick inline add */
  .quick-add {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-top: 10px;
    background: var(--s1);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    cursor: text;
    transition: all .15s;
  }
  .quick-add:hover, .quick-add.focused {
    border-color: var(--accent-border);
    background: var(--s2);
  }
  .quick-add-icon {
    font-size: 18px;
    color: var(--border2);
    font-weight: 300;
    flex-shrink: 0;
    width: 18px;
    text-align: center;
    line-height: 1;
    transition: color .15s;
  }
  .quick-add:hover .quick-add-icon,
  .quick-add.focused .quick-add-icon { color: var(--accent); }
  .quick-add-inp {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    line-height: 1.4;
  }
  .quick-add-inp::placeholder { color: #50546e; }

  .t-divider {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #888db0;
    text-transform: uppercase;
    padding: 8px 0 3px;
    margin-top: 2px;
    border-top: 1px dashed rgba(255,255,255,0.08);
  }

  /* ── SIDEBAR ── */
  .sb-top {
    padding: 16px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sb-stats-strip {
    display: flex;
    gap: 12px;
    align-items: center;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sb-stats-strip::-webkit-scrollbar { display: none; }
  .sb-stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.3px;
    white-space: nowrap;
    flex: none;
  }
  .sb-sync-pill { flex: none; }
  .sb-stat-pill .sv { color: var(--text2); font-weight: 600; }
  .sb-stat-pill .sv.accent { color: var(--accent); }

  /* Always-visible sync status pill (click to open setup) */
  .sb-sync-pill {
    display: flex; align-items: center; gap: 5px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.3px;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: border-color .12s, color .12s;
    white-space: nowrap;
  }
  .sb-sync-pill:hover { border-color: var(--accent-border); color: var(--text2); }
  .sync-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border2); flex: none;
  }
  .sync-dot.sync-ok { background: #6fbf73; }
  .sync-dot.sync-pending { background: var(--accent); }
  .sync-dot.sync-err { background: #e06c75; }
  .sync-dot.sync-off { background: var(--border2); }

  .sb-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: none;
  }
  /* Cloud sync status dot (sits on the data ⋮ button) */
  #syncDot {
    position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%;
    pointer-events: none;
    background: var(--border2);
  }
  #syncDot.sync-ok { background: #6fbf73; }
  #syncDot.sync-pending { background: var(--accent); }
  #syncDot.sync-err { background: #e06c75; }
  #syncDot.sync-off { background: var(--border2); }

  .sb-icon-btn {
    position: relative;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: var(--r-chip);
    transition: all .15s;
    position: relative;
  }
  .sb-icon-btn:hover { background: var(--s2); color: var(--text2); }
  .sb-icon-btn.active { background: var(--s3); color: var(--accent); }

  /* Search overlay inside sidebar */
  .sb-search-wrap {
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height .2s ease, padding .2s ease;
  }
  .sb-search-wrap.open {
    max-height: 60px;
    padding: 8px 16px;
    overflow: visible;
  }

  /* Data dropdown */
  .sb-data-menu {
    position: absolute;
    top: 34px;
    right: 0;
    background: var(--s2);
    border: 1px solid var(--border2);
    border-radius: var(--r-ctl);
    padding: 4px;
    min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 60;
    display: none;
  }
  .sb-data-menu.show { display: block; }
  .sb-data-item {
    display: block;
    width: 100%;
    padding: 7px 10px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    color: var(--text2);
    background: none;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    transition: background .12s;
  }
  .sb-data-item:hover { background: var(--s3); }
  .sb-data-item.danger { color: #c45050; }
  .sb-data-item.danger:hover { background: rgba(196,80,80,0.1); }

  .sb-sec {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sb-h {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sb-h-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sb-h-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sb-badge {
    background: var(--s3);
    padding: 1px 7px;
    border-radius: var(--r-ctl);
    font-size: 10px;
    color: var(--text2);
  }
  .sb-chev {
    font-size: 8px;
    color: var(--muted);
    transition: transform .2s ease;
    display: inline-block;
  }
  .sb-chev.open { transform: rotate(180deg); }
  .sb-h.clickable { cursor: pointer; user-select: none; }
  .sb-h.clickable:hover { color: var(--text2); }

  /* Quick Add (PA) */
  .qa-form { display: flex; flex-direction: column; gap: 6px; }
  .qa-inp {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-chip);
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .12s;
  }
  .qa-inp:focus { border-color: var(--accent); }
  .qa-inp::placeholder { color: #50546e; }
  .qa-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #888db0;
    letter-spacing: 0.2px;
    line-height: 1.4;
    padding: 2px 0;
  }
  .qa-row { display: flex; gap: 5px; }
  .qa-sel, .qa-num {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-chip);
    padding: 7px 8px;
    font-size: 11px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    outline: none;
  }
  .qa-sel { flex: 1; }
  .qa-num { width: 52px; }
  .qa-btn {
    background: var(--accent);
    color: #0c0d11;
    border: none;
    border-radius: var(--r-chip);
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: opacity .12s;
    white-space: nowrap;
  }
  .qa-btn:hover { opacity: 0.85; }
  .pa-msg {
    margin-top: 4px;
    padding: 8px 12px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: var(--r-chip);
    font-size: 11px;
    color: var(--accent);
    display: none;
    animation: fadeUp .2s;
    line-height: 1.4;
  }
  .pa-msg.show { display: block; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:translateY(0); } }

  /* App-update toast — gentle "update available" prompt for long-lived PWA sessions.
     z-index sits below the 1000 modal tier so an open modal always paints over it. */
  .update-toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    z-index: 900;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px 9px 14px;
    background: var(--s2);
    border: 1px solid var(--accent-border);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    font-size: 12px; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .update-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .update-toast .ut-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); flex-shrink: 0; }
  .update-toast .ut-text { white-space: nowrap; }
  .update-toast .ut-refresh { font-family: inherit; font-size: 11px; font-weight: 600; color: var(--bg); background: var(--accent); border: none; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
  .update-toast .ut-refresh:hover { filter: brightness(1.08); }
  .update-toast .ut-refresh:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .update-toast .ut-dismiss { font-family: inherit; font-size: 16px; line-height: 1; color: var(--muted); background: none; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 26px; min-height: 26px; padding: 0; }
  .update-toast .ut-dismiss:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .update-toast .ut-dismiss:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }

  /* Add Event form */
  .ae-form { display: flex; flex-direction: column; gap: 6px; }
  .ae-row { display: flex; gap: 5px; }
  .ae-inp {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-chip);
    padding: 7px 10px;
    font-size: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .ae-inp:focus { border-color: var(--accent); }
  .ae-inp::placeholder { color: #50546e; }
  .ae-date {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-chip);
    padding: 7px 8px;
    font-size: 11px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    color-scheme: dark;
  }
  .ae-btn {
    background: var(--s3);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: var(--r-chip);
    padding: 7px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all .12s;
    white-space: nowrap;
  }
  .ae-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }

  /* Non-negotiable rows */
  .nn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nn:last-child { border-bottom: none; }
  .nn-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0.6;
  }
  .nn-dot.done { background: var(--done); opacity: 1; }
  .nn-txt { font-size: 11px; color: var(--text2); flex: 1; }
  .nn-txt.done { text-decoration: line-through; color: var(--muted); }
  .nn-biz {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* Weekly task rows */
  .wt {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
  }
  .wt:last-child { border-bottom: none; }
  .wt-ck {
    width: 12px; height: 12px;
    border: 1.5px solid var(--border2);
    border-radius: 3px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: all .12s;
  }
  .wt-ck:hover { border-color: var(--accent); }
  .wt-ck.done { background: var(--done); border-color: var(--done); }
  .wt-ck.done::after {
    content: '';
    position: absolute;
    top: 1px; left: 2px;
    width: 4px; height: 6px;
    border: 1.5px solid #fff;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .wt-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .wt-txt { flex: 1; color: var(--text2); }
  .wt-txt.done { text-decoration: line-through; color: var(--muted); }
  .wt-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 5px;
    background: var(--s3);
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all .12s;
  }
  .wt-day:hover { color: var(--accent); background: var(--accent-bg); }
  .wt-rm {
    color: #3a3d50;
    cursor: pointer;
    font-size: 11px;
    transition: color .12s;
  }
  .wt-rm:hover { color: #c45050; }

  /* Events list */
  .ev-group {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--faint, #8a8fa0);
    margin: 12px 0 4px;
    padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .ev-group:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .ev-now {
    border-left: 2px solid var(--accent);
    padding-left: 8px;
    margin-bottom: 2px;
  }
  .ev-now .ev-group { color: var(--accent); }
  .ev-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
  }
  .ev-item:last-child { border-bottom: none; }
  .ev-group + .ev-item { border-bottom: 1px solid rgba(255,255,255,0.06); }
  .ev-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 48px;
    flex-shrink: 0;
  }
  .ev-txt { flex: 1; color: var(--text2); }
  .ev-days {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding: 2px 5px;
    background: var(--s3);
    border-radius: 3px;
  }
  .ev-days.soon { color: var(--accent); background: var(--accent-bg); }
  .ev-days.today { color: var(--done); background: var(--done-bg); font-weight: 500; }
  .ev-rm {
    color: #3a3d50;
    cursor: pointer;
    font-size: 11px;
    transition: color .12s;
  }
  .ev-rm:hover { color: #c45050; }

  /* PA nudge — integrated into bottom */
  .pa-strip {
    padding: 10px 16px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    margin-top: 4px;        /* was margin-top:auto, which shoved this to the
                               bottom of the sidebar and created the empty gap
                               + scrollbar. Let it flow under the content. */
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .pa-strip .pa-icon {
    width: 18px; height: 18px;
    background: var(--accent-bg);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pa-strip strong { color: var(--accent); font-weight: 500; }

  /* Category BG colors */
  .cat-bg-liquidbiz { background: var(--c-liquidbiz); }
  .cat-bg-barkspa { background: var(--c-barkspa); }
  .cat-bg-privatelabel { background: var(--c-privatelabel); }
  .cat-bg-life { background: var(--c-life); }
  .cat-bg-admin { background: var(--c-admin); }
  .cat-bg-break { background: var(--c-break); }
  .cat-bg-evening { background: var(--c-evening); }
  .cat-bg-parking { background: var(--c-parking); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3d50; border-radius: 2px; }

  /* ── SEARCH RESULTS ── */
  #searchResults {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    z-index: 50;
    background: var(--s1);
    border: 1px solid var(--border2);
    border-radius: var(--r-ctl);
    margin-top: 4px;
    max-height: 280px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .sr-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    transition: background .1s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: var(--s2); }
  .sr-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .sr-text { flex: 1; font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-text em { font-style: normal; color: var(--accent); font-weight: 600; }
  .sr-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
    text-align: right;
    letter-spacing: 0.3px;
  }
  .sr-empty {
    padding: 14px 12px;
    font-size: 11px;
    color: #888db0;
    text-align: center;
  }

  /* ── CALENDAR DROPDOWN ── */
  .cal {
    position: absolute;
    top: 28px;
    left: 0;
    z-index: 100;
    background: var(--s1);
    border: 1px solid var(--border2);
    border-radius: var(--r-card);
    padding: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: 280px;
    animation: calIn .15s ease;
  }
  @keyframes calIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .cal-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .cal-nav {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    padding: 3px 8px;
    font-size: 12px;
    transition: all .12s;
  }
  .cal-nav:hover { color: var(--accent); border-color: var(--accent-border); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
  }
  .cal-dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: #888db0;
    letter-spacing: 0.5px;
    padding: 4px 0;
  }
  .cal-day {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding: 6px 0;
    border-radius: var(--r-chip);
    cursor: pointer;
    transition: all .1s;
    border: 1px solid transparent;
  }
  .cal-day:hover { background: var(--s3); color: var(--text); }
  .cal-day.other { color: #3a3d50; }
  .cal-day.today { color: var(--accent); border-color: var(--accent-border); }
  .cal-day.selected { background: var(--accent); color: #0c0d11; font-weight: 600; }
  .cal-day.has-ev::after {
    content: '';
    display: block;
    width: 3px; height: 3px;
    background: var(--accent);
    border-radius: 50%;
    margin: 1px auto 0;
  }
  .cal-day.selected.has-ev::after { background: #0c0d11; }

  /* Tactile feedback — a small physical "push" on press (skill 4.5).
     Respect reduced-motion: skip the transform for users who opt out. */
  @media (prefers-reduced-motion: no-preference) {
    .tck:active { transform: scale(0.86); }
    .qa-btn:active, .add-btn:active, .day-btn:active,
    .sb-icon-btn:active, .nn-chip:active, .cal-day:active { transform: scale(0.95); }
    .block .bk-hd:active { transform: scale(0.996); }
  }

  @media (max-width: 1200px) { .sidebar { width: 320px; min-width: 320px; } .main { padding: 0 32px 80px; } }
  @media (max-width: 900px) {
    .app { flex-direction: column; max-width: 100%; }
    .sidebar {
      width: 100%; min-width: auto; height: auto;
      border-left: none; border-top: 1px solid var(--border);
      /* Safe areas: env() is 0 outside standalone iOS, so this is a no-op elsewhere */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);   /* home-indicator clearance */
    }
    .main {
      height: auto; max-width: 100%;
      padding: env(safe-area-inset-top) calc(20px + env(safe-area-inset-right)) 64px calc(20px + env(safe-area-inset-left));
    }

    /* Header compaction */
    .hdr { padding: 16px 0 0; }
    .greeting { font-size: 24px; }

    /* Day-nav: one scrollable line, no wrapping */
    .day-nav {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .day-nav::-webkit-scrollbar { display: none; }
    .day-btn { flex: 0 0 auto; min-height: 36px; min-width: 36px; padding: 7px 12px; }

    /* Compact countdown strip: one slim row per pin (desktop keeps big cards) */
    .cd-hero-row { flex-direction: column; gap: 8px; margin: 12px 0 8px; }
    .cd-hero {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
    }
    .cd-hero-label {
      display: block;
      order: 1;
      flex: 1 1 auto;
      min-width: 0;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cd-hero-body { order: 2; flex: 0 0 auto; gap: 5px; }
    .cd-hero-num { font-size: 16px; line-height: 1; }
    .cd-hero-unit { font-size: 9px; letter-spacing: 1px; }
    .cd-hero-foot { order: 3; flex: 0 0 auto; margin-top: 0; margin-left: auto; }
    .cd-hero-bar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      flex: none;
      border-radius: 0;
    }
    .cd-hero-unpin {
      position: static;
      order: 4;
      flex: 0 0 auto;
      font-size: 18px;
      min-width: 28px;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -6px -8px -6px -4px;
    }

    /* Non-negotiables: label line above full-width tappable chips */
    .nn-strip { flex-direction: column; align-items: stretch; gap: 8px; }
    .nn-strip-label { width: 100%; }
    .nn-strip-items { flex-wrap: wrap; width: 100%; flex: none; }
    .nn-chip { min-height: 40px; padding: 8px 14px; }

    /* Sidebar section order — CSS-only reorder, no DOM moves.
       Sidebar children (DOM order): .sb-top(1) .sb-search-wrap(2)
       .sb-sec QuickAdd(3) .sb-sec Events(4) .sb-sec ThisWeek(5) .pa-strip(6) */
    .sidebar > .sb-top { order: 0; }               /* stats strip stays first */
    .sidebar > .sb-sec:nth-child(4) { order: 1; }  /* Events */
    .sidebar > .sb-sec:nth-child(3) { order: 2; }  /* Quick Add */
    .sidebar > .sb-search-wrap { order: 3; }       /* Search */
    .sidebar > .sb-sec:nth-child(5) { order: 4; }  /* This Week */
    .sidebar > .pa-strip { order: 5; }             /* PA strip stays last */

    /* Tap targets */
    .tck { width: 26px; height: 26px; border-radius: 5px; }
    .tck.done::after { top: 5px; left: 9px; width: 6px; height: 11px; }
  }
  @media (max-width: 480px) {
    .main {
      padding-left: calc(14px + env(safe-area-inset-left));
      padding-right: calc(14px + env(safe-area-inset-right));
    }
    .cd-hero-loc { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="main" id="main"></div>
  <div class="sidebar">

    <!-- Top bar: stats + icon actions -->
    <div class="sb-top">
      <div class="sb-stats-strip">
        <div class="sb-stat-pill"><span class="sv accent" id="sStreak">0</span> streak</div>
        <div class="sb-stat-pill"><span class="sv" id="sTasks">0</span> done</div>
        <div class="sb-stat-pill" id="sNnPill"><span class="sv" id="sNn">0/5</span> non-negs</div>
        <div class="sb-sync-pill" id="syncPill" onclick="openSyncSetup()" title="Cloud sync — click to set up or add a device">
          <span class="sync-dot" id="syncPillDot"></span><span id="syncPillText">sync off</span>
        </div>
      </div>
      <div class="sb-actions">
        <button class="sb-icon-btn" onclick="toggleSbSearch()" id="sbSearchBtn" title="Search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
        </button>
        <div class="sb-icon-btn" onclick="toggleDataMenu(this)" title="Data" style="cursor:pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          <span id="syncDot" title="Sync status"></span>
          <div class="sb-data-menu" id="dataMenu" style="display:none;">
            <div class="sb-data-item" id="syncMenuItem" onclick="event.stopPropagation();openSyncSetup()">Sync: off</div>
            <div class="sb-data-item" onclick="event.stopPropagation();exportData()">Export Backup</div>
            <div class="sb-data-item" onclick="event.stopPropagation();document.getElementById('importFile').click()">Import</div>
            <div class="sb-data-item danger" onclick="event.stopPropagation();resetData()">Reset All Data</div>
          </div>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)">
      </div>
    </div>

    <!-- Search (collapsible) -->
    <div class="sb-search-wrap" id="sbSearchWrap">
      <div style="position:relative;">
        <input class="qa-inp" type="text" id="searchInp" placeholder="Search tasks & events..."
          oninput="searchTasks(this.value)" onfocus="searchTasks(this.value)" style="padding-left:30px;font-size:12px;">
        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5e6280" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
        <div id="searchResults" style="display:none;"></div>
      </div>
    </div>

    <!-- PA Quick Add -->
    <div class="sb-sec" style="background:var(--bg);border-top:1px solid var(--border);">
      <div class="sb-h" style="margin-bottom:8px;">

<script>
// ══════════════════════════════════════════════════

// ── YOUR DAILY STRUCTURE ──
// Simple Day: no time blocks. Each day is a single flat tick-list
// (S.custom[day].list) plus the optional Parking Lot. The old template's
// daily work tasks live on as plain weekday recurring tasks (see
// workSeedTasks / the v4 migration).
function workSeedTasks() {

}

// Daily non-negotiables — small quick ticks, render as chips above Today's Work.

// ── CATEGORY LOGIC ──
const CAT_KW = {

  privatelabel: ['private label','bundle','bundles','amazon','fba','asin','helium','sellerboard','smartscout','product research','supplier','alibaba','factory','sd','arbi','keepa'],
  life: ['mum','mom','dad','call','phone','doctor','dentist','gym','haircut','shopping','house','lawn','car','flowers','gift','birthday','mothers','father','amex','bank','insurance','food','cook','clean','collect','pick up','appointment','vet','school','daisy'],

};

const CAT_LABEL = {
  liquidbiz:'Today\'s Work', privatelabel:'Parking Lot',

};

// ── STATE ──
const DATA_VERSION = 4;
const STORAGE_KEY = 'dailyOS';

// Map old (pre-v3) block ids to the new mainwork_am / mainwork_pm halves.
// PM-half ids (after 13:30) go into mainwork_pm; the rest into mainwork_am.
const LEGACY_BLOCK_MAP = {
  'morning-scan': 'mainwork_am',
  'liquidbiz':    'mainwork_am',
  'flex':         'mainwork_pm',
  'eod':          'mainwork_pm',
  'barkspa':      'parking',
  'privatelabel': 'parking',
};

function nextDateOfWeekday(dow) {
  // Returns YYYY-MM-DD for the next occurrence of dow (0=Sun..6=Sat), today inclusive.
  const d = new Date();
  const delta = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + delta);
  return toDateStr(d);
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('dos4');
    let s = JSON.parse(raw || 'null') || def();
    s = migrateState(s);
    return s;
  } catch { return def(); }
}

function def() {
  return { _v: DATA_VERSION, done:{}, weekly:[], custom:{}, events:[], streak:[], daysOff:[], recurring: workSeedTasks(), order:{}, skips:{}, carryDismissed:{} };
}

function migrateState(s) {
  if (!s._v) { s._v = 1; }
  if (s._v < 2) {
    s.done = s.done || {};
    s.weekly = s.weekly || [];
    s.custom = s.custom || {};
    s.events = s.events || [];
    s.streak = s.streak || [];
    s.daysOff = s.daysOff || [];
    s.recurring = s.recurring || [];
    s._v = 2;
  }
  if (s._v < 3) {
    // v3: template simplification. Rehome custom tasks that lived in defunct blocks.
    s.custom = s.custom || {};
    for (const day of Object.keys(s.custom)) {
      const dayMap = s.custom[day];
      if (!dayMap || typeof dayMap !== 'object') continue;
      for (const oldId of Object.keys(LEGACY_BLOCK_MAP)) {
        if (!dayMap[oldId] || !dayMap[oldId].length) continue;
        const newId = LEGACY_BLOCK_MAP[oldId];
        if (!dayMap[newId]) dayMap[newId] = [];
        dayMap[newId].push(...dayMap[oldId]);
        delete dayMap[oldId];
      }
    }
    // Rehome user-recurring tasks whose `block` no longer exists
    if (Array.isArray(s.recurring)) {
      for (const r of s.recurring) {
        if (r && LEGACY_BLOCK_MAP[r.block]) r.block = LEGACY_BLOCK_MAP[r.block];
      }
    }
    s._v = 3;
  }
  if (s._v < 4) {
    // v4: Simple Day. Fold every day's block-keyed custom arrays into one flat
    // list (block-time order), convert taskMoves overrides into per-day skips,
    // drop recurring `block` fields, and re-home the old TEMPLATE's daily work
    // tasks as plain weekday recurring tasks. Idempotent: gated on _v, so it
    // runs once per payload on BOTH the startup and adoptState (sync) paths.
    s.custom = s.custom || {};
    s.order = s.order || {};
    s.skips = s.skips || {};
    s.carryDismissed = s.carryDismissed || {};
    const FOLD_ORDER = ['mainwork_am', 'gym', 'lunch', 'mainwork_pm', 'flex', 'evening', 'weekend'];
    for (const day of Object.keys(s.custom)) {
      const dayMap = s.custom[day];
      if (!dayMap || typeof dayMap !== 'object' || Array.isArray(dayMap)) continue;
      const list = Array.isArray(dayMap.list) ? dayMap.list : [];
      const rest = Object.keys(dayMap).filter(k => k !== 'list' && k !== 'parking' && !FOLD_ORDER.includes(k));
      for (const bid of [...FOLD_ORDER, ...rest]) {
        if (Array.isArray(dayMap[bid])) list.push(...dayMap[bid]);
      }
      const next = { list };
      if (Array.isArray(dayMap.parking)) next.parking = dayMap.parking;
      s.custom[day] = next;
    }
    // taskMoves → skips. Every override (block id or '__moved__' sentinel)
    // meant "hide the template/recurring original for this day" — the visible
    // copy already lives in the custom arrays folded above.
    for (const [day, moves] of Object.entries(s.taskMoves || {})) {
      if (!moves || typeof moves !== 'object') continue;
      for (const tid of Object.keys(moves)) {
        if (!s.skips[day]) s.skips[day] = {};
        s.skips[day][tid] = true;
      }
    }
    delete s.taskMoves;
    // Recurrence is dayOfWeek only now.
    if (Array.isArray(s.recurring)) {
      for (const r of s.recurring) { if (r) delete r.block; }
    } else {
      s.recurring = [];
    }
    // Old TEMPLATE work tasks → weekday recurring seeds.
    for (const seed of workSeedTasks()) {
      if (!s.recurring.some(r => r && r.id === seed.id)) s.recurring.push(seed);
    }
    // Carry done-state over from the old template task ids so history (and
    // anything ticked today on an old client) still reads as done.
    for (const [day, dmap] of Object.entries(s.done || {})) {
      if (!dmap) continue;
      const dow = new Date(day + 'T00:00:00').getDay();
      if (dow < 1 || dow > 5) continue;
      if (dmap['nn_parcels']) dmap['rec_work_parcels_' + dow] = true;
      if (dmap['nn_list']) dmap['rec_work_list_' + dow] = true;
    }
    s._v = 4;
  }
  return s;
}

let S = load();
if (!S.daysOff) S.daysOff = [];
if (!S.recurring) S.recurring = [];
if (!S.order) S.order = {};
if (!S.skips) S.skips = {};
if (!S.carryDismissed) S.carryDismissed = {};

if (!S.deletedSeeds) S.deletedSeeds = {}; // { eventText: true } — seeded events the user deleted; seeders must not re-add

// recurring: [{ id, text, cat, dur, dayOfWeek (0=Sun,6=Sat), notes }]

syncGymDays();

// Daisy pickup — recurring weekly Mon/Fri at 14:00 (short-day shape)
if (!S._daisyEvents) {

  const friExists = S.events.some(e => e.text === 'Daisy pickup' && e.repeat === 'weekly' && new Date(e.date+'T12:00:00').getDay() === 5);
  if (!monExists) {
    S.events.push({ id: uid(), text: 'Daisy pickup', date: nextDateOfWeekday(1), repeat: 'weekly', time: '14:00', reminder: null });
  }
  if (!friExists) {
    S.events.push({ id: uid(), text: 'Daisy pickup', date: nextDateOfWeekday(5), repeat: 'weekly', time: '14:00', reminder: null });
  }
  S._daisyEvents = true;
  // Persist migration + Daisy events immediately so we don't recreate on next load.
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch {}
}

// Countdown hero seeds (stag, baby due). Idempotent + re-applied after every sync pull.
if (ensureCountdowns()) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch {}
}

function syncGymDays() {
  // Remove all gym recurring tasks, re-create from S.gymDays
  S.recurring = S.recurring.filter(r => !r.id?.startsWith('rec_gym_'));
  for (const dow of S.gymDays) {
    S.recurring.push({ id: 'rec_gym_' + dow, text: 'Gym', cat: 'life', dur: 60, dayOfWeek: dow });

// saveLocal: persist without claiming sync authority. Automatic changes

function saveLocal() {

// ── ROLLING BACKUP (localStorage, no file downloads) ──
function rollingBackup() {
  const tk = today();
  const bkKey = 'dailyOS_bk_' + tk;
  // Only backup once per day
  if (localStorage.getItem(bkKey)) return;
  localStorage.setItem(bkKey, JSON.stringify(S));
  // Clean up old backups (keep last 3)
  const allKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('dailyOS_bk_')) allKeys.push(k);
  }
  allKeys.sort().reverse();
  allKeys.slice(3).forEach(k => localStorage.removeItem(k));
}

// ── EXPORT / IMPORT ──
function exportData() {
  const backup = {
    _type: 'dailyOS-backup',
    _v: DATA_VERSION,
    _exportedAt: new Date().toISOString(),
    data: S
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `daily-os-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  S._lastExport = new Date().toISOString();
  save();
  updateBackupLabel();
  showPa('Backup exported successfully.');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      let imported;
      if (parsed._type === 'dailyOS-backup' && parsed.data) {
        imported = parsed.data;
      } else if (parsed.done !== undefined || parsed.weekly !== undefined) {
        imported = parsed;
      } else {
        showPa('Invalid backup file.');
        return;
      }
      if (!confirm('This will replace ALL your current data. Are you sure?')) return;
      S = migrateState(imported);
      // Additive fields aren't part of migrateState — guard them so an older
      // backup can't leave rmEvent/toggle writing to undefined.
      if (!S.deletedSeeds) S.deletedSeeds = {};
      if (!S.carryTicked) S.carryTicked = {};
      save();
      render();
      showPa('Data imported successfully from backup.');
    } catch (err) {
      showPa('Failed to import: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('This will DELETE all your data (tasks, events, progress). Export a backup first!\n\nAre you absolutely sure?')) return;
  if (!confirm('Last chance. All data will be gone. Continue?')) return;

  }
}

function toDateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
Date.prototype.toLocalDate = function() { return toDateStr(this); };

function uid() { return Date.now().toString(36)+Math.random().toString(36).substr(2,5); }

// ── LIVE FIXTURE REFRESH (ESPN, keyless) ──
// TV picks move Premier League games, so the static table above goes stale —
// and cup ties (FA Cup, Carabao, Europe) only exist once draws are made.
// Every few days (per device — throttle lives in localStorage, not S, to avoid
// sync churn) pull the live schedules and update stored fixtures in place.
// The static table stays add-only; this is the only thing that updates existing
// fixture events. Fails silently on any network/shape problem and retries the
// throttle window next load (timestamp only written when the league feed
// succeeds — cup feed failures never block the stamp).
// Cup fixtures get a competition suffix in the text (e.g. " · FA Cup") so a
// league game and a cup tie against the same opponent at the same venue can
// never collide; eng.1 keeps the phase-1 canonical text exactly for backward
// compat with events already stored on devices.
const MUFC_FIXTURE_CHECK_LS = 'dailyOS_mufcFixtureCheck';
const MUFC_COMPETITIONS = [
  { code:'eng.1',          suffix:'' },
  { code:'eng.fa',         suffix:' · FA Cup' },
  { code:'eng.league_cup', suffix:' · Carabao Cup' },
  { code:'uefa.champions', suffix:' · Champions League' },
  { code:'uefa.europa',    suffix:' · Europa League' },
];
async function refreshMufcFixtures() {
  try {
    const last = localStorage.getItem(MUFC_FIXTURE_CHECK_LS);
    if (last && Date.now() - new Date(last).getTime() < 3 * 24 * 60 * 60 * 1000) return;
    // ESPN full names → the short names used in the fixture table. Anything not
    // listed already matches the table verbatim (Hull City, Ipswich Town, …).
    const MUFC_ALIASES = {
      'Manchester City': 'Man City',
      'Tottenham Hotspur': 'Tottenham',
      'AFC Bournemouth': 'Bournemouth',
      'Brighton & Hove Albion': 'Brighton',
      'Newcastle United': 'Newcastle',
      'West Ham United': 'West Ham',
      'Wolverhampton Wanderers': 'Wolves',
      'Manchester United': 'Man Utd',
    };
    const todayStr = toDateStr(new Date());
    const fixtures = []; // { text, date, time } across all competitions
    let leagueOk = false;
    // Each competition is fetched + parsed in its own try/catch: one feed
    // failing (or returning an unexpected shape) must not affect the others.
    // Empty events arrays are normal (no draw yet / not in the competition).
    await Promise.all(MUFC_COMPETITIONS.map(async cmp => {
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/' + cmp.code + '/teams/360/schedule?fixture=true');
        if (!res.ok) return;
        const json = await res.json();
        if (!json || !Array.isArray(json.events)) return;
        json.events.forEach(event => {
          const comp = event.competitions && event.competitions[0];
          if (!event.date || !comp || !Array.isArray(comp.competitors)) return;
          const utd = comp.competitors.find(c => c.team && c.team.id === '360');
          const opp = comp.competitors.find(c => c.team && c.team.id !== '360');
          if (!utd || !opp) return;
          const ko = new Date(event.date); // UTC kickoff → device-local date/time
          const dateStr = toDateStr(ko);
          // Stale-season guard: cup feeds serve LAST season until ESPN rolls
          // them over. Never add or update past fixtures.
          if (dateStr < todayStr) return;
          const oppName = MUFC_ALIASES[opp.team.displayName] || opp.team.displayName;
          const text = (utd.homeAway === 'home'
            ? 'Man Utd vs ' + oppName + ' (H)'
            : oppName + ' vs Man Utd (A)') + cmp.suffix;
          fixtures.push({
            text,
            date: dateStr,
            time: String(ko.getHours()).padStart(2, '0') + ':' + String(ko.getMinutes()).padStart(2, '0'),
          });
        });
        if (cmp.code === 'eng.1') leagueOk = true;
      } catch (e) { /* per-competition isolation: swallow and move on */ }
    }));
    if (leagueOk) localStorage.setItem(MUFC_FIXTURE_CHECK_LS, new Date().toISOString());
    if (_applyingRemote) return; // a sync pull is mid-flight; try again next window
    // Group by canonical text: one text can carry two future fixtures (e.g.
    // UCL league-phase home vs X plus a knockout home leg vs X). Pair stored
    // events and API fixtures in date order; update pairs in place, add any
    // unpaired API fixtures. Never delete.
    const byText = new Map();
    fixtures.forEach(f => {
      if (!byText.has(f.text)) byText.set(f.text, []);
      byText.get(f.text).push(f);
    });
    let changed = false;
    byText.forEach((apiList, text) => {
      apiList.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      const stored = S.events
        .filter(e => e.mufc && e.text === text)
        .sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
      apiList.forEach((f, i) => {
        const ev = stored[i];
        if (ev) {
          if (ev.date !== f.date || ev.time !== f.time) {
            ev.date = f.date;
            ev.time = f.time;
            changed = true;
          }
        } else if (!S.deletedSeeds[f.text]) {
          if (!ensureEvent(f.text, { text:f.text, date:f.date, repeat:'none', mufc:true, time:f.time, quiet:true })) {
            // ensureEvent dedupes by text, so a SECOND fixture sharing a text
            // (e.g. added moments ago in this loop) must be pushed directly
            // using the same id/shape ensureEvent uses.
            S.events.push({ id: uid(), text: f.text, date: f.date, repeat:'none', mufc:true, time: f.time, quiet:true });
          }
          changed = true;
        }
      });
      // Never delete: stored fixtures missing from the API are left alone.
    });
    // saveLocal, NOT save(): fixture corrections are auto-derived on every
    // device — pushing them let a stale device clobber the cloud (8 Jul 2026).
    if (changed) { saveLocal(); render(); }
  } catch (e) {
    console.warn('MUFC fixture refresh failed', e);
  }
}

// ── CARRY-OVER ──
// Any custom task left unticked on yesterday's (or the day before's) list
// surfaces at the top of today with a ↩ YESTERDAY chip. Same task, not a copy:
// ticking it marks it done for its home day. Recurring tasks never carry (they
// recur anyway). A task follows for at most 2 days. Parking Lot tasks carry
// separately with no day cap — see getParkingCarries().
function getCarryTasks() {
  if (viewDay !== today()) return [];
  const out = [];
  for (let back = 2; back >= 1; back--) {
    const d = new Date();
    d.setDate(d.getDate() - back);
    const dk = toDateStr(d);
    const dismissed = (S.carryDismissed || {})[dk] || {};
    for (const t of ((S.custom[dk] || {}).list) || []) {
      if (dismissed[t.id]) continue;
      // Ticked TODAY stays visible (struck through) until the day rolls over;
      // ticked on an earlier day (or on its own home day) stays hidden.
      if (isDone(t.id, dk) && (S.carryTicked || {})[t.id] !== today()) continue;
      out.push({ ...t, _type: 'c', _home: dk });
    }
  }
  return out;
}

// Parking Lot carry-over: a user-parked task left unticked keeps following
// into today's Parking Lot until it's ticked or dismissed — no day cap
// (it's "if I get time" work, so it waits). Template rows re-render daily
// anyway and live outside S.custom, so only user-added tasks are scanned.
function getParkingCarries() {
  if (viewDay !== today()) return [];
  const tk = today();
  // Seed with today's own parking ids: if a purge-rescued task's old home day
  // gets resurrected by a stale-device cloud pull, it must not ALSO surface
  // as a carry alongside today's physical copy.
  const seen = new Set(((((S.custom[tk]) || {}).parking) || []).map(t => t.id));
  const out = [];
  for (const dk of Object.keys(S.custom).sort()) {
    if (dk >= tk) continue;
    const dismissed = (S.carryDismissed || {})[dk] || {};
    for (const t of (S.custom[dk].parking) || []) {
      if (dismissed[t.id] || seen.has(t.id)) continue;
      // Same visibility rule as getCarryTasks: ticked today stays visible.
      if (isDone(t.id, dk) && (S.carryTicked || {})[t.id] !== today()) continue;
      seen.add(t.id);
      out.push({ ...t, _type: 'c', _home: dk });
    }
  }
  return out;
}

function dismissCarry(homeDay, tid) {
  if (!S.carryDismissed[homeDay]) S.carryDismissed[homeDay] = {};
  S.carryDismissed[homeDay][tid] = true;

}

// Chip text for a carried row: "YESTERDAY" if it's from yesterday, otherwise

function carryChipLabel(home) {
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (home === toDateStr(y)) return 'YESTERDAY';
  return new Date(home + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }).toUpperCase();
}

function toggleDayOff(dayStr) {

}

function detectCat(text) {
  const l = text.toLowerCase();
  for (const [cat, kws] of Object.entries(CAT_KW)) {
    for (const k of kws) { if (l.includes(k)) return cat; }
